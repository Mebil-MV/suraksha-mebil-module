<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <!-- Sky -->
  <rect x="0" y="0" width="300" height="200" fill="#fef3c7" />
  <!-- Ground -->
  <rect x="0" y="160" width="300" height="40" fill="#92400e" />
  <!-- House walls -->
  <rect x="60" y="60" width="180" height="110" fill="#fde68a" stroke="#92400e" stroke-width="2" rx="2" />
  <!-- Roof -->
  <polygon points="50,62 150,10 250,62" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
  <!-- Door -->
  <rect x="130" y="110" width="40" height="60" fill="#78350f" rx="3" />
  <circle cx="163" cy="142" r="3" fill="#fbbf24" />
  <!-- Windows -->
  <rect x="80" y="85" width="35" height="30" fill="#bfdbfe" stroke="#92400e" stroke-width="1.5" rx="2" />
  <line x1="97" y1="85" x2="97" y2="115" stroke="#92400e" stroke-width="1" />
  <line x1="80" y1="100" x2="115" y2="100" stroke="#92400e" stroke-width="1" />
  <rect x="185" y="85" width="35" height="30" fill="#bfdbfe" stroke="#92400e" stroke-width="1.5" rx="2" />
  <line x1="202" y1="85" x2="202" y2="115" stroke="#92400e" stroke-width="1" />
  <line x1="185" y1="100" x2="220" y2="100" stroke="#92400e" stroke-width="1" />
  <!-- Cracks propagating with shaking -->
  <path d="M85 65 L90 85 L82 100 L92 120" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M210 70 L215 88 L205 105 L218 125" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M150 55 L148 40 L155 30" stroke="#991b1b" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Seismic waves (Animated SMIL) -->
  <path d="M10 175 Q25 168 40 175 T70 175 T100 175" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.8">
    <animate attributeName="d" values="M10 175 Q25 168 40 175 T70 175 T100 175;M10 175 Q25 182 40 175 T70 175 T100 175;M10 175 Q25 168 40 175 T70 175 T100 175" dur="0.5s" repeatCount="indefinite" />
  </path>
  <path d="M200 175 Q215 168 230 175 T260 175 T290 175" stroke="#ef4444" stroke-width="3" fill="none" opacity="0.8">
    <animate attributeName="d" values="M200 175 Q215 168 230 175 T260 175 T290 175;M200 175 Q215 182 230 175 T260 175 T290 175;M200 175 Q215 168 230 175 T260 175 T290 175" dur="0.5s" repeatCount="indefinite" />
  </path>
  <!-- Falling roof debris (Animated SMIL) -->
  <rect x="120" y="30" width="6" height="6" fill="#78350f" transform="rotate(25,123,33)">
    <animate attributeName="y" values="30;50;30" dur="1s" repeatCount="indefinite" />
  </rect>
  <rect x="190" y="25" width="5" height="5" fill="#78350f" transform="rotate(-15,192,27)">
    <animate attributeName="y" values="25;48;25" dur="0.8s" repeatCount="indefinite" />
  </rect>
  <!-- Zone label -->
  <text x="150" y="195" text-anchor="middle" font-size="11" fill="#fef3c7" font-weight="bold" font-family="sans-serif">⚡ EARTHQUAKE ZONE ⚡</text>
</svg>
