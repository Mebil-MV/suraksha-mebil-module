
<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
       <title>Earthquake Safety — Building Elevation</title>
       <style>
              :root {
                     --bg: #f4f1ea;
                     --fg: #2a2f38;
                     box-sizing: border-box;
                     padding-top: env(safe-area-inset-top, 0px);
                     padding-bottom: env(safe-area-inset-bottom, 0px)
              }

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

<body>

       <div id="start-overlay"><button id="start-btn">▶ Play Animation & Audio</button></div>
       <div class="bar">
              <button id="pp" disabled>Play</button>
              <!-- Extended slider max to 16.5 seconds -->
              <input id="sk" type="range" min="0" max="20" step="0.01" value="0" disabled>
              <span id="tm">0.0s</span>
              <button id="lang">Voice & captions: English</button>
       </div>
<p id="note" style="max-width:1280px;font-size:13px;opacity:.75"></p><script>
const W=1280,H=720,D=20,TAU=Math.PI*2,cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;

let showHindi=false;

function poly(p,c){ctx.fillStyle=c;ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}

const ground=[[ -250,390],[90,450],[320,556],[530,556],[730,465],[940,310],[1240,310],[1500,350]];
function terrain(){poly([...ground,[1500,950],[-250,950]],'#71573c');for(let i=0;i<ground.length-1;i++){let a=ground[i],b=ground[i+1],m=[(a[0]+b[0])/2,a[1]+150];tri(a,b,m,sh('#826244',.8+hs(i)*.6,0));tri(a,m,[a[0],900],sh('#6b4f32',.8+hs(i+9)*.5,0));line([a,b],'#688b50',13)}for(let i=0;i<26;i++){let x=-150+hs(i+12)*1550,y=650+hs(i+66)*240;poly([[x,y],[x+17,y-9],[x+32,y+12],[x+8,y+18]],'#8a7254')}}
function house(x,y,s,safe){ctx.save();ctx.translate(x,y);ctx.scale(s,s);poly([[-77,-5],[58,-5],[92,-26],[-41,-26]],'#4b514c');poly([[-70,0],[50,0],[50,-104],[-70,-104]],safe?'#e6d6af':'#d8b586');poly([[50,0],[88,-24],[88,-125],[50,-104]],'#aa956f');poly([[-90,-100],[-10,-164],[65,-100]],safe?'#407479':'#aa5141');poly([[-10,-164],[28,-182],[104,-122],[65,-100]],safe?'#315960':'#7d3e36');poly([[-90,-100],[65,-100],[65,-91],[-90,-91]],'#533e34');ctx.fillStyle='#5e4533';ctx.fillRect(-8,-66,32,66);for(let a of [-52,29]){ctx.fillStyle='#294f65';ctx.fillRect(a,-84,23,26);line([[a+11,-83],[a+11,-59]],'#b4d7da',2)}ctx.restore()}
function person(x,y,t){ctx.save();ctx.translate(x,y);line([[-10,0],[-8,-29],[0,-42],[9,-28],[13,0]],'#263f53',8);poly([[-13,-31],[12,-31],[15,-64],[-12,-64]],'#edb848');line([[-10,-59],[-26,-72],[-32,-94]],'#dfaf88',7);let w=Math.sin(t*11)*13;line([[11,-59],[28,-78],[35+w,-103]],'#dfaf88',7);poly([[-10,-75],[-12,-88],[-2,-97],[10,-89],[10,-76],[0,-70]],'#e6b58f');poly([[-12,-87],[-9,-96],[3,-99],[12,-91],[10,-85]],'#49392e');ctx.restore()}

function storey(w,h,depth,color,crack=0){let x=-w/2;poly([[x,0],[x+w,0],[x+w+depth,-depth*.5],[x+depth,-depth*.5]],'#87795d');poly([[x,0],[x+w,0],[x+w,-h],[x,-h]],color);poly([[x+w,0],[x+w+depth,-depth*.5],[x+w+depth,-h-depth*.5],[x+w,-h]],'#a38f6c');poly([[x,-h],[x+w,-h],[x+w+depth,-h-depth*.5],[x+depth,-h-depth*.5]],'#e2cca0');ctx.fillStyle='#b3996d';ctx.fillRect(x-5,-h-3,w+10,8);for(let i=0;i<Math.max(2,Math.floor(w/54));i++){let n=Math.max(2,Math.floor(w/54)),xx=x+19+i*(w-32)/n;ctx.fillStyle='#32596c';ctx.fillRect(xx,-h+21,25,28);line([[xx+12,-h+22],[xx+12,-h+48]],'#b1d5d7',2);line([[xx,-h+35],[xx+25,-h+35]],'#b1d5d7',2)}if(crack){ctx.save();ctx.globalAlpha=crack;line([[x+w*.6,-h+3],[x+w*.52,-h+20],[x+w*.58,-h+31],[x+w*.49,-h+45],[x+w*.55,-h+60]],'#61452f',4);ctx.restore()}}
function tower(x,y,widths,t,bad=false){ctx.save();ctx.translate(x,y);let sh=bad?cl((t-1.8)/1):cl((t-10.7)/.5)*(1-cl((t-14.5)/1.4));let sway=Math.sin(t*12)*sh*(bad?.035:.003);ctx.rotate(sway);poly([[-widths[0]/2-24,8],[widths[0]/2+32,8],[widths[0]/2+61,-7],[-widths[0]/2+9,-7]],'#726c57');let fail=bad?sm(cl((t-5.0)/2.6)):0;for(let i=0;i<widths.length;i++){ctx.save();ctx.translate(Math.sin(t*13-i*.6)*sh*(bad?i*3:0),-i*78);if(bad&&i>=2){ctx.translate((i-1)*fail*52,fail*(i-1)*55);ctx.rotate(fail*(i-1)*.19)}storey(widths[i],78,30,bad?'#ddc59c':i%2?'#ded7b7':'#e7dbb9',bad&&t>3?cl((t-3)/2):0);ctx.restore()}ctx.restore();if(bad&&t>5.2){let q=cl((t-5.2)/2.4);for(let j=0;j<18;j++){let tt=cl((t-5.2-hs(j)*1.3)/1.4),xx=x+75+hs(j+22)*150+tt*(hs(j+3)-.2)*170,yy=Math.min(y+5,y-180+tt*tt*380);if(tt>0){ctx.save();ctx.translate(xx,yy);ctx.rotate(t*(hs(j+2)*3+1));poly([[-8,-5],[5,-9],[11,4],[-4,8]],j%2?'#a88e68':'#d9bd91');ctx.restore()}}ctx.save();ctx.globalAlpha=q*.23;for(let j=0;j<6;j++){ctx.fillStyle='#e8d7b6';ctx.beginPath();ctx.ellipse(x+100+j*22,y-5,30+q*20,12+q*10,0,0,TAU);ctx.fill()}ctx.restore()}}
function world(t){let safe=t>=10,g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,safe?'#9fc2c3':'#b9a68a');g.addColorStop(1,'#f0dfb5');ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);poly([[0,385],[170,270],[420,400],[650,285],[870,397]],'#94a08b');poly([[720,400],[1050,280],[1280,355],[1280,550]],'#a6b29a');let amp=t>1.8&&t<10?4*cl((t-1.8)/1):t>10.7&&t<14.5?1.4:0;ctx.save();ctx.translate(Math.sin(t*41)*amp,Math.sin(t*55)*amp*.4);poly([[0,468],[1280,420],[1280,720],[0,720]],'#967f59');tri([0,468],[420,450],[590,720],'#b19a71');tri([420,450],[900,435],[590,720],'#bda77d');tri([900,435],[1280,420],[1280,720],'#a18c65');if(!safe){tower(590,570,[130,230,270,300],t,true);if(t>4)line([[0,600],[145,594],[260,613],[410,598],[550,623],[770,607],[900,625],[1100,607],[1280,622]],'#655039',4)}else{tower(390,570,[185,185,185,185],t);tower(865,570,[270,220,170,120],t)}ctx.restore();if(!safe){badge(showHindi?'ऊपर अधिक भार और चौड़ाई':'WIDER UPPER STOREYS',935,355,'#ff6d64',21);if(t>4.2)symbol(920,454,false,t)}else{badge(showHindi?'समान चौड़ाई':'UNIFORM WIDTH',400,614,'#54e296',21);badge(showHindi?'नीचे अधिक चौड़ाई':'WIDER AT THE BASE',880,614,'#54e296',21);if(t>11.5){symbol(565,294,true,t);symbol(1070,294,true,t)}}}
function caption(s){ctx.font='600 25px system-ui,sans-serif';let lines=[''];for(let word of s.split(' ')){let i=lines.length-1,v=lines[i]+(lines[i]?' ':'')+word;if(ctx.measureText(v).width>1120)lines.push(word);else lines[i]=v}let h=lines.length*33+22;ctx.fillStyle='rgba(8,14,24,.85)';rr(42,705-h,1196,h,14);ctx.fill();lines.forEach((v,i)=>text(v,640,705-h+34+i*33,25))}
function frame(t){ctx.setTransform(dpr,0,0,dpr,0,0);world(t);text('EARTHQUAKE SAFETY / BUILDING ELEVATION',640,40,20,'#263b3b');if(t<10){badge(showHindi?'ऊपर से भारी, बाहर निकली मंजिलों से बचें':'Avoid top-heavy buildings with overhangs',640,120,'#ff5962',29);text(showHindi?'ऊपरी मंजिलों के बाहर निकलने से खतरा बढ़ सकता है':'Overhanging upper storeys can increase vulnerability',640,168,22,'#41473f')}else{badge(showHindi?'हर मंजिल की चौड़ाई ऊपर की मंजिल से कम न हो':'Width should be at least that of the storey above',640,120,'#54e296',27);text(showHindi?'सही संरचनात्मक डिजाइन और अच्छी निर्माण गुणवत्ता जरूरी':'Engineered design and sound construction are essential',640,169,22,'#33473d')}
if(t>=17){let a=sm(cl((t-17)/.5));ctx.save();ctx.globalAlpha=a;let bg=ctx.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#cbe9f2');bg.addColorStop(1,'#edf5ed');ctx.fillStyle=bg;ctx.fillRect(0,0,1280,720);ctx.translate(640,263);let s=sm(cl((t-17)/.65));ctx.scale(s,s);fan([[0,-125],[103,-83],[94,32],[60,95],[0,136],[-60,95],[-94,32],[-103,-83]],[0,0],'#279e5d',1,0);line([[-43,0],[-10,36],[52,-42]],'#fff',19);ctx.restore();ctx.save();ctx.globalAlpha=a;text(showHindi?'सतर्क रहें। सुरक्षित रहें।':'Stay Alert. Stay Safe.',640,495,52,'#1f443e');ctx.restore()}if(t<17)caption((showHindi?VH:VE)[t<10?0:1]);}

              // ---- Audio: synthesized SFX + browser speech voiceover ----
              let ac, rumG, rainG, voices = [];
              if (window.speechSynthesis) {
                     const loadVoices = () => voices = speechSynthesis.getVoices();
                     speechSynthesis.onvoiceschanged = loadVoices;
                     loadVoices();
              }

              function initAudio() {
                     try {
                            ac = new (window.AudioContext || window.webkitAudioContext)(); const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++)d[i] = Math.random() * 2 - 1;

                     } catch (e) { ac = null }
              }

              function tone(f, d, v, type, delay = 0) { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + delay; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d + .05) }

              function speak(i) {
                     if (!window.speechSynthesis) return;

                     speechSynthesis.cancel();

                     setTimeout(() => {
                            const u = new SpeechSynthesisUtterance((showHindi ? VH : VE)[i]);
                            u.lang = showHindi ? 'hi-IN' : 'en-US';
                            u.rate = i === 1 ? 1.22 : 1.0;
                            u.pitch = 1.0;

                            const targetLang = showHindi ? 'hi' : 'en';

                            let bestVoice = voices.find(v => v.lang.toLowerCase().includes(targetLang) && v.localService && (v.name.includes('Google') || v.name.includes('Neural')));
                            if (!bestVoice) bestVoice = voices.find(v => v.lang.toLowerCase().includes(targetLang) && v.localService);
                            if (!bestVoice) bestVoice = voices.find(v => v.lang.toLowerCase().includes(targetLang));

                            if (bestVoice) u.voice = bestVoice;
                            speechSynthesis.speak(u);
                     }, 40);
              }


const EV=[[.15,'v',0],[2.4,'g'],[3.7,'k'],[4.2,'b'],[5.3,'k'],[5.8,'k'],[6.1,'k'],[6.5,'g'],[7.1,'b'],[10.1,'v',1],[11.5,'c'],[17.3,'v',2],[17.2,'c']];

function audioTick(t){if(!ac||!rainG)return;rainG.gain.setTargetAtTime(playing&&t>3&&t<9.5?.015*(.3+.7*Math.abs(Math.sin(t*9))):0,ac.currentTime,.1);rumG.gain.setTargetAtTime(playing&&t>1.4&&t<14?(t<10?.7*cl((t-1.4)/1.5):.3*(1-cl((t-10)/4))):0,ac.currentTime,.12)}
let t=0,pt=-.01,playing=false,last=performance.now();const pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),btnL=document.getElementById('lang'),overlay=document.getElementById('start-overlay');

document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';initAudio();pp.disabled=sk.disabled=false;play()};

if(window.speechSynthesis)speechSynthesis.addEventListener('voiceschanged',voiceStatus);voiceStatus();
function loop(n){let dt=Math.min((n-last)/1000,.1);last=n;if(playing){t=Math.min(D,t+dt);for(let e of EV)if(pt<e[0]&&e[0]<=t)fire(e);pt=t;sk.value=t;if(t>=D){playing=false;pp.textContent='Replay';stopSpeech()}}audioTick(t);frame(t);tm.textContent=t.toFixed(1)+' / 20.0s';requestAnimationFrame(loop)}requestAnimationFrame(loop);
