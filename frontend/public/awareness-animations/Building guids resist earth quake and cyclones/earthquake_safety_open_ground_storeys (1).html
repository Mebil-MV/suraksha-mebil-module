              :root {

                     --fg: #2a2f38;

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

const stopSpeech=()=>{if(window.speechSynthesis)speechSynthesis.cancel()};
function play(){if(t>=D){t=0;pt=-.01}playing=true;last=performance.now();if(ac)ac.resume();pp.textContent='Pause';if(t>.2){let i=t<10?0:t<17?1:2;let ev=EV.find(e=>e[1]==='v'&&e[2]===i);if(t>=ev[0])speak(i)}}
document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';initAudio();pp.disabled=sk.disabled=false;play()};
pp.onclick=()=>{if(playing){playing=false;stopSpeech();pp.textContent='Play';if(ac)ac.suspend()}else play()};
sk.oninput=()=>{playing=false;stopSpeech();t=+sk.value;pt=t;pp.textContent='Play';if(ac)ac.suspend();frame(t)};
btnL.onclick=()=>{showHindi=!showHindi;btnL.textContent=showHindi?'Voice & captions: हिन्दी':'Voice & captions: English';stopSpeech();if(playing)speak(t<10?0:t<17?1:2);voiceStatus()};
function voiceStatus(){let ok=window.speechSynthesis&&speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith(showHindi?'hi':'en'));document.getElementById('note').textContent=ok?'Narration uses your browser’s '+(showHindi?'Hindi':'English')+' voice. Earthquake rumble and chimes are synthesized.':'No '+(showHindi?'Hindi':'English')+' voice detected. Install a matching system voice for narration; captions remain available.'}
if(window.speechSynthesis)speechSynthesis.addEventListener('voiceschanged',voiceStatus);voiceStatus();
function loop(n){let dt=Math.min((n-last)/1000,.1);last=n;if(playing){t=Math.min(D,t+dt);for(let e of EV)if(pt<e[0]&&e[0]<=t)fire(e);pt=t;sk.value=t;if(t>=D){playing=false;pp.textContent='Replay';stopSpeech()}}audioTick(t);frame(t);tm.textContent=t.toFixed(1)+' / 20.0s';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
