<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
       <title>Health Risks, Diet & Care</title>
       <style>
              :root {
                     --bg: #f4f1ea;
                     --fg: #2a2f38;
                     box-sizing: border-box;
                     padding-top: env(safe-area-inset-top, 0px);
                     padding-bottom: env(safe-area-inset-bottom, 0px)
              }

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

<body>
       <canvas id="c" width="1280" height="720"></canvas>
       <div id="start-overlay"><button id="start-btn">▶ Play Animation & Audio</button></div>
       <div class="bar">
              <button id="pp" disabled>Play</button>
              <!-- Twenty-second timeline -->
              <input id="sk" type="range" min="0" max="20" step="0.01" value="0" disabled>
              <span id="tm">0.0s</span>
              <button id="lang">Hindi Subtitles: Off</button>
       </div>
       <script>
              const cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = 1280, H = 720, D = 20, dpr = Math.min(devicePixelRatio || 1, 2); cv.width = W * dpr; cv.height = H * dpr;

                     [3.5, 9.8, 'Eat healthy food and have regular hot drinks. Avoid alcohol.', 'पौष्टिक भोजन और गर्म पेय लें। शराब से बचें।'],

                            label('Drink Hot Fluids', 'गर्म पेय पिएँ', 460, 110); label('Healthy Food', 'पौष्टिक भोजन', 80, 540); rect(945, 360, 50, 92, '#738b80', 7); rect(958, 334, 24, 28, '#738b80'); ctx.strokeStyle = '#d66759'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(970, 398, 65, 0, 7); ctx.stroke(); line([[924, 444], [1015, 352]], '#d66759', 7); txt(showHindi ? 'शराब से बचें' : 'AVOID ALCOHOL', 970, 502, 23, '#5f5048'); badge('', 845, 319)
                     }

                            ctx.restore();

                     }
