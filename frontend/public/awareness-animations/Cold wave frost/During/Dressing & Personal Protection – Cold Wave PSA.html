<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dressing &amp; Personal Protection – Cold Wave PSA</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2f38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{display:flex;flex-direction:column;align-items:center;padding:12px;position:relative}

.bar input{flex:1;min-width:120px}

#ov{position:absolute;top:12px;left:12px;right:12px;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:rgba(0,0,0,.65);border-radius:10px;display:flex;justify-content:center;align-items:center;z-index:10}
#ov button{background:#f4ead2;color:#14181e;border:none;padding:16px 32px;font-size:22px;font-weight:600;border-radius:50px}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="ov"><button id="sb">▶ Play Animation &amp; Audio</button></div>
<div class="bar"><button id="pp" disabled>Play</button><input id="sk" type="range" min="0" max="23" step="0.01" value="0" disabled><span id="tm">0.0s</span><button id="lang">Hindi Subtitles: Off</button></div>
<script>
const W=1280,H=720,D=23,TAU=Math.PI*2,cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lp=(a,b,k)=>a+(b-a)*k,sm=k=>k*k*(3-2*k),mod=(a,n)=>((a%n)+n)%n;
function hs(n){n|=0;n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return(n>>>0)/4294967296}
const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),mx=(a,b,k)=>a.map((v,i)=>lp(v,b[i],k)),rg=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const sh=(c,f,k)=>rg(mx(hx(c),[22,32,44],k*.45).map(v=>Math.min(255,v*f)));
const tri=(a,b,c,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.fill()};
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
const fan=(P,c,col,f,k)=>{for(let i=0;i<P.length;i++)tri(c,P[i],P[(i+1)%P.length],sh(col,f+(hs(i*7+P[0][0]|0)-.5)*.35,k))};
const oct=(x,y,r,s=1)=>{const P=[];for(let i=0;i<8;i++){const a=i/8*TAU+.4;P.push([x+Math.cos(a)*r,y+Math.sin(a)*r*s])}return P};
const bo=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375};

const VE=['During a cold wave, stay indoors and minimize travel.','Wear multiple layers of loose-fitting clothing; avoid tight clothes as they reduce blood circulation.','Prefer mittens over gloves to retain more warmth.','Keep your skin moisturized regularly with oil or petroleum jelly.','Majority of heat loss happens through the head and extremities, so keep them dry and change out of wet clothes immediately.'];
const VH=['शीत लहर के दौरान घर के अंदर रहें और यात्रा कम से कम करें।','ढीले-ढाले कपड़ों की कई परतें पहनें; तंग कपड़ों से बचें, क्योंकि वे रक्त संचार घटाते हैं।','अधिक गर्मी के लिए दस्तानों की जगह मिटन्स को चुनें।','तेल या पेट्रोलियम जेली से अपनी त्वचा को नियमित रूप से मॉइस्चराइज़ करें।','शरीर की अधिकतर गर्मी सिर और हाथ-पैरों से निकलती है, इसलिए इन्हें सूखा रखें और गीले कपड़े तुरंत बदलें।'];
const CT=[[.3,3.2],[3.3,9],[9.1,12],[12.1,16.2],[16.3,22.4]];
const LTE=['Wear loose, multiple layers','Prefer mittens over gloves','Moisturize skin','Change wet clothes instantly'];
const LTH=['ढीली, कई परतें पहनें','दस्तानों से बेहतर मिटन्स चुनें','त्वचा को मॉइस्चराइज़ करें','गीले कपड़े तुरंत बदलें'];
const LB=[[4.2,9],[9.2,11.9],[12.5,16.2],[16.8,22.4]];
let showHindi=false;

// ---------- scenery ----------
function peak(cx,top,w,base,c,k){const T=[cx,top],L=[cx-w/2,base],R=[cx+w/2,base],M=[cx+w*.05,top+(base-top)*.5],B=[cx-w*.12,base],N=[cx-w*.14,top+(base-top)*.42];
tri(T,L,N,sh(c,1.15,k));tri(T,N,M,sh(c,.95,k));tri(T,M,R,sh(c,.7,k));tri(L,N,B,sh(c,.9,k));tri(N,M,B,sh(c,.8,k));tri(M,R,B,sh(c,.6,k))}
function snowTree(x,y,s,k){ctx.fillStyle=sh('#5b4130',1,k);ctx.fillRect(x-3*s,y-22*s,6*s,22*s);for(let j=0;j<3;j++){const b=y-12*s-j*18*s,w=(36-j*8)*s;tri([x-w/2,b],[x,b-30*s],[x+w/2,b],sh('#2f6b55',.8+j*.18,k));tri([x-w*.25,b-12*s],[x,b-30*s],[x+w*.25,b-12*s],'#f2f7fa')}}
function outdoor(t){const k=.3;
 peak(250,220,800,640,'#a9bfd3',k);peak(900,190,900,640,'#9bb3c9',k);peak(1400,250,700,640,'#b8cadb',k);peak(580,320,520,640,'#c8d6e3',k);
 ctx.fillStyle=sh('#e9f0f5',1,k);ctx.fillRect(-700,640,3000,900);
 for(let x=-700;x<1900;x+=100){tri([x,640],[x+100,640],[x+50,740+hs(x)*40],sh('#dce6ee',.9+.2*hs(x),k));tri([x,640],[x+50,740+hs(x)*40],[x-30,760],sh('#cfdbe6',.9+.2*hs(x+1),k))}
 for(const x of[-250,-90,120,1050,1190,1380,1560])snowTree(x,650,1.4,k)}
function indoor(t){const g=ctx.createLinearGradient(0,-200,0,640);g.addColorStop(0,'#f6dcb4');g.addColorStop(1,'#efc08a');ctx.fillStyle=g;ctx.fillRect(-700,-300,3000,940);
 ctx.fillStyle='#7a5230';ctx.fillRect(850,150,280,260);const wg=ctx.createLinearGradient(0,160,0,400);wg.addColorStop(0,'#9db8cf');wg.addColorStop(1,'#e6eef3');ctx.fillStyle=wg;ctx.fillRect(862,162,256,236);
 ctx.fillStyle='#7a5230';ctx.fillRect(986,162,12,236);ctx.fillRect(862,276,256,12);
 for(let i=0;i<14;i++){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(870+hs(i)*240,170+mod(hs(i+2)*230+t*30,226),2.5,0,TAU);ctx.fill()}
 tri([830,150],[900,150],[830,420],sh('#c0504d',1,0));tri([1150,150],[1080,150],[1150,420],sh('#a8443f',1,0));
 ctx.fillStyle=sh('#a8764a',1,0);ctx.fillRect(-700,640,3000,900);
 for(let x=-700;x<1900;x+=120){tri([x,640],[x+120,640],[x+60,760],sh('#b8845a',.85+.3*hs(x),0));tri([x,640],[x+60,760],[x-60,760],sh('#946036',.85+.3*hs(x+1),0))}
 ctx.fillStyle='rgba(192,80,77,.85)';ctx.beginPath();ctx.ellipse(640,668,330,46,0,0,TAU);ctx.fill();
 const lg=ctx.createRadialGradient(250,250,10,250,250,260);lg.addColorStop(0,'rgba(255,240,170,.75)');lg.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=lg;ctx.fillRect(-20,-20,540,540);
 ctx.fillStyle='#5b4130';ctx.fillRect(246,300,8,340);tri([200,300],[300,300],[270,230],sh('#f2c14e',1,0));tri([200,300],[230,230],[270,230],sh('#e0a33a',1,0));ctx.fillRect(222,636,56,8);
 fan([[1050,590],[1130,590],[1115,650],[1065,650]],[1090,620],'#c0654d',1,0);tri([1090,590],[1040,500],[1080,540],'#3f8a4a');tri([1090,590],[1140,490],[1100,540],'#2f7a3a');tri([1090,590],[1090,470],[1070,540],'#4f9a5a')}

// ---------- character ----------
function torso(w,c,k,p=1,len=-100){ctx.save();ctx.translate(0,-170);ctx.scale(p,p);ctx.translate(0,170);fan([[-46*w,-228],[46*w,-228],[56*w,len],[-56*w,len]],[0,-165],c,1,k);ctx.restore()}
function hand(x,y,kind,cream,k,t){
 if(kind==='mitten'){fan(oct(x,y,21),[x,y],'#e0453a',1,k);tri([x-5,y-14],[x+(x<0?-24:24),y-10],[x+(x<0?-10:10),y+4],sh('#e0453a',1.15,k))}
 else if(kind==='glove'){fan(oct(x,y,14),[x,y],'#3b3b44',1,k);ctx.strokeStyle='#22222a';ctx.lineWidth=3;for(let i=-1;i<=2;i++){ctx.beginPath();ctx.moveTo(x+i*5-2,y+6);ctx.lineTo(x+i*5-2,y+20);ctx.stroke()}}
 else{fan(oct(x,y,14),[x,y],cream?'#f6d6b8':'#e8b88a',1,k)}}
function badge(x,y,type,a,b,t){const al=Math.min(cl((t-a)/.25),cl((b-t)/.3));if(al<=0)return;const s=bo(cl((t-a)/.5));ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle=type==='x'?'#ff2a38':'#2fbf63';ctx.beginPath();ctx.arc(0,0,32,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 if(type==='x'){ctx.moveTo(-13,-13);ctx.lineTo(13,13);ctx.moveTo(13,-13);ctx.lineTo(-13,13)}else{ctx.moveTo(-15,1);ctx.lineTo(-4,12);ctx.lineTo(16,-12)}ctx.stroke();ctx.restore()}
function spark(x,y,r,a){if(a<=0)return;ctx.fillStyle=`rgba(255,250,210,${a})`;ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x+r*.25,y-r*.25);ctx.lineTo(x+r,y);ctx.lineTo(x+r*.25,y+r*.25);ctx.lineTo(x,y+r);ctx.lineTo(x-r*.25,y+r*.25);ctx.lineTo(x-r,y);ctx.lineTo(x-r*.25,y-r*.25);ctx.fill()}

function person(t){
 const ind=t>=12,k=ind?0:.3,cold=!ind&&t<5.4,sx=cold?Math.sin(t*38)*2.5:0;
 const sw=t>=5.4||ind,coat=!ind&&t>=6.8;
 const rub=ind?sm(cl((t-13.2)/.4))*(1-sm(cl((t-15)/.4))):0,face=ind?sm(cl((t-14.8)/.4))*(1-sm(cl((t-16.2)/.4))):0;
 const jWet=ind&&t>=16.6&&t<19.8,jDry=ind&&t>=19.8;
 const jx=jWet?-sm(cl((t-18.6)/1))*800:jDry?(1-sm(cl((t-19.8)/1)))*800:0;
 const base=coat?1.55:sw?1.3:1,ow=((jWet||jDry)&&Math.abs(jx)<300)?1.55:base;
 const hp=(s,w)=>{const dx=s*(64*w+6),dy=-112,rx=s*18,ry=-150+Math.sin(t*14+s)*7,fx=s*54,fy=-262+Math.sin(t*12+s)*6;return[lp(lp(dx,rx,rub),fx,face),lp(lp(dy,ry,rub),fy,face)]};
 const kind=ind?'bare':t>=10.4?'mitten':t>=9.6?'glove':'bare',cream=ind&&t>=13;
 ctx.save();ctx.translate(640+sx,650);
 for(const s of[-1,1]){fan([[s*4,-125],[s*50,-125],[s*52,-8],[s*8,-8]],[s*28,-70],'#34465f',1,k);fan([[s*6,0],[s*60,0],[s*56,-14],[s*8,-12]],[s*30,-6],'#2a2a2a',1,k)}
 torso(1,'#dfe6ee',k);
 if(sw)torso(1.3,'#c8504a',k,ind?1:bo(cl((t-5.4)/.5)));
 if(coat)torso(1.55,'#2f7fb0',k,bo(cl((t-6.8)/.5)),-85);
 const ac=coat?'#2f7fb0':sw?'#c8504a':'#dfe6ee';
 for(const s of[-1,1]){const[h0,h1]=hp(s,ow),sx0=s*46*Math.min(base,1.3);fan([[sx0-13,-224],[sx0+13,-224],[h0+11,h1+8],[h0-11,h1+8]],[(sx0+h0)/2,(-224+h1)/2],ac,1,k)}
 // neck + head
 fan([[-14,-250],[14,-250],[16,-226],[-16,-226]],[0,-238],'#d9a678',1,k);
 const hk=cold?'#e0b09a':'#e8b88a';fan(oct(0,-292,43),[0,-292],hk,1,k);
 fan([[-44,-295],[-30,-332],[0,-340],[30,-332],[44,-295],[0,-312]],[0,-320],'#3b2a22',1,k);
 ctx.fillStyle='#22262e';ctx.fillRect(-18,-290,6,9);ctx.fillRect(12,-290,6,9);
 if(cream&&t<16.8){const gl=.35+.2*Math.sin(t*8);ctx.fillStyle=`rgba(255,220,200,${face*.5+gl*.2})`;ctx.beginPath();ctx.arc(-26,-276,10,0,TAU);ctx.arc(26,-276,10,0,TAU);ctx.fill()}
 ctx.strokeStyle='#8a4a3a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-272,10,.2,Math.PI-.2);ctx.stroke();
 if(!ind&&t>=11.4){const p=bo(cl((t-11.4)/.4));fan([[-48,-246],[48,-246],[52,-224],[-52,-224]],[0,-235],'#8e44ad',1,k);fan([[18,-226],[46,-226],[50,-146*p],[22,-146*p]],[34,-190],'#8e44ad',1,k)}
 if(!ind&&t>=11){const p=bo(cl((t-11)/.4));ctx.save();ctx.translate(0,-300);ctx.scale(p,p);ctx.translate(0,300);fan([[-47,-292],[-34,-334],[0,-350],[34,-334],[47,-292],[0,-306]],[0,-325],'#e0a33a',1,k);fan(oct(0,-356,11),[0,-356],'#fff',1,k);ctx.restore()}
 // jackets
 const jacket=(c,wet)=>{ctx.save();ctx.translate(jx,0);const p=wet?bo(cl((t-16.6)/.5)):1;torso(1.55,c,0,p,-85);
  for(const s of[-1,1]){const h=hp(s,1.55),s0=s*70;fan([[s0-14,-224],[s0+14,-224],[h[0]+12,h[1]+8],[h[0]-12,h[1]+8]],[(s0+h[0])/2,(-224+h[1])/2],c,.95,0)}
  tri([-24,-228],[0,-200],[-46,-210],sh(c,1.2,0));tri([24,-228],[0,-200],[46,-210],sh(c,1.2,0));
  if(wet){for(let i=0;i<4;i++){tri([-90+i*60,-150+i%2*30],[-70+i*60,-150+i%2*30],[-80+i*60,-120+i%2*30],'#1a2a3c');const y=-85+mod(t*150+i*37,70);tri([-60+i*40,y],[-52+i*40,y],[-56+i*40,y+14],'#6fb4e8')}}
  else{const zp=cl((t-21)/.8);ctx.strokeStyle='#f4f4f4';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-85);ctx.lineTo(0,-85-140*zp);ctx.stroke();ctx.fillStyle='#ddd';ctx.fillRect(-5,-88-140*zp-8,10,16)}
  ctx.restore()};
 if(jWet)jacket('#2b3f55',true);if(jDry)jacket('#e08a2e',false);
 for(const s of[-1,1]){const[h0,h1]=hp(s,ow);hand(h0,h1,kind,cream,k,t)}
 // cream tube + dollop
 if(ind&&t>=12.5&&t<13.4){const a=Math.min(cl((t-12.5)/.3),cl((13.4-t)/.3));ctx.save();ctx.globalAlpha=a;ctx.translate(140,-170);ctx.rotate(-.5);ctx.fillStyle='#3aa6d9';rr(-40,-12,76,24,6);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(36,-8,16,16);ctx.restore();ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(hp(1,1.3)[0],hp(1,1.3)[1]-10,9*sm(cl((t-12.9)/.3)),0,TAU);ctx.fill()}
 if(ind&&t>=13.4&&t<16.8){const a=.5+.5*Math.sin(t*9);for(const s of[-1,1]){const h=hp(s,1.3);spark(h[0]+8,h[1]-10,14+a*8,.9);}
  if(face>.3){spark(-44,-296,14+a*8,face);spark(44,-262,12+(1-a)*8,face);spark(0,-318,10+a*6,face*.8)}}
 // breath
 if(!ind&&t<9)for(let i=0;i<3;i++){const u=mod(t*.7+i/3,1);ctx.fillStyle=`rgba(255,255,255,${.6*(1-u)})`;ctx.beginPath();ctx.arc(52+u*50,-270-u*30,6+u*14,0,TAU);ctx.fill()}
 ctx.restore();
 // badges (world coords)
 badge(640,470,'x',4,5.4,t);badge(640,470,'c',5.6,6.8,t);badge(640,470,'c',7,8.8,t);
 badge(745,490,'x',9.6,10.4,t);badge(745,490,'c',10.5,11.8,t);
 badge(640,400,'c',21.9,22.8,t)}

// ---------- overlays ----------
function labels(t){const T=showHindi?LTH:LTE;ctx.textAlign='left';
 LB.forEach(([a,b],i)=>{const al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)return;ctx.font='600 24px system-ui,sans-serif';const s=T[i],w=ctx.measureText(s).width+84,x=36-30*(1-al),y=96;
 ctx.save();ctx.globalAlpha=al;ctx.fillStyle='rgba(8,14,24,.78)';rr(x,y,w,46,12);ctx.fill();ctx.strokeStyle='#2fbf63';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#2fbf63';ctx.beginPath();ctx.arc(x+28,y+23,14,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+21,y+23);ctx.lineTo(x+26,y+29);ctx.lineTo(x+36,y+17);ctx.stroke();
 ctx.fillStyle='#f4ead2';ctx.fillText(s,x+54,y+31);ctx.restore()})}
function wrap(s,n){if(s.includes(' ')){const w=s.split(' '),L=[''];for(const x of w){if((L[L.length-1]+' '+x).trim().length>n)L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim()}return L}return[s]}

function frame(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);const ind=t>=12;
 const g=ctx.createLinearGradient(0,0,0,H);if(ind){g.addColorStop(0,'#f6dcb4');g.addColorStop(1,'#efc08a')}else{g.addColorStop(0,'#8fa9bf');g.addColorStop(.6,'#c9d9e4');g.addColorStop(1,'#eef3f7')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const kz=sm(cl((t-8.9)/.7))*(1-sm(cl((t-11.3)/.7))),kf=sm(cl((t-14.8)/.6))*(1-sm(cl((t-16.4)/.6)));
 const s=1+.55*kz+.35*kf,cy=lp(lp(360,500,kz),400,kf);
 ctx.save();ctx.translate(640,360);ctx.scale(s,s);ctx.translate(-640,-cy);ind?indoor(t):outdoor(t);person(t);ctx.restore();
 if(!ind){ctx.fillStyle='rgba(60,110,170,.14)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<140;i++){const y=mod(hs(i+3)*800+t*(90+hs(i+4)*120),780)-30,x=mod(hs(i+1)*1400+Math.sin(t*1.5+i)*20+y*.15,1400)-60;ctx.beginPath();ctx.arc(x,y,1.5+hs(i+5)*2.5,0,TAU);ctx.fill()}
  const wa=cl(1-t/3.6)*cl(1);if(wa>0){ctx.strokeStyle=`rgba(255,255,255,${.5*wa})`;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<14;i++){const y=60+hs(i)*500,x=mod(hs(i+9)*1500+t*1400,1700)-200;ctx.moveTo(x,y);ctx.bezierCurveTo(x+60,y-14,x+120,y+14,x+200,y)}ctx.stroke()}}
 else{ctx.fillStyle='rgba(255,170,60,.07)';ctx.fillRect(0,0,W,H)}

 if(t>.6&&t<3.3){const y=lp(-80,230,bo(cl((t-.6)/.9))),st=showHindi?'ड्रेसिंग और व्यक्तिगत सुरक्षा':'DRESSING & PERSONAL PROTECTION';ctx.save();ctx.globalAlpha=cl((3.3-t)/.4);ctx.font='800 46px system-ui,sans-serif';ctx.textAlign='center';const w=ctx.measureText(st).width+80;ctx.fillStyle='rgba(8,14,24,.72)';rr(640-w/2,y-48,w,80,18);ctx.fill();ctx.fillStyle='#2fbf63';ctx.fillRect(640-w/2+20,y+20,w-40,5);ctx.fillStyle='#f4ead2';ctx.fillText(st,640,y+6);ctx.restore()}

let ac,windG,nbuf,voices=[];
if(window.speechSynthesis){const lv=()=>voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=lv;lv()}
function initAudio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=.6;windG=ac.createGain();windG.gain.value=0;s.connect(f);f.connect(windG);windG.connect(ac.destination);s.start()}catch(e){ac=null}}
function tone(f,d,v,type,delay=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)}
function nz(f,d,v,type='bandpass',delay=0){if(!ac)return;const s=ac.createBufferSource();s.buffer=nbuf;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain(),n=ac.currentTime+delay;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(n,Math.random());s.stop(n+d+.05)}

const chime=()=>{tone(880,1.2,.18,'sine');tone(1320,1.4,.12,'sine',.12)},buzz=()=>{tone(150,.35,.12,'sawtooth')},rustle=()=>nz(2500,.4,.25);

const stopSp=()=>{if(window.speechSynthesis)speechSynthesis.cancel()};
