<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cold Wave Preparation & Prevention</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2f38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;position:relative}
canvas{width:100%;max-width:1280px;height:auto;aspect-ratio:16/9;border-radius:10px;background:#000;display:block}
.bar{display:flex;gap:12px;align-items:center;width:100%;max-width:1280px;margin-top:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:120px}
button{font:inherit;padding:6px 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#start-overlay{position:absolute;top:12px;left:12px;right:12px;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:rgba(0,0,0,.65);border-radius:10px;display:flex;justify-content:center;align-items:center;z-index:10}
#start-overlay button{background:#f4ead2;color:#14181e;border:none;padding:16px 32px;font-size:22px;font-weight:600;border-radius:50px;transition:transform .2s}
#start-overlay button:hover{transform:scale(1.05)}
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="start-overlay"><button id="start-btn">▶ Play Animation & Audio</button></div>
<div class="bar"><button id="pp" disabled>Play</button><input id="sk" type="range" min="0" max="20.5" step="0.01" value="0" disabled><span id="tm">0.0s</span><button id="lang">Hindi Subtitles: Off</button></div>
<script>
const W=1280,H=720,D=20.5,TAU=Math.PI*2,cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lp=(a,b,k)=>a+(b-a)*k,sm=k=>k*k*(3-2*k),mod=(a,n)=>((a%n)+n)%n;

const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),mx=(a,b,k)=>a.map((v,i)=>lp(v,b[i],k)),rg=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

function cam(t){let i=0;while(i<KF.length-2&&t>KF[i+1][0])i++;const a=KF[i],b=KF[i+1],u=sm(cl((t-a[0])/(b[0]-a[0])));return{x:lp(a[1],b[1],u),y:400,s:lp(a[2],b[2],u)}}

  for(let x=-300;x<4500;x+=150){const a=[x,-200],b=[x+150,-200],m=[x+75+(hs(x)-.5)*30,200+hs(x+1)*80],c=[x,560],d=[x+150,560];tri(a,b,m,sh('#a9bccd',.95+.1*hs(x+2),k*.6));tri(a,m,c,sh('#8fa3b6',.9+.1*hs(x+3),k*.6));tri(b,m,d,sh('#b4c4d3',.9+.1*hs(x+4),k*.6));tri(c,m,d,sh('#98abbd',.9+.1*hs(x+5),k*.6))}

  person(330,500,1,{sit:1,shirt:'#d9822b',arm:1.2},k);

  const sx=512,sy=342,sw=236,shh=126;ctx.fillStyle=sh('#5aa0d8',1,k);ctx.fillRect(sx,sy,sw,shh);

  const wx=sx+30+((t*20)%140);circ(wx,sy+34,16,'#f2f6fa',7);circ(wx+16,sy+40,12,'#e4ecf2',7);
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<3;i++){ctx.arc(sx+170,sy+80,16+i*14+(t*10%14),.4,4)}ctx.stroke();
  ctx.fillStyle='#e8323c';ctx.fillRect(sx+8,sy+8,60,16);ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.textAlign='left';ctx.fillText('WEATHER',sx+12,sy+20);
  // cabinet + radio
  box(840,480,170,80,12,'#7a5a38',k);box(870,420,100,60,10,'#b05a2a',k);circ(905,452,16,'#3a2a22',8);ctx.fillStyle='#e8d8a0';ctx.fillRect(935,432,26,8);
  ctx.strokeStyle=sh('#aaa',1,k);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(960,420);ctx.lineTo(1000,350);ctx.stroke();
  if(t>.3&&t<5){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;for(let i=0;i<3;i++){const r=12+((t*30+i*14)%40);ctx.globalAlpha=1-r/52;ctx.beginPath();ctx.arc(1000,350,r,-1,.2);ctx.stroke()}ctx.globalAlpha=1}
  // table + kit
  box(1090,470,320,16,24,'#9a7048',k);ctx.fillStyle=sh('#7a5a38',1,k);ctx.fillRect(1100,486,16,74);ctx.fillRect(1384,486,16,74);
  const pl=.5+.5*Math.sin(t*5),ga=cl((t-4.8)/.6);
  if(ga>0){const g=ctx.createRadialGradient(1250,420,10,1250,420,170);g.addColorStop(0,`rgba(120,255,170,${(.4+.2*pl)*ga})`);g.addColorStop(1,'rgba(120,255,170,0)');ctx.fillStyle=g;ctx.fillRect(1050,250,400,300)}
  box(1190,410,120,60,16,'#c0392b',k);cross(1250,440,1.1,'#f2f4f6');
  for(let i=0;i<7;i++){const u=cl((t-5.2-i*.35)/.6);if(u<=0)continue;const x=1130+i*45,y=lerpArc(i,u,t);item(i,x,y,k)}
  if(t>8.2)check(1250,350,1.4,cl((t-8.2)/.3));
  // clothing icon
  const sp=sm(cl((t-8.6)/1.3));
  const cols=['#3a7ac2','#c0392b','#d9a82b'];for(let i=2;i>=0;i--){const ox=(i-1)*lp(0,70,sp),oy=-i*lp(0,10,sp)*0;coat(1720+ox,400+oy,lp(1.2,.85,sp),cols[i],k)}

  ctx.fillStyle=sh('#8fc3e0',1,k);ctx.globalAlpha=.85;const gh=90*(1-p);ctx.fillRect(2305,255,190,200-gh);ctx.globalAlpha=1;tri([2305,255],[2400,255],[2305,330],'rgba(255,255,255,.25)');
  ctx.fillStyle=sh('#e8e4d8',1,k);ctx.fillRect(2398,255,4,200);ctx.fillRect(2305,350,190,4);
  // door
  box(2810,300,150,260,10,'#e8e4d8',k);const dw=lp(40,130,pd);ctx.fillStyle='#10202e';ctx.fillRect(2820,310,130,250);
  poly([[2820,310],[2820+dw,320],[2820+dw,560],[2820,560]],sh('#8b5a30',1,k));poly([[2820,310],[2820+dw,320],[2820+dw,420],[2820,340]],sh('#a06a3a',1,k));circ(2820+dw-14,440,6,'#e8c04a',6);
  // wind
  const wa=cl((t-10)/.5)*(.9);
  if(t>10&&t<20){ctx.lineCap='round';for(let i=0;i<24;i++){const door=i%2,ph=mod(t*(240+hs(i)*100)+hs(i+7)*600,700),x=(door?3200:2700)-ph,y=door?330+hs(i+3)*200:(gh>1?455-hs(i+3)*gh:200+hs(i+3)*220),lim=door?2960:2500,bl=door?pd:p;
    let al=wa*(door?.9:.9);if(x<lim)al*=(1-bl);if(!door&&gh<=1&&y>200&&x<lim)al=0;if(!door&&gh>1&&y<455-gh&&x<lim)al=0;if(al<=.02)continue;
    ctx.strokeStyle=`rgba(120,200,255,${al*(door&&y<340?0:1)})`;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+25,y-8,x+60,y);ctx.stroke()}ctx.lineCap='butt'}
  if(t>12.4)ctx.save(),ctx.translate(2400,355),ctx.scale(bo(cl((t-12.4)/.6)),bo(cl((t-12.4)/.6))),poly([[0,-70],[60,-45],[60,10],[0,70],[-60,10],[-60,-45]],'rgba(47,158,90,.8)'),ctx.strokeStyle='#fff',ctx.lineWidth=10,ctx.lineCap='round',ctx.lineJoin='round',ctx.beginPath(),ctx.moveTo(-24,0),ctx.lineTo(-6,20),ctx.lineTo(26,-20),ctx.stroke(),ctx.restore();

}
function lerpArc(i,u,t){const b=bo(cl(u));return 410-60*b-30*Math.sin(t*3+i)*cl(u)-(i%2)*20}

function frame(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const k=.6-.4*cl(t/18);
  ctx.fillStyle='#1b2a3a';ctx.fillRect(0,0,W,H);

  ctx.fillStyle=`rgba(10,18,28,${.2*k})`;ctx.fillRect(0,0,W,H);
  labels(t,c);
  if(t>.6&&t<3.6){const y=lp(-80,230,bo(cl((t-.6)/.9))),s=showHindi?'शीत लहर: तैयारी और बचाव':'COLD WAVE: PREPARE & PREVENT';ctx.save();ctx.globalAlpha=cl((3.6-t)/.4);ctx.font='800 50px system-ui,sans-serif';ctx.textAlign='center';const w=ctx.measureText(s).width+80;ctx.fillStyle='rgba(8,14,24,.72)';rr(640-w/2,y-48,w,80,18);ctx.fill();ctx.fillStyle='#4cc2ff';ctx.fillRect(640-w/2+20,y+20,w-40,5);ctx.fillStyle='#f4ead2';ctx.fillText(s,640,y+8);ctx.restore()}
  const V=showHindi?VH:VE;for(let i=0;i<4;i++){const[a,b]=CT[i],al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)continue;const s=V[i];let L=[s];if(s.length>45){let m=s.length>>1,j=s.lastIndexOf(' ',m);if(j<0)j=s.indexOf(' ');L=[s.slice(0,j),s.slice(j+1)]}
    ctx.font='600 26px system-ui,sans-serif';ctx.textAlign='center';const w=Math.max(...L.map(l=>ctx.measureText(l).width))+56,h=L.length*34+18,y=704-h;ctx.globalAlpha=al;ctx.fillStyle='rgba(8,14,24,.7)';rr(640-w/2,y,w,h,22);ctx.fill();ctx.fillStyle='#f4ead2';L.forEach((l,n)=>ctx.fillText(l,640,y+36+n*34));ctx.globalAlpha=1}
  const fd=Math.max(1-t/.35,1-(D-t)/.35,0);if(fd>0){ctx.fillStyle=`rgba(0,0,0,${cl(fd)})`;ctx.fillRect(0,0,W,H)}}

// ---- Audio ----
let ac,nb,windG,voices=[];
if(window.speechSynthesis){const lv=()=>voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=lv;lv()}
function initAudio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=.8;windG=ac.createGain();windG.gain.value=0;s.connect(f);f.connect(windG);windG.connect(ac.destination);s.start()}catch(e){ac=null}}
function tone(f,d,v,type,delay=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)}
function burst(type,f,d,v,delay=0){if(!ac)return;const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain(),n=ac.currentTime+delay;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(n);s.stop(n+d+.05)}
function speak(i){if(!window.speechSynthesis)return;speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance((showHindi?VH:VE)[i]);u.lang=showHindi?'hi-IN':'en-US';u.rate=1;u.pitch=1;const tl=showHindi?'hi':'en';let v=voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService&&(v.name.includes('Google')||v.name.includes('Neural')))||voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService)||voices.find(v=>v.lang.toLowerCase().includes(tl));if(v)u.voice=v;speechSynthesis.speak(u)},40)}
const EV=[[.3,'v',0],[4.6,'v',1],[10.2,'v',2],[14.8,'v',3],[.3,'j'],[5.4,'d'],[8.6,'r'],[11.9,'k'],[13,'k'],[15.4,'s'],[17.4,'c']];
function fire(e){const m=e[1];if(m==='v')speak(e[2]);else if(m==='j'){[523,659,784,659,880].forEach((f,i)=>tone(f,.25,.1,'triangle',i*.18))}else if(m==='d'){tone(1175,1,.18,'sine');tone(1568,1.2,.12,'sine',.1)}else if(m==='r'){burst('highpass',2500,.3,.12);burst('highpass',3500,.3,.1,.3);burst('highpass',3000,.3,.1,.6)}else if(m==='k'){tone(180,.06,.3,'square');tone(120,.1,.25,'square',.07)}else if(m==='s'){burst('bandpass',1500,.12,.2);burst('bandpass',900,.25,.25,.12)}else{tone(880,1.2,.18,'sine');tone(1320,1.4,.12,'sine',.12)}}
function audioTick(t){if(!ac||!windG)return;const w=t<10?.1*cl(t/10)*0:(t<12.9?.6:t<14?.6*(14-t)/1.1:0);windG.gain.setTargetAtTime(w,ac.currentTime,.15)}

let t=0,pt=0,playing=false,last=performance.now();
const pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),btnL=document.getElementById('lang'),overlay=document.getElementById('start-overlay');
const stopSpeech=()=>{if(window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';initAudio();if(window.speechSynthesis){const d=new SpeechSynthesisUtterance('');d.volume=0;speechSynthesis.speak(d)}playing=true;last=performance.now();pp.disabled=sk.disabled=false;pp.textContent='Pause'};
function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;
  if(playing){t+=dt;if(t>=D){t=0;pt=-.01;stopSpeech()}sk.value=t;for(const e of EV)if(pt<e[0]&&e[0]<=t)fire(e)}
  pt=t;audioTick(t);frame(t);tm.textContent=t.toFixed(1)+'s';requestAnimationFrame(loop)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play';last=performance.now();if(playing){if(ac)ac.resume()}else{stopSpeech();if(ac)ac.suspend()}};
sk.oninput=()=>{playing=false;pp.textContent='Play';t=+sk.value;pt=t;stopSpeech();if(ac)ac.suspend()};
btnL.onclick=()=>{showHindi=!showHindi;btnL.textContent='Hindi Subtitles: '+(showHindi?'On':'Off');stopSpeech()};
requestAnimationFrame(loop);
</script></body></html>
