<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Earthquake Safety: After the Quake</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2f38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--fg:#e8e4d8}}
:root[data-theme="dark"]{--bg:#14181e;--fg:#e8e4d8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;position:relative}
canvas{width:100%;max-width:1280px;height:auto;aspect-ratio:16/9;border-radius:10px;background:#000;display:block}
.bar{display:flex;gap:12px;align-items:center;width:100%;max-width:1280px;margin-top:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:120px}
button{font:inherit;padding:6px 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#start-overlay{position:absolute;top:12px;left:12px;right:12px;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:rgba(0,0,0,.65);border-radius:10px;display:flex;justify-content:center;align-items:center;z-index:10}
#start-overlay button{background:#f4ead2;color:#14181e;border:none;padding:16px 32px;font-size:22px;font-weight:600;border-radius:50px;transition:transform .2s}
#start-overlay button:hover{transform:scale(1.05)}
</style></head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="start-overlay"><button id="start-btn">▶ Play Animation &amp; Audio</button></div>
<div class="bar"><button id="pp" disabled>Play</button><input id="sk" type="range" min="0" max="20" step="0.01" value="0" disabled><span id="tm">0.0s</span><button id="lang">Hindi Subtitles: Off</button></div>
<script>
const W=1280,H=720,D=20,TAU=Math.PI*2,cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lp=(a,b,k)=>a+(b-a)*k,sm=k=>k*k*(3-2*k);

const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),mx=(a,b,k)=>a.map((v,i)=>lp(v,b[i],k)),rg=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

const tri=(a,b,c,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.fill()};

const bo=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375};

// ---- scripted text: [start,end,EN,HI]
const VO=[
[.2,1.8,'Wear shoes to protect your feet.','सुरक्षा के लिए जूते या चप्पल पहनें।'],
[1.9,3.6,'Use torchlights, not candles.','टॉर्च का उपयोग करें, मोमबत्ती का नहीं।'],
[3.7,5.4,'Clean spills, open cupboards cautiously.','फैली चीज़ें साफ़ करें, अलमारी सावधानी से खोलें।'],
[5.5,6.9,'Evacuate carefully. Avoid power lines.','सावधानी से निकलें, बिजली के तारों से दूर रहें।'],
[7.2,9.3,'Expect aftershocks. Stay out of damaged buildings.','आफ्टरशॉक आ सकते हैं, क्षतिग्रस्त इमारतों से दूर रहें।'],
[9.5,11.9,'Give first aid, but call for help. Never move the badly injured.','प्राथमिक उपचार दें, गंभीर घायल को न हिलाएँ, मदद बुलाएँ।'],
[12,13.9,'Help infants, the elderly and the disabled.','बुज़ुर्गों, बच्चों और दिव्यांगों की मदद करें।'],
[14.2,15.9,'Listen to a battery radio for advice.','सलाह के लिए बैटरी वाला रेडियो सुनें।'],
[16,17.9,'Return home only when authorities say it is safe.','अधिकारियों के सुरक्षित कहने पर ही घर लौटें।'],
[18.2,19.8,'Caution is essential for your personal safety.','सावधानी आपकी सुरक्षा के लिए ज़रूरी है।']];

function man(x,y,s,c,ph=0,o={}){const l=Math.sin(ph)*9*s,pc=o.pants||'#33415f';

ctx.strokeStyle='#ffe04a';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<4;i++)if(hs(Math.floor(l*20)+i)>.35){const a=hs(i+Math.floor(l*20))*TAU;ctx.moveTo(w*.7,gy+8);ctx.lineTo(w*.7+Math.cos(a)*22,gy+8+Math.sin(a)*22)}ctx.stroke();no(w*.7,gy-60,22,pop(l,.9))};

const g1=(w,h,l)=>{const gy=h*.78;bg(w,h,'#8a9aa8','#d6cdb8',gy,'#6b5a45');ctx.save();if(l>.2&&l<1.8)ctx.translate((Math.random()-.5)*12,(Math.random()-.5)*8);

if(l>1.4)for(let i=0;i<4;i++){ctx.fillStyle='rgba(180,170,160,.35)';ctx.beginPath();ctx.arc(w*.3+i*40,gy-20-cl(l-1.4)*40,40+i*8,0,TAU);ctx.fill()}ctx.restore();
man(w*.88,gy+60,1.4,'#3a8fb7');ok(w*.88,gy-60,24,pop(l,2.2))};
const g2=(w,h,l)=>{const gy=h*.78;bg(w,h,'#9fb0b8','#d6cdb8',gy,'#6b5a45');
fan([[w*.3,gy+30],[w*.52,gy+30],[w*.52,gy+55],[w*.3,gy+55]],[w*.41,gy+42],'#c85a5a',1,0);fan([[w*.52,gy+32],[w*.85,gy+34],[w*.85,gy+52],[w*.52,gy+55]],[w*.7,gy+43],'#33415f',1,0);fan(poly(6,16).map(p=>[p[0]+w*.27,p[1]+gy+42]),[w*.27,gy+42],'#e6b48c',1,0);

if(l>1.5){ctx.strokeStyle='#2fbf6a';ctx.lineWidth=3;for(let i=0;i<3;i++){const r=((l*40+i*18)%54);ctx.globalAlpha=1-r/54;ctx.beginPath();ctx.arc(ph+30,py+50,r+10,-.6,.6);ctx.stroke()}ctx.globalAlpha=1}

// ---- Scene 3 panels (640x720)
const r1=(w,h,l)=>{const gy=h*.75;ctx.fillStyle='#d9c4a0';ctx.fillRect(0,0,w,h);ctx.fillStyle='#8a6a48';ctx.fillRect(0,gy,w,h-gy);ctx.fillStyle='#8fc0e0';ctx.fillRect(w*.12,90,150,150);

ctx.fillStyle='#6b4a2a';ctx.fillRect(w*.56,gy-60,w*.36,12);ctx.fillRect(w*.58,gy-50,10,70);ctx.fillRect(w*.88,gy-50,10,70);
