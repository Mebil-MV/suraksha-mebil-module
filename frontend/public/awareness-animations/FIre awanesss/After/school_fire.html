<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
       <title>Post-Fire School Safety &amp; Recovery</title>
       <style>
              :root {
                     --bg: #f4f1ea;
                     --fg: #2a2f38;
                     box-sizing: border-box;
                     padding-top: env(safe-area-inset-top, 0px);
                     padding-bottom: env(safe-area-inset-bottom, 0px)
              }

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

<body>
       <canvas id="c" width="1280" height="720"></canvas>
       <div id="start-overlay"><button id="start-btn">▶ Play Animation &amp; Audio</button></div>
       <div class="bar">
              <button id="pp" disabled>Play</button>
              <input id="sk" type="range" min="0" max="20" step="0.01" value="0" disabled>
              <span id="tm">0.0s</span>
              <button id="lang">Hindi Subtitles: Off</button>
       </div>
       <script>
              const W = 1280, H = 720, D = 20, TAU = Math.PI * 2, cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
              cv.width = W * dpr; cv.height = H * dpr;
              const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, lp = (a, b, k) => a + (b - a) * k, sm = k => k * k * (3 - 2 * k), mod = (a, n) => ((a % n) + n) % n;
              function hs(n) { n |= 0; n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296 }
              const hx = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), mx = (a, b, k) => a.map((v, i) => lp(v, b[i], k)), rg = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
              const sh = (c, f, k) => rg(mx(hx(c), [22, 32, 44], k * .45).map(v => Math.min(255, v * f)));
              const tri = (a, b, c, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.fill() };
              const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h) };
              const fan = (P, c, col, f, k) => { for (let i = 0; i < P.length; i++)tri(c, P[i], P[(i + 1) % P.length], sh(col, f + (hs(i * 7 + P[0][0]) - .5) * .4, k)) };
              const oct = (x, y, r) => Array.from({ length: 8 }, (_, i) => [x + Math.cos(i / 8 * TAU + .4) * r, y + Math.sin(i / 8 * TAU + .4) * r]);
              const bo = u => { const n = 7.5625, d = 2.75; if (u < 1 / d) return n * u * u; if (u < 2 / d) return n * (u -= 1.5 / d) * u + .75; if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + .9375; return n * (u -= 2.625 / d) * u + .984375 };

              const VE = ['Do not re-enter or permit anyone to enter the school building unless fire officials have given explicit permission.', 'Teachers must confirm that all students have safely reached their homes. Afterward, review the fire risk management and evacuation plans.', 'Implement all recommendations from the Fire Department and building professionals before reopening the school for classes.'];
              const VH = ['जब तक फायर अधिकारी स्पष्ट अनुमति न दें, स्कूल की इमारत में दोबारा प्रवेश न करें और किसी को न करने दें।', 'शिक्षक पुष्टि करें कि सभी छात्र सुरक्षित घर पहुँच गए हैं। उसके बाद फायर रिस्क मैनेजमेंट और निकासी योजनाओं की समीक्षा करें।', 'स्कूल दोबारा खोलने से पहले फायर विभाग और भवन विशेषज्ञों की सभी सिफारिशें लागू करें।'];
              const CT = [[.3, 6.8], [7.3, 13.8], [14.3, 19.7]];
              const LE = ['Do not re-enter', 'Wait for official permission', 'Confirm safe arrival home', 'Review evacuation plans', 'Execute recommendations', 'Safe for reopening'];
              const LH = ['दोबारा प्रवेश न करें', 'आधिकारिक अनुमति की प्रतीक्षा करें', 'घर पहुँचने की पुष्टि करें', 'निकासी योजनाओं की समीक्षा करें', 'सिफारिशें लागू करें', 'दोबारा खोलने के लिए सुरक्षित'];
              const R = '#ff2a38', GN = '#2fbf6a', AM = '#f0b429';
              // [start,end,textIdx,x,y,color]
              const LB = [[2.4, 6.6, 0, 36, 96, R], [5.2, 6.8, 1, 36, 160, GN], [8, 13.6, 2, 36, 96, GN], [9.8, 13.6, 3, 660, 96, AM], [14.8, 19.6, 4, 36, 96, AM], [17.4, 19.6, 5, 36, 160, GN]];
              let showHindi = false;

              /* ---------- shared shapes ---------- */
              function peak(cx, top, w, base, c, k) { const T = [cx, top], L = [cx - w / 2, base], Rr = [cx + w / 2, base], M = [cx + w * .05, top + (base - top) * .5], B = [cx - w * .12, base], N = [cx - w * .14, top + (base - top) * .42]; tri(T, L, N, sh(c, 1.15, k)); tri(T, N, M, sh(c, .95, k)); tri(T, M, Rr, sh(c, .7, k)); tri(L, N, B, sh(c, .9, k)); tri(N, M, B, sh(c, .8, k)); tri(M, Rr, B, sh(c, .6, k)) }
              function tree(x, y, s, k) { ctx.fillStyle = sh('#5b4130', 1, k); ctx.fillRect(x - 3 * s, y - 22 * s, 6 * s, 22 * s); for (let j = 0; j < 3; j++) { const b = y - 12 * s - j * 18 * s, w = (36 - j * 8) * s; tri([x - w / 2, b], [x, b - 30 * s], [x + w / 2, b], sh('#3f8a4a', .8 + j * .18, k)) } }
              function cloud(x, y, r, col, al) { for (let j = 0; j < 4; j++) { const cx = x + j * r * .9, cy = y + (j % 2 ? -r * .3 : 0), rad = r * (1 - .1 * j); ctx.fillStyle = rg(col, al); ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * .7) } ctx.fill() } }
              function sky(a, b, h) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H) }
              function ground(y, c, k, x0 = 0, x1 = W) { ctx.fillStyle = sh(c, 1, k); ctx.fillRect(x0, y, x1 - x0, H - y); for (let x = x0 - 40; x < x1; x += 90) { const m = [x + 45, y + 40 + hs(x) * 30]; tri([x, y], [x + 90, y], m, sh(c, .8 + .4 * hs(x), k)); tri([x, y], m, [x - 20, y + 100], sh(c, .7 + .3 * hs(x + 1), k)) } }
              function check(x, y, r, t) { const p = .5 + .5 * Math.sin(t * 6); ctx.fillStyle = `rgba(47,191,106,${.18 + .14 * p})`; ctx.beginPath(); ctx.arc(x, y, r * 1.35, 0, TAU); ctx.fill(); fan(oct(x, y, r), [x, y], '#2fbf6a', 1, 0); ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .28; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - r * .42, y); ctx.lineTo(x - r * .1, y + r * .35); ctx.lineTo(x + r * .48, y - r * .35); ctx.stroke() }
              function xmark(x, y, r, t) { const p = .5 + .5 * Math.sin(t * 10), s = 1 + .08 * p; ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = `rgba(255,42,56,${.2 + .2 * p})`; ctx.beginPath(); ctx.arc(0, 0, r * 1.4, 0, TAU); ctx.fill(); fan(oct(0, 0, r), [0, 0], '#e8222f', 1, 0); ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .28; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-r * .4, -r * .4); ctx.lineTo(r * .4, r * .4); ctx.moveTo(r * .4, -r * .4); ctx.lineTo(-r * .4, r * .4); ctx.stroke(); ctx.restore() }
              // person: x,y = feet. arm = [ax,ay] hand target or null
              function person(x, y, s, shirt, hat, walk, k, arm, skin = '#e8b890', pants = '#2a3340') {
                     const sw = Math.sin(walk) * 9 * s; ctx.fillStyle = sh(pants, 1, k); ctx.fillRect(x - 10 * s + sw, y - 28 * s, 8 * s, 28 * s); ctx.fillRect(x + 2 * s - sw, y - 28 * s, 8 * s, 28 * s);
                     fan([[x - 15 * s, y - 62 * s], [x + 15 * s, y - 62 * s], [x + 12 * s, y - 26 * s], [x - 12 * s, y - 26 * s]], [x, y - 44 * s], shirt, 1, k);
                     ctx.lineCap = 'round'; ctx.strokeStyle = sh(skin, 1, k); ctx.lineWidth = 7 * s; ctx.beginPath();
                     if (arm) { ctx.moveTo(x + 12 * s, y - 58 * s); ctx.lineTo(arm[0], arm[1]) } else { ctx.moveTo(x + 13 * s, y - 58 * s); ctx.lineTo(x + 16 * s, y - 34 * s + sw * .4); ctx.moveTo(x - 13 * s, y - 58 * s); ctx.lineTo(x - 16 * s, y - 34 * s - sw * .4) } ctx.stroke();
                     fan(oct(x, y - 74 * s, 11 * s), [x, y - 74 * s], skin, 1, k);
                     if (hat) { tri([x - 14 * s, y - 77 * s], [x, y - 100 * s], [x + 14 * s, y - 77 * s], sh(hat, 1, k)); ctx.fillStyle = sh(hat, .8, k); ctx.fillRect(x - 16 * s, y - 79 * s, 32 * s, 5 * s) }
                     else { tri([x - 12 * s, y - 78 * s], [x, y - 92 * s], [x + 12 * s, y - 78 * s], sh('#3a2a22', 1, k)) }
              }
              function school(x, y, clean, k) {
                     fan([[x, y - 220], [x + 480, y - 220], [x + 480, y], [x, y]], [x + 240, y - 110], clean ? '#ecd9ae' : '#d9c9a3', 1, k);
                     fan([[x - 20, y - 220], [x + 500, y - 220], [x + 440, y - 292], [x + 60, y - 292]], [x + 240, y - 256], clean ? '#b4503f' : '#8c4034', 1, k);
                     for (let r = 0; r < 2; r++)for (let c = 0; c < 6; c++) { if (c == 2 || c == 3) continue; const wx = x + 30 + c * 75 + (c > 3 ? -0 : 0), wy = y - 200 + r * 95; const brk = !clean && (r + c) % 3 == 0; ctx.fillStyle = clean ? '#bfe3f2' : (brk ? '#15181c' : '#3a3f48'); ctx.fillRect(wx, wy, 44, 56); ctx.fillStyle = 'rgba(255,255,255,.35)'; if (clean) tri([wx, wy + 56], [wx + 44, wy], [wx + 44, wy + 56], 'rgba(255,255,255,.3)') }
                     fan([[x + 205, y - 100], [x + 275, y - 100], [x + 275, y], [x + 205, y]], [x + 240, y - 50], '#6b4f32', 1, k);
                     tri([x + 195, y - 100], [x + 240, y - 135], [x + 285, y - 100], sh('#a8473a', 1, k));
                     ctx.fillStyle = sh('#f4ead2', 1, k); ctx.fillRect(x + 170, y - 166, 140, 22); ctx.fillStyle = '#14181e'; ctx.font = '700 15px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('SCHOOL', x + 240, y - 150);
                     if (!clean) { ctx.fillStyle = 'rgba(18,16,16,.42)'; ctx.fillRect(x, y - 220, 170, 220); tri([x + 170, y - 220], [x + 170, y], [x + 120, y], 'rgba(18,16,16,.3)'); for (let i = 0; i < 5; i++) { const fx = x + 10 + i * 32; tri([fx, y - 220], [fx + 16, y - 246 - hs(i) * 14], [fx + 32, y - 220], 'rgba(255,120,30,.55)') } }
              }
              function truck(x, y, t, k) {
                     fan([[x, y - 90], [x + 170, y - 90], [x + 170, y - 15], [x, y - 15]], [x + 85, y - 52], '#d9342b', 1, k);
                     fan([[x + 170, y - 90], [x + 235, y - 90], [x + 252, y - 50], [x + 252, y - 15], [x + 170, y - 15]], [x + 210, y - 52], '#c42a22', 1, k);
                     ctx.fillStyle = '#9fd0e6'; ctx.fillRect(x + 186, y - 80, 46, 26); ctx.fillStyle = '#f4ead2'; ctx.fillRect(x, y - 52, 170, 8);
                     ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 10, y - 104); ctx.lineTo(x + 160, y - 104); ctx.moveTo(x + 10, y - 96); ctx.lineTo(x + 160, y - 96); for (let i = 0; i <= 7; i++) { ctx.moveTo(x + 10 + i * 21, y - 104); ctx.lineTo(x + 10 + i * 21, y - 96) } ctx.stroke();
                     for (const wx of [x + 45, x + 205]) { fan(oct(wx, y - 14, 21), [wx, y - 14], '#222', 1, k); fan(oct(wx, y - 14, 9), [wx, y - 14], '#9aa0a6', 1, k) }
                     const on = Math.sin(t * 14) > 0, lc = on ? '255,40,50' : '60,120,255'; const g = ctx.createRadialGradient(x + 205, y - 98, 2, x + 205, y - 98, 60); g.addColorStop(0, `rgba(${lc},.8)`); g.addColorStop(1, `rgba(${lc},0)`); ctx.fillStyle = g; ctx.fillRect(x + 140, y - 160, 130, 130); ctx.fillStyle = `rgb(${lc})`; ctx.fillRect(x + 192, y - 100, 26, 10)
              }

              /* ---------- scenes ---------- */
              function scene1(t) {
                     const q = sm(cl(t / 7)), k = .5 * (1 - q) + .08;
                     const g = ctx.createLinearGradient(0, 0, 0, H * .7); g.addColorStop(0, rg(mx(hx('#6c7077'), hx('#6fa3c9'), q))); g.addColorStop(1, rg(mx(hx('#a89a88'), hx('#f4e4b8'), q))); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                     for (let i = 0; i < 5; i++)cloud(mod(i * 300 + t * 12, 1700) - 250, 70 + hs(i) * 90, 34 + hs(i + 4) * 20, mx([150, 152, 158], [245, 248, 250], q), .9);
                     peak(200, 250, 700, 520, '#6f9560', k); peak(1100, 230, 820, 520, '#6a8f5c', k); peak(700, 330, 500, 520, '#8aa6bd', k);
                     ground(520, '#5f7f4a', k); ctx.fillStyle = sh('#555c64', 1, k); ctx.fillRect(0, 520, W, 50); ctx.strokeStyle = 'rgba(240,230,190,.7)'; ctx.lineWidth = 3; ctx.setLineDash([26, 20]); ctx.beginPath(); ctx.moveTo(0, 552); ctx.lineTo(W, 552); ctx.stroke(); ctx.setLineDash([]);
                     for (const x of [60, 150, 420, 1000, 1260]) tree(x, 520, 1.3, k);
                     school(480, 520, false, k);
                     for (let i = 0; i < 7; i++) { const p = mod(t * .25 + i / 7, 1), x = 520 + hs(i) * 100 + p * 60, y = 300 - p * 220; ctx.fillStyle = `rgba(60,60,64,${.55 * (1 - p) * (1 - q * .6)})`; ctx.beginPath(); ctx.arc(x, y, 16 + p * 36, 0, TAU); ctx.fill() }
                     truck(1000, 560, t, k);
                     // student
                     const sx = lp(120, 590, sm(cl((t - .8) / 1.8))); person(sx, 548, 1.5, '#3b7dd8', '#e8c14a', t < 2.6 ? t * 9 : 0, k, null);
                     ctx.fillStyle = sh('#e8c14a', 1, k); ctx.fillRect(sx - 27, 548 - 80 * 1.5 + 30, 12, 34);// backpack
                     // red X
                     if (t > 2.4 && t < 5.2) { const a = Math.min(cl((t - 2.4) / .3), cl((5.2 - t) / .3)); ctx.save(); ctx.globalAlpha = a; xmark(660, 430, 52 * bo(cl((t - 2.4) / .6)), t); ctx.restore() }
                     // official
                     const ox = lp(1000, 700, sm(cl((t - 3.4) / 1.4))); person(ox, 548, 1.6, '#2a3a5a', '#d9342b', t > 3.4 && t < 4.8 ? t * 8 : 0, k, t > 4.8 ? [ox - 34, 430] : null);
                     if (t > 5.2) check(700, 360 - 6 * Math.sin(t * 3), 44 * bo(cl((t - 5.2) / .6)), t)
              }
              function scene2(t) {
                     const lt = t - 7;
                     // LEFT: home confirmation
                     ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 636, H); ctx.clip();
                     sky('#8cc4e0', '#f4ead2', H * .65); cloud(120 + lt * 8, 90, 28, [245, 248, 250], .9); peak(300, 260, 500, 470, '#6f9560', .1); ground(470, '#6b8f4e', .1, 0, 636);
                     fan([[420, 360], [540, 360], [540, 470], [420, 470]], [480, 415], '#e6c9a0', 1, .1); tri([402, 364], [480, 296], [558, 364], sh('#b4503f', 1, .1)); ctx.fillStyle = '#6b4f32'; ctx.fillRect(465, 410, 30, 60); ctx.fillStyle = '#bfe3f2'; ctx.fillRect(432, 385, 24, 24); ctx.fillRect(504, 385, 24, 24);
                     const st = sm(cl((lt - 1.4) / 1.8)), stx = lp(250, 420, st);
                     person(130, 520, 1.6, '#1fa39a', '#6b3a52', 0, .1, [168, 440]);
                     const done = t > 10.6; ctx.fillStyle = '#14181e'; rr(162, 418, 22, 38, 4); ctx.fill(); ctx.fillStyle = done ? GN : '#6fb6ff'; ctx.fillRect(165, 422, 16, 28);
                     if (t > 7.6 && t < 9.2) for (let i = 0; i < 3; i++) { const p = mod(t * 2.5 - i * .33, 1); ctx.strokeStyle = `rgba(240,176,41,${1 - p})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(173, 437, 14 + p * 26, -2.4, -.7); ctx.stroke() }
                     person(stx, 520, 1.2, '#3b7dd8', '#e8c14a', st > 0 && st < 1 ? t * 9 : 0, .1, null);
                     if (t > 10.6) check(480, 250 - 5 * Math.sin(t * 3), 36 * bo(cl((t - 10.6) / .5)), t);
                     ctx.restore();
                     // RIGHT: plan review
                     ctx.save(); ctx.beginPath(); ctx.rect(644, 0, 636, H); ctx.clip();
                     const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#26333f'); g.addColorStop(1, '#1a232c'); ctx.fillStyle = g; ctx.fillRect(644, 0, 636, H);
                     ctx.fillStyle = '#3d2f24'; ctx.fillRect(644, 520, 636, 200); tri([644, 520], [1280, 520], [960, 600], '#4a3a2c');
                     fan([[790, 160], [1090, 160], [1090, 500], [790, 500]], [940, 330], '#f4f1ea', 1, 0); tri([1058, 160], [1090, 192], [1090, 160], '#cfc8b6');
                     ctx.fillStyle = '#2a2f38'; ctx.textAlign = 'center'; ctx.font = '800 22px system-ui,sans-serif';
                     const T1 = showHindi ? 'फायर रिस्क' : 'Fire Risk', T2 = showHindi ? 'मैनेजमेंट प्लान' : 'Management Plan'; ctx.fillText(T1, 940, 205); ctx.fillText(T2, 940, 234);
                     ctx.fillStyle = '#d9342b'; ctx.fillRect(830, 246, 220, 4);
                     for (let i = 0; i < 5; i++) { const y = 282 + i * 40, on = t > 9.2 + i * .8; ctx.strokeStyle = '#8a8f98'; ctx.lineWidth = 2; ctx.strokeRect(820, y, 20, 20); if (on) { ctx.fillStyle = GN; ctx.fillRect(822, y + 2, 16, 16) } ctx.fillStyle = '#b9bec6'; ctx.fillRect(856, y + 4, 150 - hs(i) * 40, 10) }
                     person(1180, 560, 1.6, '#6b4c9a', null, 0, 0, [1040, 420], '#d9a47a');
                     const mx_ = 900 + 70 * Math.sin(lt * 1.1), my_ = 320 + 20 * Math.cos(lt * 1.6) + Math.min(150, Math.max(0, (lt - 1) * 22));
                     const lx = mx_, ly = Math.min(my_, 430); ctx.fillStyle = 'rgba(190,225,245,.3)'; ctx.beginPath(); ctx.arc(lx, ly, 40, 0, TAU); ctx.fill(); ctx.strokeStyle = '#d9b04a'; ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(lx + 28, ly + 28); ctx.lineTo(lx + 70, ly + 70); ctx.stroke();
                     ctx.restore();
                     ctx.fillStyle = '#f4ead2'; ctx.fillRect(637, 0, 6, H)
              }
              function scene3(t) {
                     const lt = t - 14;
