<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Fire Awareness &amp; Prevention</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2f38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--fg:#e8e4d8}}
:root[data-theme="dark"]{--bg:#14181e;--fg:#e8e4d8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;position:relative}
canvas{width:100%;max-width:1280px;height:auto;aspect-ratio:16/9;border-radius:10px;background:#000;display:block}
.bar{display:flex;gap:12px;align-items:center;width:100%;max-width:1280px;margin-top:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:120px}
button{font:inherit;padding:6px 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#start-overlay{position:absolute;top:12px;left:12px;right:12px;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:rgba(0,0,0,.65);border-radius:10px;display:flex;justify-content:center;align-items:center;z-index:10}
#start-overlay button{background:#f4ead2;color:#14181e;border:none;padding:16px 32px;font-size:22px;font-weight:600;border-radius:50px;transition:transform .2s}
#start-overlay button:hover{transform:scale(1.05)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="start-overlay"><button id="start-btn">▶ Play Animation &amp; Audio</button></div>
<div class="bar">
<button id="pp" disabled>Play</button>
<input id="sk" type="range" min="0" max="20" step="0.01" value="0" disabled>
<span id="tm">0.0s</span>
<button id="lang">Hindi Subtitles: Off</button>
</div>
<script>
const W=1280,H=720,D=20,TAU=Math.PI*2,cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lp=(a,b,k)=>a+(b-a)*k,sm=k=>k*k*(3-2*k),mod=(a,n)=>((a%n)+n)%n;
function hs(n){n|=0;n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return(n>>>0)/4294967296}
const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),mx=(a,b,k)=>a.map((v,i)=>lp(v,b[i],k)),rg=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const sh=(c,f,k=0)=>rg(mx(hx(c),[22,32,44],k*.45).map(v=>Math.min(255,v*f)));
const tri=(a,b,c,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.fill()};
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
const fan=(P,c,col,f,k)=>{for(let i=0;i<P.length;i++)tri(c,P[i],P[(i+1)%P.length],sh(col,f+(hs(i*7+P[0][0])-.5)*.4,k))};
const bo=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375};
// low-poly box with front, top, side faces
function box(x,y,w,h,d,col,k=0){tri([x,y],[x+w,y],[x+w,y+h],sh(col,1,k));tri([x,y],[x+w,y+h],[x,y+h],sh(col,.92,k));
tri([x,y],[x+w,y],[x+w+d,y-d],sh(col,1.2,k));tri([x,y],[x+w+d,y-d],[x+d,y-d],sh(col,1.12,k));
tri([x+w,y],[x+w+d,y-d],[x+w+d,y+h-d],sh(col,.7,k));tri([x+w,y],[x+w+d,y+h-d],[x+w,y+h],sh(col,.62,k))}
function check(x,y,s,al){ctx.save();ctx.globalAlpha*=al;ctx.translate(x,y);ctx.scale(s,s);const g=ctx.createRadialGradient(0,0,4,0,0,46);g.addColorStop(0,'rgba(80,255,140,.7)');g.addColorStop(1,'rgba(80,255,140,0)');ctx.fillStyle=g;ctx.fillRect(-50,-50,100,100);
fan([[0,-30],[26,-15],[26,15],[0,30],[-26,15],[-26,-15]],[0,0],'#2f9e5a',1,0);ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-3,10);ctx.lineTo(13,-9);ctx.stroke();ctx.restore()}
function xmark(x,y,s,al){ctx.save();ctx.globalAlpha*=al;ctx.translate(x,y);ctx.scale(s,s);fan([[0,-30],[26,-15],[26,15],[0,30],[-26,15],[-26,-15]],[0,0],'#e8222f',1,0);ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-11,-11);ctx.lineTo(11,11);ctx.moveTo(11,-11);ctx.lineTo(-11,11);ctx.stroke();ctx.restore()}
function person(x,y,s,col,hair,k,ph=0,arm=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const sw=Math.sin(ph)*8;
tri([-9,-30],[-3,-30],[-6+sw,0],sh('#2d3a55',.9,k));tri([3,-30],[9,-30],[6-sw,0],sh('#2d3a55',.75,k));
fan([[-12,-70],[12,-70],[14,-28],[-14,-28]],[0,-48],col,1,k);
tri([12,-66],[22+arm,-52-arm*1.5],[14,-50],sh(col,.7,k));
fan([[-10,-98],[0,-102],[10,-98],[10,-72],[-10,-72]],[0,-86],'#f0c9a0',1,k);
tri([-11,-96],[0,-106],[11,-96],sh(hair,1,k));ctx.restore()}
function ext(x,y,s,k){ctx.save();ctx.translate(x,y);ctx.scale(s,s);fan([[-14,-60],[14,-60],[16,0],[-16,0]],[0,-30],'#d92b2b',1,k);tri([-6,-60],[6,-60],[0,-72],sh('#222',1,k));tri([6,-68],[26,-60],[6,-58],sh('#222',1,k));ctx.restore()}
function tree(x,y,s,k){ctx.fillStyle=sh('#5b4130',1,k);ctx.fillRect(x-3*s,y-22*s,6*s,22*s);for(let j=0;j<3;j++){const b=y-12*s-j*18*s,w=(36-j*8)*s;tri([x-w/2,b],[x,b-30*s],[x+w/2,b],sh('#3f8a4a',.8+j*.18,k))}}
function cloud(x,y,r,k){for(let j=0;j<4;j++){const cx=x+j*r*.9,cy=y+(j%2?-r*.3:0),rad=r*(1-.1*j);ctx.fillStyle=rg(mx([245,248,250],[44,52,62],k),.92);ctx.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*.7)}ctx.fill()}}

// ---- text ----
const VE=['Prevent school fires before they start. Keep electrical inspections up to date and check all fire-fighting apparatus.','Ensure escape routes and doors are unobstructed. Conduct regular fire drills so everyone knows the plan.','Follow local fire brigade advice and keep first aid kits ready. Stay aware, stay safe.'];
const VH=['स्कूल में आग लगने से पहले ही रोकें। बिजली की जाँच समय पर करवाएँ और अग्निशमन उपकरण नियमित जाँचें।','भागने के रास्ते और दरवाज़े खुले रखें। नियमित फायर ड्रिल करें ताकि सबको योजना पता हो।','स्थानीय अग्निशमन विभाग की सलाह मानें और प्राथमिक उपचार किट तैयार रखें। सतर्क रहें, सुरक्षित रहें।'];
const CT=[[.3,7.7],[8.2,15.7],[16.2,19.7]];
const TX_EN=['Inspect Electricals','Maintain Fire Apparatus','Clear Escape Routes','Conduct Fire Drills','Consult Local Fire Brigade','Have First Aid Kits'];
const TX_HI=['बिजली की जाँच करें','अग्निशमन उपकरण रखें','निकासी मार्ग खुले रखें','फायर ड्रिल करें','स्थानीय अग्निशमन से सलाह लें','प्राथमिक उपचार किट रखें'];
// [start,end,slot,textIdx,anchorX,anchorY] anchors in screen space
const LB=[[2.2,7.8,0,0,700,430],[4,7.8,1,1,300,470],[9.6,15.8,0,2,330,470],[12.2,15.8,1,3,880,300]];
let showHindi=false;

function sceneBuilding(t,k){
 // sky ground
 ctx.fillStyle=sh('#6b4f32',1,k);ctx.fillRect(0,600,W,120);
 for(let x=0;x<W;x+=100){tri([x,600],[x+100,600],[x+50+(hs(x)-.5)*30,690],sh('#5f8a40',.8+.4*hs(x),k));}
 for(const x of [60,1220,1150]) tree(x,610,1.5,k);
 // building shell
 box(160,180,960,420,40,'#c9b79a',k);
 // roof triangle
 tri([140,180],[640,90],[1140,180],sh('#b5452f',1,k));tri([140,180],[640,90],[500,180],sh('#d0583f',1.1,k));
 // cutaway interior: two floors
 ctx.fillStyle=sh('#f0e6d0',1,k);ctx.fillRect(190,205,900,375);
 ctx.fillStyle=sh('#d9c9a8',1,k);ctx.fillRect(190,390,900,12);
 // rooms (walls)
 ctx.fillStyle=sh('#a89678',1,k);for(const x of [490,790])ctx.fillRect(x,205,8,375);
 // windows top
 for(const x of [230,330,540,640,830,940]){ctx.fillStyle=sh('#8fd0ee',1,k);ctx.fillRect(x,240,70,70);tri([x,240],[x+70,240],[x,310],'rgba(255,255,255,.25)')}
 // kitchen room
 ctx.fillStyle=sh('#b8c4cc',1,k);ctx.fillRect(210,500,260,18);box(220,455,90,45,10,'#8c96a0',k);box(330,455,70,45,10,'#aab4bc',k);
 for(let i=0;i<2;i++){ctx.fillStyle='#ff9a2a';ctx.fillRect(235+i*28,448,16,7)}
 // wall panel
 box(560,430,90,130,8,'#7a8794',k);ctx.fillStyle=sh('#d8dee4',1,k);ctx.fillRect(572,445,66,100);
 for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#2f9e5a':'#e8b22a';ctx.fillRect(580,452+i*18,50,10)}
 // extinguisher on wall
 ext(300,560,1.1,k);ctx.fillStyle=sh('#888',1,k);ctx.fillRect(310,505,6,12);
 // classroom desks (right)
 for(let i=0;i<3;i++)box(830+i*80,520,60,20,8,'#9a6b3f',k);
 // electrician
 const wob=Math.sin(t*3)*3;
 person(700,580,1.2,'#e8a020','#3a2a1a',k,t*4,6+wob*.5);
 ctx.fillStyle=sh('#e8a020',1,k);tri([680,478],[700,462],[720,478],sh('#e8a020',1.1,k)); // hard hat
 // upper floor people
 person(250,385,.9,'#3b82c4','#222',k,0);person(950,385,.9,'#c44b8a','#3a2a1a',k,0);
 // title
}
function sceneHall(t,k){
 const u=t-8;
 // hallway perspective low-poly
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cfd8e0');g.addColorStop(1,'#e8dfc8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 fan([[0,0],[1280,0],[1280,720],[0,720]],[640,360],'#d8cdb3',1,k*.3);
 // floor
 tri([0,720],[1280,720],[820,470],sh('#b89a6a',1,k*.5));tri([0,720],[820,470],[460,470],sh('#c8aa78',1,k*.5));
 tri([460,470],[820,470],[0,720],sh('#c8aa78',1.05,k*.5));
 // walls
 tri([0,0],[460,200],[460,470],sh('#9fb6c9',.9,k*.5));tri([0,0],[460,470],[0,720],sh('#8aa3b8',.85,k*.5));
 tri([1280,0],[820,200],[820,470],sh('#9fb6c9',.7,k*.5));tri([1280,0],[820,470],[1280,720],sh('#8aa3b8',.65,k*.5));
 ctx.fillStyle=sh('#e9e2cf',1,k*.5);ctx.fillRect(460,200,360,270);
 // exit door at end
 const open=sm(cl((u-4.8)/1.4));
 ctx.fillStyle=sh('#2f9e5a',1,k);ctx.fillRect(560,260,160,210);
 ctx.fillStyle=`rgba(255,250,200,${.4+.5*open})`;ctx.fillRect(572,272,136,198);
 // door leaf swinging
 ctx.fillStyle=sh('#5b4130',1,k);ctx.beginPath();ctx.moveTo(560,260);ctx.lineTo(560+160*(1-open*.9),260+open*18);ctx.lineTo(560+160*(1-open*.9),470-open*18);ctx.lineTo(560,470);ctx.fill();
 // EXIT sign
 ctx.fillStyle='#1f7a45';rr(590,222,100,30,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 20px system-ui';ctx.textAlign='center';ctx.fillText('EXIT',640,244);
 // boxes blocking (vanish at u=2.6)
 const bv=cl((u-2.6)/.5);
 if(bv<1){ctx.save();ctx.globalAlpha=1-bv;const sc=1-bv*.3;ctx.translate(640,470);ctx.scale(sc,sc);ctx.translate(-640,-470);
 box(540,400,90,70,14,'#b98a52',k);box(640,410,80,60,12,'#a77a46',k);box(590,345,90,60,14,'#c79a62',k);box(520,330,0,0,0,'#000',k);ctx.restore();
 if(u>2.6){ctx.globalAlpha=1;const p=cl((u-2.6)/.4);xmark(640,380,bo(p)*1.4,1-cl((u-3.6)/.4))}}
 // door swing check
 if(u>6.4)check(640,200,bo(cl((u-6.4)/.5))*1.1,1);
 // drifting dust poof
 if(u>2.5&&u<3.3){for(let i=0;i<10;i++){const a=i/10*TAU,r=(u-2.5)*120;ctx.fillStyle=`rgba(255,255,255,${.5*(1-(u-2.5)/.8)})`;ctx.beginPath();ctx.arc(640+Math.cos(a)*r,420+Math.sin(a)*r*.5,10,0,TAU);ctx.fill()}}
 // teacher + students walk to door
 if(u>3.8){const p=cl((u-3.8)/3.5),x0=140,tx=lp(x0,520,sm(p)),y=lp(660,500,sm(p)),s=lp(1.5,.9,sm(p));
 person(tx,y,s,'#8b3fb5','#222',k,u*6,6);
 for(let i=1;i<=3;i++){const px=lp(x0-70*i,520-45*i,sm(p)),py=lp(660+6*i,500+4*i,sm(p));person(px,py,s*.75,['#3b82c4','#e8a020','#2f9e5a'][i-1],'#3a2a1a',k,u*6+i,0)}}
 // calendar icon
 if(u>4.2){const p=bo(cl((u-4.2)/.6)),al=cl((8-u)/.4);ctx.save();ctx.globalAlpha=al;ctx.translate(1000,320);ctx.scale(p,p);
 box(-60,-50,120,100,10,'#f5f5f5',k);tri([-60,-50],[60,-50],[60,-20],'#e8222f');tri([-60,-50],[60,-20],[-60,-20],'#d01c28');
 ctx.fillStyle='#fff';ctx.font='700 22px system-ui';ctx.textAlign='center';ctx.fillText('FIRE',0,-28);
 ctx.fillStyle='#2a2f38';ctx.font='800 34px system-ui';ctx.fillText('DRILL',0,16);ctx.fillStyle='#e8222f';ctx.fillRect(-45,30,90,6);ctx.restore()}
}
function sceneCTA(t,k){
 const u=t-16,a=sm(cl(u/.6));
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#e8222f');bg.addColorStop(1,'#a8101c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // low-poly facets
 for(let i=0;i<14;i++){const x=i*100,y=hs(i)*600;tri([x,y],[x+160,y+80],[x+30,y+200],`rgba(255,255,255,${.04+.04*hs(i+9)})`)}
 // shield
 const s=bo(cl((u-.4)/.7));ctx.save();ctx.translate(400,310);ctx.scale(s*1.05,s*1.05);
 const P=[[0,-130],[100,-90],[100,10],[60,85],[0,130],[-60,85],[-100,10],[-100,-90]];fan(P,[0,-10],'#e8b923',1,0);
 const P2=P.map(p=>[p[0]*.78,p[1]*.78]);fan(P2,[0,-8],'#f6d65a',1.05,0);
 // flame
 tri([0,-70],[28,-10],[-28,-10],'#e8222f');tri([0,-45],[16,0],[-16,0],'#ff9a2a');tri([-30,-10],[30,-10],[0,45],'#d01c28');
 ctx.restore();
 // first aid kit
 const s2=bo(cl((u-.9)/.7));ctx.save();ctx.translate(870,320);ctx.scale(s2,s2);
 box(-110,-70,220,150,18,'#ffffff',0);rr(-30,-100,60,28,6);ctx.fillStyle='#e6e6e6';ctx.fill();ctx.fillStyle='#2f9e5a';ctx.fillRect(-18,-40,36,100);ctx.fillRect(-48,-8,96,36);
 tri([-18,-40],[18,-40],[18,60],'#3fbf72');ctx.restore();
 // labels
 ctx.globalAlpha=cl((u-1.2)/.4);ctx.font='700 34px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';
 const T=showHindi?TX_HI:TX_EN;ctx.fillText(T[4],400,510);ctx.fillText(T[5],870,510);
 check(400,570,.8,1);check(870,570,.8,1);ctx.globalAlpha=1;
 ctx.globalAlpha=cl((u-2)/.5);ctx.font='800 44px system-ui';ctx.fillStyle='#f4ead2';ctx.fillText(showHindi?'सतर्क रहें। सुरक्षित रहें।':'STAY AWARE. STAY SAFE.',640,110);ctx.globalAlpha=1;
}

function grids(){}
function labels(t){
 ctx.font='600 24px system-ui,sans-serif';ctx.textAlign='left';const T=showHindi?TX_HI:TX_EN;
 for(const [a,b,slot,ti,ax,ay] of LB){const al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)continue;
 const s=T[ti],w=ctx.measureText(s).width+84,x=36-30*(1-al),y=40+slot*64;
 ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='rgba(80,255,140,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x+w,y+23);ctx.lineTo(ax,ay);ctx.stroke();
 ctx.fillStyle='#3fe07a';ctx.beginPath();ctx.arc(ax,ay,6,0,TAU);ctx.fill();
 ctx.fillStyle='rgba(8,14,24,.78)';rr(x,y,w,46,12);ctx.fill();ctx.strokeStyle='#3fe07a';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#2f9e5a';ctx.beginPath();ctx.arc(x+30,y+23,14,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+23,y+23);ctx.lineTo(x+28,y+29);ctx.lineTo(x+38,y+17);ctx.stroke();
 ctx.font='600 24px system-ui,sans-serif';ctx.fillStyle='#f4ead2';ctx.fillText(s,x+58,y+31);ctx.restore()}
}

function frame(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const k=.15;
 // sky
 const g=ctx.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,'#6fa3c9');g.addColorStop(.6,'#a9d0e0');g.addColorStop(1,'#f4e4b8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const sg=ctx.createRadialGradient(1100,90,6,1100,90,110);sg.addColorStop(0,'rgba(255,244,200,.95)');sg.addColorStop(1,'rgba(255,244,200,0)');ctx.fillStyle=sg;ctx.fillRect(900,0,380,300);
 for(let i=0;i<5;i++)cloud(mod(i*300+t*14,1700)-250,40+hs(i)*90,28+hs(i+4)*20,k);
 // scene transitions
 if(t<8.5){
  // slow push-in on building
  const z=1+.05*cl(t/8);ctx.save();ctx.translate(640,360);ctx.scale(z,z);ctx.translate(-640,-360);sceneBuilding(t,k);
  // check marks
  const c1=cl((t-3.2)/.5),c2=cl((t-4.6)/.5),c3=cl((t-6)/.5);
  if(c1>0)check(300,455,bo(c1)*1.1,1);
  if(c2>0)check(640,400,bo(c2)*1.1,1);
  if(c3>0){ctx.save();ctx.translate(930,360);ctx.scale(bo(c3),bo(c3));fan([[0,-34],[30,-18],[30,18],[0,34],[-30,18],[-30,-18]],[0,0],'#2f9e5a',1,0);
   ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-10,2);ctx.lineTo(-2,-14);ctx.lineTo(4,-12);ctx.lineTo(0,-2);ctx.lineTo(14,-2);ctx.lineTo(11,14);ctx.lineTo(-10,14);ctx.fill();ctx.restore()}
  ctx.restore();
  if(t>7.6){ctx.fillStyle=`rgba(255,255,255,${sm(cl((t-7.6)/.9))})`;ctx.fillRect(0,0,W,H)}
 } else if(t<16.4){
  const u=t-8;ctx.save();const pan=cl(u/.8);
  sceneHall(t,k);ctx.restore();
  if(t<9){ctx.fillStyle=`rgba(255,255,255,${1-sm(cl((t-8.2)/.8))})`;ctx.fillRect(0,0,W,H)}
  if(t>15.6){ctx.fillStyle=`rgba(232,34,47,${sm(cl((t-15.6)/.8))})`;ctx.fillRect(0,0,W,H)}
 } else sceneCTA(t,k);
 // title
 if(t>.3&&t<2.8){const y=lp(-80,230,bo(cl((t-.3)/.9))),s=showHindi?'स्कूल अग्नि सुरक्षा':'SCHOOL FIRE SAFETY';ctx.save();ctx.globalAlpha=cl((2.8-t)/.4);ctx.font='800 56px system-ui,sans-serif';ctx.textAlign='center';const w=ctx.measureText(s).width+80;ctx.fillStyle='rgba(8,14,24,.72)';rr(640-w/2,y-52,w,84,18);ctx.fill();ctx.fillStyle='#e8222f';ctx.fillRect(640-w/2+20,y+22,w-40,5);ctx.fillStyle='#f4ead2';ctx.fillText(s,640,y+8);ctx.restore()}
 labels(t);
 // captions
 const V=showHindi?VH:VE;
 for(let i=0;i<3;i++){const[a,b]=CT[i],al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)continue;const s=V[i];let L=[s];
  if(s.length>45){const m=s.length>>1;let j=s.indexOf(' ',m);if(j<0)j=s.lastIndexOf(' ');L=[s.slice(0,j),s.slice(j+1)]}
  ctx.font='600 26px system-ui,sans-serif';ctx.textAlign='center';const w=Math.max(...L.map(l=>ctx.measureText(l).width))+56,h=L.length*34+18,y=704-h;
  ctx.globalAlpha=al;ctx.fillStyle='rgba(8,14,24,.7)';rr(640-w/2,y,w,h,22);ctx.fill();ctx.fillStyle='#f4ead2';L.forEach((l,n)=>ctx.fillText(l,640,y+36+n*34));ctx.globalAlpha=1}
 const fd=Math.max(1-t/.35,1-(D-t)/.35,0);if(fd>0){ctx.fillStyle=`rgba(0,0,0,${cl(fd)})`;ctx.fillRect(0,0,W,H)}
}

// ---- Audio ----
let ac,musG,voices=[];
if(window.speechSynthesis){const lv=()=>voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=lv;lv()}
function initAudio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();musG=ac.createGain();musG.gain.value=0;musG.connect(ac.destination)}catch(e){ac=null}}
function tone(f,d,v,type,delay=0,dest){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(dest||ac.destination);o.start(n);o.stop(n+d+.05)}
function noise(d,f,v,type='bandpass'){if(!ac)return;const nb=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start()}
function speak(i){if(!window.speechSynthesis)return;speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance((showHindi?VH:VE)[i]);u.lang=showHindi?'hi-IN':'en-US';u.rate=1.05;const tl=showHindi?'hi':'en';
 let b=voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService&&(v.name.includes('Google')||v.name.includes('Neural')))||voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService)||voices.find(v=>v.lang.toLowerCase().includes(tl));
 if(b)u.voice=b;speechSynthesis.speak(u)},40)}
const chime=()=>{tone(880,1,.16,'sine');tone(1320,1.2,.1,'sine',.1)};
const clink=()=>{tone(2400,.15,.1,'triangle');tone(3200,.1,.06,'square',.03)};
const EV=[[.3,'v',0],[8.2,'v',1],[16.2,'v',2],[3.2,'k'],[4.6,'k'],[6,'k'],[2.2,'c'],[3.9,'c'],[10.6,'w'],[10.7,'k'],[12,'s'],[14.4,'s'],[14.8,'k'],[16.1,'t'],[17,'k'],[17.3,'k']];
function fire(e){const x=e[1];if(x==='v')speak(e[2]);else if(x==='k')chime();else if(x==='c')clink();else if(x==='w')noise(.6,1800,.25);else if(x==='s'){for(let i=0;i<4;i++)noise(.08,500,.12)}else if(x==='t'){tone(660,1.4,.2,'sine');tone(990,1.6,.14,'sine',.15);tone(1320,1.8,.1,'sine',.3)}}
// upbeat music loop
function music(t){if(!ac||!musG)return;musG.gain.setTargetAtTime(t<16?.5:.25,ac.currentTime,.2)}
let beatT=0;function musicTick(t){if(!ac||!playing)return;const b=Math.floor(t/.25);if(b!==beatT){beatT=b;const n=[262,330,392,330,294,370,440,370];const f=n[mod(b,8)];tone(f,.2,.04,'square',0,musG);if(b%2===0)tone(65,.18,.12,'sine',0,musG)}}

let t=0,pt=0,playing=false,last=performance.now();
const pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),btnL=document.getElementById('lang'),overlay=document.getElementById('start-overlay');
const stopSpeech=()=>{if(window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';initAudio();if(window.speechSynthesis){const d=new SpeechSynthesisUtterance('');d.volume=0;speechSynthesis.speak(d)}playing=true;last=performance.now();pp.disabled=sk.disabled=false;pp.textContent='Pause'};
function loop(n){const dt=cl((n-last)/1000,0,.1);last=n;
 if(playing){t+=dt;if(t>=D){t=0;pt=-.01;stopSpeech()}sk.value=t;for(const e of EV)if(pt<e[0]&&e[0]<=t)fire(e)}
 pt=t;if(ac)music(t);musicTick(t);frame(t);tm.textContent=t.toFixed(1)+'s';requestAnimationFrame(loop)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play';last=performance.now();if(playing){if(ac)ac.resume()}else{stopSpeech();if(ac)ac.suspend()}};
sk.oninput=()=>{playing=false;pp.textContent='Play';t=+sk.value;pt=t;stopSpeech();if(ac)ac.suspend()};
btnL.onclick=()=>{showHindi=!showHindi;btnL.textContent='Hindi Subtitles: '+(showHindi?'On':'Off');stopSpeech()};
requestAnimationFrame(loop);
</script>
