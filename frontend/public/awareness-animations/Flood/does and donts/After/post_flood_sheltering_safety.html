function scene4(t){gradient('#cdeedb','#f4ead2');const u=ease(t/.6);ctx.save();ctx.translate(640,260);ctx.scale(u*(1+.015*Math.sin(t*4)),u*(1+.015*Math.sin(t*4)));shadow(0,150,100,15);fan([[0,-120],[95,-80],[95,10],[60,80],[0,125],[-60,80],[-95,10],[-95,-80]],[0,-10],['#48b16d','#2f9e5a','#2c9152','#268348','#3aa55d']);line([[-42,-5],[-10,32],[48,-38]],'#fff',22);ctx.restore();ctx.save();ctx.globalAlpha=sm((t-.2)/.5);text(hindi?'सावधान रहें। सुरक्षित रहें।':'Stay Alert. Stay Safe.',640,491,47,'#283e33',700);ctx.restore()}

const CAP=[
 ['Keep children out of floodwater. If entry is unavoidable, protect your feet and probe with a stick. Avoid drains and watch for snakes.','बच्चों को बाढ़ के पानी से दूर रखें। मजबूरी में जूते पहनें और छड़ी से जाँचें। नालियों और साँपों से सावधान रहें।'],
 ['Do not use flooded electrical appliances until professionally checked. Discard food that has touched floodwater.','बाढ़ में भीगे बिजली के उपकरण जाँच से पहले इस्तेमाल न करें। बाढ़ के पानी से भीगा भोजन फेंक दें।'],
 ['Boil drinking water or use approved tablets as directed by local health advice. Follow tablet dose and waiting time. Stay tuned to local radio.','पीने का पानी उबालें या स्थानीय स्वास्थ्य सलाह और निर्देशानुसार जल शोधन टैबलेट लें। मात्रा और प्रतीक्षा समय का पालन करें। स्थानीय रेडियो सुनें।'],
 ['Stay alert. Stay safe.','सावधान रहें। सुरक्षित रहें।']
];
function caption(s){ctx.font='600 20px Arial';let lines=[],l='';for(const w of s.split(' ')){let test=l?l+' '+w:w;if(ctx.measureText(test).width>1090&&l){lines.push(l);l=w}else l=test}if(l)lines.push(l);let width=Math.max(...lines.map(x=>ctx.measureText(x).width))+48,h=lines.length*31+22,y=700-h;rect(640-width/2,y,width,h,'#42534cd9',22);lines.forEach((s,i)=>text(s,640,y+29+i*31,20,'#fff9e9'))}

const SHOTS=[{start:0,draw:scene1},{start:7,draw:scene2},{start:12,draw:scene3},{start:17,draw:scene4}];
function shotIndex(time){let index=0;for(let i=1;i<SHOTS.length;i++)if(time>=SHOTS[i].start)index=i;return index}
// Dissolve complete scene images, keeping each frame independent of playback history.
const previousCanvas=document.createElement('canvas'),nextCanvas=document.createElement('canvas');
previousCanvas.width=nextCanvas.width=W;previousCanvas.height=nextCanvas.height=H;
function frame(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;
 const index=shotIndex(t),shot=SHOTS[index],local=t-shot.start;
 shot.draw(local);
 if(index>0&&local<.42){
  nextCanvas.getContext('2d').drawImage(cv,0,0,W,H);
  ctx.globalAlpha=1;SHOTS[index-1].draw(shot.start-SHOTS[index-1].start-.01);
  previousCanvas.getContext('2d').drawImage(cv,0,0,W,H);
  ctx.globalAlpha=1;ctx.drawImage(previousCanvas,0,0,W,H);
  ctx.globalAlpha=sm(local/.42);ctx.drawImage(nextCanvas,0,0,W,H);ctx.globalAlpha=1;
 }
 caption(CAP[index][hindi?1:0]);rect(0,716,W*t/D,4,'#63b383');
}
// Narration is edited for the 20-second format; captions carry the fuller guidance.
const VO=[
 ['Keep children out of floodwater. If entry is unavoidable, use boots and a stick. Avoid drains. Watch for snakes.','बच्चों को बाढ़ के पानी से दूर रखें। मजबूरी में जूते और छड़ी लें। नालियों और साँपों से सावधान रहें।'],
 ['Have flooded appliances checked before use. Discard food touched by floodwater.','भीगे बिजली के उपकरण इस्तेमाल से पहले जाँच करवाएँ। बाढ़ में भीगा भोजन फेंक दें।'],
 ['Boil drinking water, or use purification tablets as directed. Keep listening to local radio.','पानी उबालें या निर्देशानुसार जल शोधन टैबलेट लें। स्थानीय रेडियो सुनते रहें।'],
 ['Stay alert. Stay safe.','सावधान रहें। सुरक्षित रहें।']
];
let floodGain,floodFilter;
let ac,master,noise,voices=[],speechToken=0;
if('speechSynthesis'in window){const load=()=>voices=speechSynthesis.getVoices();load();speechSynthesis.addEventListener('voiceschanged',load)}
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.65;master.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const stream=ac.createBufferSource();stream.buffer=noise;stream.loop=true;floodFilter=ac.createBiquadFilter();floodFilter.type="lowpass";floodFilter.frequency.value=450;floodGain=ac.createGain();floodGain.gain.value=0;stream.connect(floodFilter);floodFilter.connect(floodGain);floodGain.connect(master);stream.start()}catch(e){ac=null}}
function tone(f,d=.2,v=.1,type='sine',delay=0){if(!ac||muted)return;let o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.02)}
function hiss(f,d,v){if(!ac||muted)return;let n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),now=ac.currentTime;n.buffer=noise;fl.type='lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);n.connect(fl);fl.connect(g);g.connect(master);n.start();n.stop(now+d)}
function stopSpeech(){speechToken++;if(window.speechSynthesis)speechSynthesis.cancel()}
function speak(i){stopSpeech();if(muted||!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(VO[i][hindi?1:0]);u.lang=hindi?'hi-IN':'en-US';u.rate=i===3?1:1.28;u.pitch=1;u.volume=.95;u.voice=voices.find(v=>v.lang.startsWith(hindi?'hi':'en')&&v.localService)||voices.find(v=>v.lang.startsWith(hindi?'hi':'en'))||null;speechSynthesis.speak(u)}

const EV=[[.12,'v',0],[1.4,'tap'],[2.2,'tap'],[3,'tap'],[3.8,'snake'],[4.6,'tap'],[5.4,'tap'],[6.2,'tap'],[7.12,'v',1],[7.4,'buzz'],[8.35,'buzz'],[12.12,'v',2],[13.18,'fizz'],[14.4,'radio'],[17.12,'v',3],[17.22,'chime']];
function fire(e){
 if(e[1]==='v')speak(e[2]);
 else if(e[1]==='tap'){tone(420,.08,.09,'triangle');tone(160,.07,.04,'sine',.02)}
 else if(e[1]==='snake')hiss(5200,.38,.045);
 else if(e[1]==='buzz'){tone(155,.16,.07,'sawtooth');tone(165,.12,.045,'square',.12)}
 else if(e[1]==='fizz')hiss(3600,.65,.065);
 else if(e[1]==='radio'){tone(740,.2,.065);tone(988,.4,.05,'sine',.12)}
 else [523,659,784,1046].forEach((n,i)=>tone(n,1.3,.08,'sine',i*.07));
}
let t=0,playing=false,started=false,last=performance.now(),lastBeat=-1;
function pause(){playing=false;if(floodGain)floodGain.gain.setValueAtTime(0,ac.currentTime);stopSpeech();if(ac)ac.suspend();$('pp').textContent=t>=D?'Replay':'Play'}
function play(){if(t>=D)t=0;initAudio();if(ac)ac.resume();playing=true;last=performance.now();$('pp').textContent='Pause';}
$('start').onclick=()=>{started=true;$('overlay').style.display='none';$('pp').disabled=$('sk').disabled=$('replay').disabled=false;play()};
$('pp').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();t=0;lastBeat=-1;play()};
$('sk').oninput=()=>{pause();t=+$('sk').value;lastBeat=Math.floor(t/.6)};
$('lang').onclick=()=>{hindi=!hindi;$('lang').textContent='Hindi Subtitles: '+(hindi?'On':'Off');stopSpeech()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent='Sound: '+(muted?'Off':'On');if(master)master.gain.setTargetAtTime(muted?0:.65,ac.currentTime,.03);if(muted)stopSpeech()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});

let lastBubble=-1;
function floodAudio(time){
 if(!ac||!floodGain)return;
 const outdoors=time<7,boiling=time>=12&&time<17,active=playing&&(outdoors||boiling);
 const fade=outdoors?cl((7-time)/.35):cl((17-time)/.35);
 floodGain.gain.setTargetAtTime(active?(outdoors?.11:.025)*fade*(.87+.13*Math.sin(time*4)):0,ac.currentTime,.06);
 floodFilter.frequency.setTargetAtTime(outdoors?720:1300,ac.currentTime,.1);
 const bubble=Math.floor(time*7);
 if(playing&&boiling&&bubble!==lastBubble){lastBubble=bubble;tone(140+hash(bubble)*220,.065,.018,'sine')}
}
function loop(n){
 let dt=Math.min((n-last)/1000,.1);last=n;
 if(playing){const prev=t;t=Math.min(D,t+dt);for(const e of EV)if(prev<e[0]&&e[0]<=t)fire(e);
  const beat=Math.floor(t/.6);if(beat!==lastBeat){lastBeat=beat;const notes=[261.63,329.63,392,329.63,220,329.63,392,329.63];tone(notes[beat%8],.8,.018,'sine');if(beat%4===0)tone(130.81,1.5,.02,'triangle')}
  if(t>=D)pause();
 }
 floodAudio(t);frame(t);$('sk').value=t;$('tm').textContent=t.toFixed(1)+' / 20.0s';requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
