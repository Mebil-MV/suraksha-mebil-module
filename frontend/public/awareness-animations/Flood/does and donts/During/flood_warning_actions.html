if('speechSynthesis'in window){const load=()=>voices=speechSynthesis.getVoices();load();speechSynthesis.addEventListener('voiceschanged',load)}
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.65;master.connect(ac.destination);noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const stream=ac.createBufferSource();stream.buffer=noise;stream.loop=true;floodFilter=ac.createBiquadFilter();floodFilter.type="lowpass";floodFilter.frequency.value=450;floodGain=ac.createGain();floodGain.gain.value=0;stream.connect(floodFilter);floodFilter.connect(floodGain);floodGain.connect(master);stream.start()}catch(e){ac=null}}
function tone(f,d=.2,v=.1,type='sine',delay=0){if(!ac||muted)return;let o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.02)}
function hiss(f,d,v){if(!ac||muted)return;let n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),now=ac.currentTime;n.buffer=noise;fl.type='lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);n.connect(fl);fl.connect(g);g.connect(master);n.start();n.stop(now+d)}
function stopSpeech(){speechToken++;if(window.speechSynthesis)speechSynthesis.cancel()}
function speak(i){stopSpeech();if(muted||!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(VO[i][hindi?1:0]);u.lang=hindi?'hi-IN':'en-US';u.rate=i===3?1:1.22;u.pitch=1;u.volume=.95;u.voice=voices.find(v=>v.lang.startsWith(hindi?'hi':'en')&&v.localService)||voices.find(v=>v.lang.startsWith(hindi?'hi':'en'))||null;speechSynthesis.speak(u)}
const EV=[[.12,'v',0],[.4,'water'],[1.9,'crumble'],[4.4,'crumble'],[6.12,'v',1],[6.5,'zip'],[7.2,'zip'],[8.9,'solid'],[10.7,'zip'],[12.12,'v',2],[12.4,'water'],[13.2,'water'],[14.1,'water'],[15,'water'],[16,'water'],[17.12,'v',3],[17.2,'chime']];
function fire(e){if(e[1]==='v')speak(e[2]);else if(e[1]==='route'){[523,659,784].forEach((n,i)=>tone(n,.18,.07,'sine',i*.1))}else if(e[1]==='water')hiss(1700,.9,.12);else if(e[1]==='crumble')hiss(140,.95,.5);else if(e[1]==='solid')tone(140,.25,.16,'triangle');else if(e[1]==='pop')tone(550+e[2]*65,.12,.09,'sine');else if(e[1]==='zip')hiss(4200,.23,.09);else [523,659,784,1046].forEach((n,i)=>tone(n,1.3,.08,'sine',i*.07))}
let t=0,playing=false,started=false,last=performance.now(),lastBeat=-1;
function pause(){playing=false;if(floodGain)floodGain.gain.setValueAtTime(0,ac.currentTime);stopSpeech();if(ac)ac.suspend();$('pp').textContent=t>=D?'Replay':'Play'}
function play(){if(t>=D)t=0;initAudio();if(ac)ac.resume();playing=true;last=performance.now();$('pp').textContent='Pause';if(t>0){const i=t<6?0:t<12?1:t<17?2:3;/* resume visuals without repeating an entire caption */}}
$('start').onclick=()=>{started=true;$('overlay').style.display='none';$('pp').disabled=$('sk').disabled=$('replay').disabled=false;play()};
$('pp').onclick=()=>playing?pause():play();$('replay').onclick=()=>{pause();t=0;lastBeat=-1;play()};
$('sk').oninput=()=>{pause();t=+$('sk').value;lastBeat=Math.floor(t/.6)};
$('lang').onclick=()=>{hindi=!hindi;$('lang').textContent='Hindi Subtitles: '+(hindi?'On':'Off');stopSpeech()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent='Sound: '+(muted?'Off':'On');if(master)master.gain.setTargetAtTime(muted?0:.65,ac.currentTime,.03);if(muted)stopSpeech()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});
function floodAudio(time){if(!ac||!floodGain)return;const active=playing&&time<17;const outdoor=time>=12;const fade=cl((17-time)/.3);floodGain.gain.setTargetAtTime(active?(outdoor?.2:.11)*fade*(.9+.1*Math.sin(time*3)):0,ac.currentTime,.06);floodFilter.frequency.setTargetAtTime(outdoor?1200:2400,ac.currentTime,.1);}
function loop(n){let dt=Math.min((n-last)/1000,.1);last=n;if(playing){const prev=t;t=Math.min(D,t+dt);for(const e of EV)if(prev<e[0]&&e[0]<=t)fire(e);const beat=Math.floor(t/.6);if(beat!==lastBeat){lastBeat=beat;const notes=[261.63,329.63,392,329.63,220,329.63,392,329.63];tone(notes[beat%8],.8,.022,'sine');if(beat%4===0)tone(130.81,1.5,.025,'triangle')}if(t>=D)pause()}floodAudio(t);frame(t);$('sk').value=t;$('tm').textContent=t.toFixed(1)+' / 20.0s';requestAnimationFrame(loop)}
requestAnimationFrame(loop);
