<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heat Stroke First Aid</title><style>

              }
        .note{max-width:1280px;font-size:13px;opacity:.8}select{padding:7px;border-radius:8px}</style><body><canvas id="c" width="1280" height="720" aria-label="Heat stroke first aid animation"></canvas><div id="start-overlay"><button id="start-btn">▶ Play Animation & Audio</button></div><div class="bar"><button id="pp">Play</button><button id="replay">↻ Replay</button><input id="sk" aria-label="Timeline" type="range" min="0" max="20" step=".01" value="0"><span id="tm">0.0 / 20s</span><select id="language" aria-label="Narration language"><option value="en">English voice & subtitles</option><option value="hi">हिन्दी आवाज़ और उपशीर्षक</option></select><button id="mute">Sound: On</button></div><p class="note" id="status">Narration uses your browser’s available voices. Press Play to enable sound.</p><script>const W = 1280, H = 720, D = 20, TAU = Math.PI * 2, cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);

function wrap(s,max){let lines=[],cur='';for(const word of s.split(' ')){let v=cur?cur+' '+word:word;if(ctx.measureText(v).width>max&&cur){lines.push(cur);cur=word}else cur=v}if(cur)lines.push(cur);return lines}

poly([[248,-83],[293,-80],[317,-40],[248,-40]],'#548f9f');poly([[257,-78],[290,-76],[309,-45],[257,-45]],'#a4d1d9');ctx.fillStyle='#e7564f';ctx.fillRect(18,-35,220,14);ctx.fillRect(256,-31,70,10);
box(48,-104,104,56,'#e2edf0');ctx.fillStyle='#d94246';ctx.fillRect(87,-96,22,42);ctx.fillRect(77,-86,42,22);line([[231,-88],[231,-7]],'#8fa4aa',2);line([[263,-30],[275,-30]],'#657f89',3);
for(const wx of [68,272]){ctx.fillStyle='#243744';ctx.beginPath();ctx.arc(wx,0,29,0,TAU);ctx.fill();ctx.fillStyle='#9bafb7';ctx.beginPath();ctx.arc(wx,0,15,0,TAU);ctx.fill();ctx.fillStyle='#dae4e4';ctx.beginPath();ctx.arc(wx,0,7,0,TAU);ctx.fill()}
box(177,-141,61,15,'#263c4b');ctx.fillStyle=Math.sin(t*12)>0?'#ff5359':'#4fc5ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=22;ctx.fillRect(181,-139,24,12);ctx.fillStyle=Math.sin(t*12)>0?'#4fc5ff':'#ff5359';ctx.fillRect(210,-139,24,12);ctx.shadowBlur=0;box(322,-32,14,13,'#ffe4a2');txt('AMBULANCE',120,-47,14,'#275b6c');ctx.restore()}

if(t<16){ctx.save();ctx.translate(-sm(cl((t-7.7)/1.4))*180,0);for(let i=0;i<9;i++){let x=i*175-120;let h=130+hs(i)*140;fan([[x,420],[x,420-h],[x+105,400-h],[x+145,420-h+20],[x+145,420]],[x+70,370],'#af8b76',1,0);for(let j=0;j<3;j++)ctx.fillRect(x+20+j*29,440-h,13,28)}
ctx.fillStyle='#9d8b79';ctx.fillRect(0,420,1650,150);poly([[0,550],[1650,550],[1650,615],[0,640]],'#6d5441');for(let i=0;i<18;i++)tri([i*100,570],[i*100+110,615],[i*100,630],sh('#806248',.8+hs(i)*.3,0));
ctx.fillStyle='#f9e69c';ctx.beginPath();ctx.arc(1080,130,55,0,TAU);ctx.fill();for(let i=0;i<12;i++){let a=i*TAU/12;line([[1080+Math.cos(a)*74,130+Math.sin(a)*74],[1080+Math.cos(a)*94,130+Math.sin(a)*94]],'#ffeaa2',5)}
ctx.globalAlpha=1-safe;for(let i=0;i<10;i++){line(Array.from({length:20},(_,j)=>[110+i*108+Math.sin(j*.6+t*3+i)*8,260+j*14]),'rgba(255,236,170,.3)',3)}ctx.globalAlpha=1;
ctx.save();ctx.globalAlpha=safe;poly([[780,430],[1580,430],[1600,570],[660,570]],'#6b9f71');tree(1150,500,1.2);tree(1480,460,.8);poly([[700,450],[1150,450],[1210,570],[620,570]],'rgba(27,75,75,.2)');ctx.restore();
if(t>=11){const arrival=sm(cl((t-11)/3.7));ambulance(lp(-380,365,arrival),553,t);if(t>14.7){label(lang==='hi'?'एम्बुलेंस आ गई':'AMBULANCE ARRIVES',360,238,330)}}
const move=sm(cl((t-8)/2));let px=lp(545,1000,move);let py=lp(556,560,move);let seated=t>=10;ctx.save();ctx.translate(px,py);if(seated){line([[-65,-98],[80,-98]],'#76583f',16);line([[-53,-90],[-53,0]],'#624c39',9);line([[67,-90],[67,0]],'#624c39',9)}person(0,0,1.05,true,seated,t);ctx.restore();

}else{let bg=ctx.createLinearGradient(0,0,1280,720);bg.addColorStop(0,'#b9dfeb');bg.addColorStop(1,'#e7f1e9');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(640,240);let s=.85+.15*sm(cl((t-16)/.5));ctx.scale(s,s);fan([[0,-125],[98,-82],[88,32],[55,93],[0,128],[-55,93],[-88,32],[-98,-82]],[0,0],'#29946b',1,0);line([[-43,-5],[-12,29],[47,-40]],'#fff',19);ctx.restore();txt('Stay Alert. Stay Safe.',640,465,46,'#153e51')}

function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[];statusVoice()}
function statusVoice(){let yes=voices.some(v=>v.lang.toLowerCase().startsWith(lang));$('status').textContent=yes?'Browser narration ready. English / Hindi audio follows the selected language.':(lang==='hi'?'No Hindi voice detected. Hindi subtitles are available; install a Hindi system voice for narration.':'Narration needs an English browser voice. Subtitles remain available.')}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
function speak(i){if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();let voice=voices.find(v=>v.lang.toLowerCase().startsWith(lang));if(!voice){statusVoice();return}let u=new SpeechSynthesisUtterance((lang==='hi'?hi:en)[i]);u.voice=voice;u.lang=lang==='hi'?'hi-IN':'en-US';u.rate=lang==='hi'?1.22:1.16;speechSynthesis.speak(u)}
function tone(f,d=.2,v=.06,type='sine'){if(!ac||muted)return;let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function start(){if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(ac)ac.resume();$('start-overlay').style.display='none';if(t>=20)t=0;playing=true;spoken=-1;last=performance.now();$('pp').textContent='Pause'}
function pause(){playing=false;if(window.speechSynthesis)speechSynthesis.cancel();$('pp').textContent=t>=20?'Replay':'Play'}
$('start-btn').onclick=start;$('pp').onclick=()=>playing?pause():start();$('replay').onclick=()=>{t=0;beat=-1;start()};$('sk').oninput=()=>{pause();t=+$('sk').value;spoken=-1};$('language').onchange=()=>{lang=$('language').value;spoken=-1;if(window.speechSynthesis)speechSynthesis.cancel();statusVoice()};$('mute').onclick=()=>{muted=!muted;$('mute').textContent='Sound: '+(muted?'Off':'On');if(window.speechSynthesis)speechSynthesis.cancel();spoken=-1};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function loop(n){if(playing){t=Math.min(D,t+Math.min((n-last)/1000,.1));let i=t<8?0:t<16?1:2;if(i!==spoken){if(i>0){tone(i===1?880:660,.7);setTimeout(()=>{if(playing)tone(1320,.6,.04)},120)}speak(i);spoken=i}let b=Math.floor(t*2.6);if(t<8&&b!==beat){tone(65,.13,.11);if(b===3)tone(180,.25,.035,'sawtooth');beat=b}if(t>=20)pause()}last=n;frame(t);$('sk').value=t;$('tm').textContent=t.toFixed(1)+' / 20s';requestAnimationFrame(loop)}requestAnimationFrame(loop);
