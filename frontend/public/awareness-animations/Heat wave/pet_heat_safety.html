              :root {

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif

              body {

                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

                     if(t>=D){t=0;pt=-.01} playing = !playing;
                     pp.textContent = playing ? 'Pause' : 'Play';
                     last = performance.now();
                     if (playing) {
                            if (ac) ac.resume();
                     } else {
                            stopSpeech();
                            if (ac) ac.suspend();
                     }
              };

              sk.oninput = () => {
                     playing = false;
                     pp.textContent = 'Play';
                     t = +sk.value;
                     pt = t;
                     stopSpeech();
                     if (ac) ac.suspend();
              };

              btnL.onclick = () => {
                     showHindi = !showHindi;
                     btnL.textContent = showHindi ? 'Language: हिन्दी' : 'Language: English'; if(showHindi && !voices.some(v=>v.lang.startsWith('hi'))) document.getElementById('note').textContent='Hindi voice unavailable on this device. Hindi captions remain available.'; else document.getElementById('note').textContent='Voice uses your browser’s installed English / Hindi voices.';
                     stopSpeech();
              };

              requestAnimationFrame(loop);
       </script>
</body>

</html>
