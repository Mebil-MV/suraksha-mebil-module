  <style>
    :root {
      --bg: #090e17;
      --card-bg: #121c2b;
      --card-hover: #172437;
      --border: #1e314b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      padding: 30px 20px 80px;
      line-height: 1.5;
    }
    header {
      max-width: 1300px;
      margin: 0 auto 30px;
      text-align: center;
    }
    header h1 {
      font-size: 2.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 720px;
      margin: 0 auto 20px;
    }
    .stats {
      display: inline-flex;
      gap: 16px;
      background: #0f172a;
      padding: 8px 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--accent);
      margin-bottom: 25px;
    }
    .controls {
      max-width: 1300px;
      margin: 0 auto 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .search-row {
      display: flex;
      gap: 12px;
    }
    .search-bar {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #09111c;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 6px;
    }
    .pill {
      background: #0d1624;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .pill:hover, .pill.active {
      background: var(--accent);
      color: #08202b;
      border-color: var(--accent);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 22px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .cat-badge {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      background: #18283d;
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .phase-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .phase-Before { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .phase-During { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .phase-After { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .phase-General, .phase-Media { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.4); }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.4;
    }
    .card-path {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
      font-family: monospace;
      background: #070c14;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #08202b;
    }
    .btn-primary:hover {
      background: #7dd3fc;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover {
      background: #1e314b;
      color: #fff;
    }
    #previewModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-box {
      width: 100%;
      max-width: 1100px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
    }
    .modal-header {
      padding: 14px 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.1rem; color: #fff; }
    .close-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-body iframe {
      width: 100%;
      height: 650px;
      border: none;
      background: #000;
    }
  </style>
</head>

    let currentCat = 'all';
    let currentPhase = 'all';
    let currentSearch = '';

    const grid = document.getElementById('cardGrid');

    function render() {
      grid.innerHTML = '';
      const filtered = data.filter(item => {
        const matchCat = currentCat === 'all' || item.category === currentCat;
        const matchPhase = currentPhase === 'all' || item.phase.includes(currentPhase);
        const q = currentSearch.toLowerCase();
        const matchSearch = !q || item.title.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.fileName.toLowerCase().includes(q);
        return matchCat && matchPhase && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No animations match your filters.</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        const phaseClass = 'phase-' + (item.phase.includes('Before') ? 'Before' : item.phase.includes('During') ? 'During' : item.phase.includes('After') ? 'After' : 'General');
        card.innerHTML = `
          <div class="card-top">
            <span class="cat-badge">${item.category}</span>
            <span class="phase-badge ${phaseClass}">${item.phase}</span>
          </div>
          <h3 class="card-title">${item.title}</h3>
          <div class="card-path">${item.relativePath}</div>
          <div class="card-actions">
            <button class="btn btn-primary" onclick="openModal('${encodeURI(item.publicUrl)}', '${item.title.replace(/'/g, "\'")}')">▶ Preview</button>
            <a class="btn btn-outline" href="${encodeURI(item.publicUrl)}" target="_blank">New Tab ↗</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        render();
      });
    });

    document.querySelectorAll('[data-phase]').forEach(btn => {
      btn.addEventListener('click', e => {
        document.querySelectorAll('[data-phase]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPhase = btn.dataset.phase;
        render();
      });
    });

    document.getElementById('search').addEventListener('input', e => {
      currentSearch = e.target.value;
      render();
    });

    function openModal(url, title) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalFrame').src = url;
      document.getElementById('previewModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalFrame').src = '';
      document.getElementById('previewModal').style.display = 'none';
    }

    window.onclick = function(e) {
      if (e.target === document.getElementById('previewModal')) closeModal();
    };

    render();
  </script>
