<head>

<title>Landslide Media & Community Education</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2f38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--fg:#e8e4d8}}
:root[data-theme="dark"]{--bg:#14181e;--fg:#e8e4d8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;position:relative}
canvas{width:100%;max-width:1280px;height:auto;aspect-ratio:16/9;border-radius:10px;background:#000;display:block}
.bar{display:flex;gap:12px;align-items:center;width:100%;max-width:1280px;margin-top:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:120px}
button{font:inherit;padding:6px 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#start-overlay{position:absolute;top:12px;left:12px;right:12px;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:rgba(0,0,0,.65);border-radius:10px;display:flex;justify-content:center;align-items:center;z-index:10}
#start-overlay button{background:#f4ead2;color:#14181e;border:none;padding:16px 32px;font-size:22px;font-weight:600;border-radius:50px;transition:transform .2s}
#start-overlay button:hover{transform:scale(1.05)}
</style>
</head>

  const s=bo(cl((t-18.5)/.6))*(1+.03*Math.sin(t*5));ctx.save();ctx.translate(640,260);ctx.scale(s,s);fan([[0,-130],[100,-90],[100,10],[62,86],[0,132],[-62,86],[-100,10],[-100,-90]],[0,-10],'#2f9e5a',1,0);check(0,-5,1,'#fff',22);ctx.restore();
  ctx.globalAlpha=cl((t-18.8)/.4);ctx.font='700 46px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#14181e';ctx.fillText(showHindi?'शिक्षित करें। तैयार रहें। सुरक्षित रहें।':'Educate. Prepare. Stay Safe.',640,490);ctx.globalAlpha=1}
}

function labels(t){
 ctx.textAlign='left';const T=showHindi?TX_HI:TX_EN;
 for(const[a,b,slot,ti,ax,ay]of LB){const al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)continue;ctx.font='600 24px system-ui,sans-serif';const s=T[ti],w=ctx.measureText(s).width+84,x=36-30*(1-al),y=96+slot*64;
  ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='rgba(47,158,90,.9)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x+w,y+23);ctx.lineTo(ax,ay);ctx.stroke();ctx.fillStyle='#2f9e5a';ctx.beginPath();ctx.arc(ax,ay,6,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(8,14,24,.78)';rr(x,y,w,46,12);ctx.fill();ctx.strokeStyle='#2f9e5a';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#2f9e5a';ctx.beginPath();ctx.arc(x+30,y+23,15,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('i',x+30,y+30);ctx.textAlign='left';
  ctx.font='600 24px system-ui,sans-serif';ctx.fillStyle='#f4ead2';ctx.fillText(s,x+60,y+31);ctx.restore()}
}
function wrap(s,n){const ws=s.split(' '),L=[''];for(const w of ws){const c=L[L.length-1];if(c&&(c+' '+w).length>n)L.push(w);else L[L.length-1]=c?c+' '+w:w}return L}

function frame(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(t<8.1)s1(t);else if(t<15.1)s2(t);else s3(t);
 for(const b of [8.1,15.1]){const d=cl(1-Math.abs(t-b)/.35);if(d>0){ctx.fillStyle=`rgba(244,234,210,${d})`;ctx.fillRect(0,0,W,H)}}
 if(t<18.3)labels(t);
 if(t>.5&&t<2.9){const y=lp(-80,70,bo(cl((t-.5)/.9))),s=showHindi?'सामुदायिक शिक्षा':'COMMUNITY EDUCATION';ctx.save();ctx.globalAlpha=cl((2.9-t)/.4);ctx.font='800 52px system-ui,sans-serif';ctx.textAlign='center';const w=ctx.measureText(s).width+80;ctx.fillStyle='rgba(8,14,24,.72)';rr(640-w/2,y-50,w,82,18);ctx.fill();ctx.fillStyle='#2f9e5a';ctx.fillRect(640-w/2+20,y+20,w-40,5);ctx.fillStyle='#f4ead2';ctx.fillText(s,640,y+8);ctx.restore()}
 const V=showHindi?VH:VE;
 for(let i=0;i<6;i++){const[a,b]=CT[i],al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)continue;const L=wrap(V[i],showHindi?40:46);ctx.font='600 26px system-ui,sans-serif';ctx.textAlign='center';const w=Math.max(...L.map(l=>ctx.measureText(l).width))+56,h=L.length*34+18,y=704-h;ctx.globalAlpha=al;ctx.fillStyle='rgba(8,14,24,.7)';rr(640-w/2,y,w,h,22);ctx.fill();ctx.fillStyle='#f4ead2';L.forEach((l,n)=>ctx.fillText(l,640,y+36+n*34));ctx.globalAlpha=1}
 const fd=Math.max(1-t/.35,1-(D-t)/.35,0);if(fd>0){ctx.fillStyle=`rgba(0,0,0,${cl(fd)})`;ctx.fillRect(0,0,W,H)}
}

// ---- Audio ----
let ac,nb,ambG,voices=[];
if(window.speechSynthesis){const lv=()=>voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=lv;lv()}
function initAudio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;ambG=ac.createGain();ambG.gain.value=0;s.connect(f);f.connect(ambG);ambG.connect(ac.destination);s.start()}catch(e){ac=null}}
function tone(f,d,v,type,delay=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)}
function burst(ft,f,d,v){if(!ac)return;const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.value=f;const g=ac.createGain(),n=ac.currentTime;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(n,Math.random());s.stop(n+d+.05)}
function speak(i){if(!window.speechSynthesis)return;speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance((showHindi?VH:VE)[i]);u.lang=showHindi?'hi-IN':'en-US';u.rate=showHindi?1.0:1.12;const tl=showHindi?'hi':'en';let v=voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService&&(v.name.includes('Google')||v.name.includes('Neural')))||voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService)||voices.find(v=>v.lang.toLowerCase().includes(tl));if(v)u.voice=v;speechSynthesis.speak(u)},40)}
const EV=[[.3,'v',0],[4.5,'v',1],[8.3,'v',2],[11.5,'v',3],[15.1,'v',4],[18.5,'v',5],[1.0,'r'],[2.2,'d'],[3.4,'n'],[9.6,'s'],[10.4,'s'],[11.6,'r'],[17.8,'t'],[18.4,'c']];
function fire(e){const k=e[1];if(k==='v')speak(e[2]);else if(k==='r'){burst('bandpass',3000,.35,.25);burst('highpass',5000,.2,.15)}else if(k==='d'){tone(1320,.8,.16,'sine');tone(1760,.9,.1,'sine',.08)}else if(k==='n'){tone(523,.5,.12,'triangle');tone(659,.5,.12,'triangle',.18);tone(784,.7,.12,'triangle',.36)}else if(k==='s'){burst('highpass',2500,.05,.5);burst('highpass',2500,.05,.4)}else if(k==='t'){tone(90,.5,.5,'sine');burst('lowpass',250,.35,.6)}else{tone(880,1.2,.18,'sine');tone(1320,1.4,.12,'sine',.12)}}
function audioTick(t){if(!ac||!ambG)return;ambG.gain.setTargetAtTime(t>8.1&&t<15.1?.04:0,ac.currentTime,.2)}

let t=0,pt=0,playing=false,last=performance.now();
const pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),btnL=document.getElementById('lang'),overlay=document.getElementById('start-overlay');
const stopSpeech=()=>{if(window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';initAudio();if(window.speechSynthesis){const d=new SpeechSynthesisUtterance('');d.volume=0;speechSynthesis.speak(d)}playing=true;last=performance.now();pp.disabled=sk.disabled=false;pp.textContent='Pause'};
function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;
 if(playing){t+=dt;if(t>=D){t=0;pt=-.01;stopSpeech()}sk.value=t;for(const e of EV)if(pt<e[0]&&e[0]<=t)fire(e)}
 pt=t;audioTick(t);frame(t);tm.textContent=t.toFixed(1)+'s';requestAnimationFrame(loop)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play';last=performance.now();if(playing){if(ac)ac.resume()}else{stopSpeech();if(ac)ac.suspend()}};
sk.oninput=()=>{playing=false;pp.textContent='Play';t=+sk.value;pt=t;stopSpeech();if(ac)ac.suspend()};
btnL.onclick=()=>{showHindi=!showHindi;btnL.textContent='Hindi Subtitles: '+(showHindi?'On':'Off');stopSpeech()};
requestAnimationFrame(loop);
</script>
