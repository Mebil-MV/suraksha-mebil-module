<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
       <title>Landslide Ready Reckoner</title>
       <style>
              :root {
                     --bg: #f4f1ea;
                     --fg: #2a2f38;
                     box-sizing: border-box;
                     padding-top: env(safe-area-inset-top, 0px);
                     padding-bottom: env(safe-area-inset-bottom, 0px)
              }

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

<body>
       <canvas id="c" width="1280" height="720"></canvas>
       <div id="start-overlay"><button id="start-btn">▶ Play Animation & Audio</button></div>
       <div class="bar">
              <button id="pp" disabled>Play</button>
              <!-- Extended slider max to 16.5 seconds -->
              <input id="sk" type="range" min="0" max="16.5" step="0.01" value="0" disabled>
              <span id="tm">0.0s</span>
              <button id="lang">Hindi Subtitles: Off</button>
       </div>
       <script>
              // Extended duration (D) to 16.5s to give the final voiceover time to finish naturally
              const W = 1280, H = 720, D = 16.5, TAU = Math.PI * 2, cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
              cv.width = W * dpr; cv.height = H * dpr;
              const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, lp = (a, b, k) => a + (b - a) * k, sm = k => k * k * (3 - 2 * k), mod = (a, n) => ((a % n) + n) % n;
              function hs(n) { n |= 0; n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296 }
              const hx = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), mx = (a, b, k) => a.map((v, i) => lp(v, b[i], k)), rg = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
              const sh = (c, f, k) => rg(mx(hx(c), [22, 32, 44], k * .45).map(v => Math.min(255, v * f)));
              const tri = (a, b, c, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.fill() };
              const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h) };

              const gy = x => 550 + 14 * Math.sin(x * .007) + 50 * Math.exp(-(((x - 1400) / 85) ** 2));

              const VE = ['Know which areas are most prone to landslides?', 'Avoid old landslide zones and the edges of steep slopes.', 'Also stay away from drainage hollows and filled slopes.', 'Stay alert. Stay safe.'];
              const VH = ['क्या आप जानते हैं कि लैंडस्लाइड का खतरा कहाँ होता है?', 'पुराने लैंडस्लाइड और खड़ी ढलानों के किनारों से दूर रहें।', 'पानी के गड्ढों और मिट्टी भरी ढलानों से भी बचें।', 'सावधान रहें। सुरक्षित रहें।'];

              // Extended final caption duration to match new 16.5s length
              const CT = [[.3, 3.9], [4.2, 8.9], [9.2, 12.9], [13.1, 16.2]];

              const TX_EN = ['Old and/or recent existing landslides', 'Base or top of slopes', 'Base of minor drainage hollows', 'Base or top of an old fill slope', 'Base or top of a steep cut slope'];
              const TX_HI = ['पुराने या नए लैंडस्लाइड', 'ढलान के एकदम ऊपर या नीचे का हिस्सा', 'पानी के गड्ढों का निचला हिस्सा', 'भरी हुई पुरानी ढलान का हिस्सा', 'खड़ी कटी ढलान का हिस्सा'];
              const LB = [[4.7, 9, 0, 0, 520, 430], [6.9, 9, 1, 1, 980, 300], [9.5, 13, 0, 2, 1400, 540], [10.7, 13, 1, 3, 1950, 460], [11.9, 13, 2, 4, 1950, 350]];
              const GR = [[420, 335, 195, 175, 4.6, 9], [890, 130, 180, 90, 6.9, 9.2], [850, 440, 260, 80, 6.9, 9.2], [1290, 480, 230, 100, 9.4, 13], [1740, 404, 420, 110, 10.6, 13], [1770, 285, 370, 122, 11.8, 13]];
              let showHindi = false;

              function peak(cx, top, w, base, c, k) {
                     const T = [cx, top], L = [cx - w / 2, base], R = [cx + w / 2, base], M = [cx + w * .05, top + (base - top) * .5], B = [cx - w * .12, base], N = [cx - w * .14, top + (base - top) * .42];
                     tri(T, L, N, sh(c, 1.15, k)); tri(T, N, M, sh(c, .95, k)); tri(T, M, R, sh(c, .7, k)); tri(L, N, B, sh(c, .9, k)); tri(N, M, B, sh(c, .8, k)); tri(M, R, B, sh(c, .6, k))
              }
              function tree(x, y, s, k) { ctx.fillStyle = sh('#5b4130', 1, k); ctx.fillRect(x - 3 * s, y - 22 * s, 6 * s, 22 * s); for (let j = 0; j < 3; j++) { const b = y - 12 * s - j * 18 * s, w = (36 - j * 8) * s; tri([x - w / 2, b], [x, b - 30 * s], [x + w / 2, b], sh('#3f8a4a', .8 + j * .18, k)) } }
              function cloud(x, y, r, k) { for (let j = 0; j < 4; j++) { const cx = x + j * r * .9, cy = y + (j % 2 ? -r * .3 : 0), rad = r * (1 - .1 * j); ctx.fillStyle = rg(mx([245, 248, 250], [44, 52, 62], k), .92); ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * .7) } ctx.fill() } }

              function cam(t) { const z = sm(cl((t - 4) / 1.2)), p = sm(cl((t - 8.8) / 1)), c1 = lp(1000, 620, z) + 140 * cl((t - 5.2) / 3.5); return { x: lp(c1, 1500 + 200 * cl((t - 9.8) / 3.2), p), y: lp(380, 400, z), s: lp(.64, 1.25, z) } }

              function world(t, k) {
                     peak(700, 200, 760, 620, '#8aa6bd', k); peak(1500, 190, 860, 620, '#8aa6bd', k);
                     peak(220, 260, 560, 620, '#6f9560', k); peak(1250, 240, 620, 620, '#6a8f5c', k); peak(1950, 250, 1000, 620, '#6b8a5e', k);
                     peak(480, 320, 420, 620, '#5f8a40', k); peak(980, 140, 360, 620, '#7a8a78', k);
                     ctx.fillStyle = sh('#6b4f32', 1, k); ctx.beginPath(); ctx.moveTo(-200, 1300); for (let x = -200; x <= 2400; x += 50)ctx.lineTo(x, gy(x)); ctx.lineTo(2400, 1300); ctx.fill();
                     for (let x = -200; x < 2400; x += 100) { const g0 = gy(x), g1 = gy(x + 100), m = [x + 50 + (hs(x) - .5) * 30, Math.max(g0, g1) + 80 + hs(x + 3) * 30]; tri([x, g0], [x + 100, g1], m, sh('#5f8a40', .8 + .4 * hs(x), k)); tri([x, g0], m, [x - 20, g0 + 120], sh('#4a7a3a', .7 + .3 * hs(x + 1), k)); tri([x + 100, g1], m, [x + 120, g1 + 120], sh('#55803c', .6 + .3 * hs(x + 2), k)) }
                     fan([[455, 345], [510, 350], [565, 470], [600, 506], [430, 506], [435, 430]], [500, 430], '#8b6a45', 1, k);
                     for (let i = 0; i < 9; i++) { const x = 450 + hs(i) * 170, y = gy(x) - 4, s = 6 + hs(i + 3) * 8; tri([x - s, y], [x - s * .3, y - s * 1.2], [x + s, y], sh(i % 2 ? '#7a5a38' : '#8f8b84', .9, k)) }
                     fan([[1760, 400], [1830, 310], [1950, 290], [2070, 310], [2140, 400]], [1950, 360], '#9a8a74', 1, k);
                     fan([[1780, 414], [2120, 414], [2180, 506], [1720, 506]], [1950, 470], '#7a6a4a', .9, k);
                     ctx.fillStyle = sh('#555c64', 1, k); ctx.fillRect(1700, 398, 700, 16); ctx.strokeStyle = 'rgba(240,230,190,.7)'; ctx.lineWidth = 2; ctx.setLineDash([18, 14]); ctx.beginPath(); ctx.moveTo(1700, 406); ctx.lineTo(2400, 406); ctx.stroke(); ctx.setLineDash([]);
                     for (const x of [60, 140, 330, 640, 720, 1120, 1200, 1620, 1680, 2250]) tree(x, gy(x), 1.3, k);
                     ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(95,150,180,.95)'; ctx.lineWidth = 9; ctx.beginPath(); for (let x = 1100; x <= 1700; x += 20) { const y = gy(x) + 8; x <= 1100 ? ctx.moveTo(x, y) : ctx.lineTo(x, y) } ctx.stroke();
                     ctx.strokeStyle = 'rgba(235,245,250,.7)'; ctx.lineWidth = 3; ctx.setLineDash([14, 22]); ctx.lineDashOffset = -t * 70; ctx.beginPath(); for (let x = 1100; x <= 1700; x += 20) { const y = gy(x) + 8; x <= 1100 ? ctx.moveTo(x, y) : ctx.lineTo(x, y) } ctx.stroke(); ctx.setLineDash([]); ctx.lineCap = 'butt'
              }

              function grids(t) {
                     for (const [x, y, w, h, a, b] of GR) {
                            const al = Math.min(cl((t - a) / .4), cl((b - t) / .4)); if (al <= 0) continue; const u = 1 + .25 * (1 - cl((t - a) / .4)), pl = .5 + .5 * Math.sin(t * 12), cx = x + w / 2, cy = y + h / 2;
                            ctx.save(); ctx.globalAlpha = al; ctx.translate(cx, cy); ctx.scale(u, u); ctx.translate(-cx, -cy); ctx.fillStyle = `rgba(255,40,50,${.16 + .14 * pl})`; ctx.fillRect(x, y, w, h);
                            ctx.strokeStyle = `rgba(255,70,80,${.55 + .35 * pl})`; ctx.lineWidth = 1.5; ctx.beginPath(); for (let i = 0; i <= w; i += 20) { ctx.moveTo(x + i, y); ctx.lineTo(x + i, y + h) } for (let j = 0; j <= h; j += 20) { ctx.moveTo(x, y + j); ctx.lineTo(x + w, y + j) } ctx.stroke();
                            ctx.lineWidth = 4; ctx.strokeStyle = '#ff2a38'; ctx.strokeRect(x, y, w, h); ctx.restore()
                     }
              }

              function labels(t, c) {
                     ctx.font = '600 24px system-ui,sans-serif'; ctx.textAlign = 'left'; const T = showHindi ? TX_HI : TX_EN;
                     for (const [a, b, slot, ti, ax, ay] of LB) {
                            const al = Math.min(cl((t - a) / .3), cl((b - t) / .3)); if (al <= 0) continue; const s = T[ti], w = ctx.measureText(s).width + 84, x = 36 - 30 * (1 - al), y = 96 + slot * 64, sx = 640 + (ax - c.x) * c.s, sy = 360 + (ay - c.y) * c.s;
                            ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = 'rgba(255,70,80,.85)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + w, y + 23); ctx.lineTo(sx, sy); ctx.stroke(); ctx.fillStyle = '#ff2a38'; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TAU); ctx.fill();
                            ctx.fillStyle = 'rgba(8,14,24,.78)'; rr(x, y, w, 46, 12); ctx.fill(); ctx.strokeStyle = '#ff2a38'; ctx.lineWidth = 2; ctx.stroke();
                            tri([x + 14, y + 36], [x + 31, y + 8], [x + 48, y + 36], '#ff2a38'); ctx.fillStyle = '#fff'; ctx.font = '800 20px system-ui,sans-serif'; ctx.fillText('!', x + 27, y + 33);
                            ctx.font = '600 24px system-ui,sans-serif'; ctx.fillStyle = '#f4ead2'; ctx.fillText(s, x + 60, y + 31); ctx.restore()
                     }
              }

              const bo = u => { const n = 7.5625, d = 2.75; if (u < 1 / d) return n * u * u; if (u < 2 / d) return n * (u -= 1.5 / d) * u + .75; if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + .9375; return n * (u -= 2.625 / d) * u + .984375 };

              function frame(t) {
                     ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                     const k = t < 3.6 ? sm(t / 3.6) * .85 : .85, q = sm(cl((t - .3) / 3)), ri = cl((t - 1.4) / 1.6) * .85 * (1 - cl((t - 12.4) / .6));
                     const g = ctx.createLinearGradient(0, 0, 0, H * .7); g.addColorStop(0, rg(mx(hx('#6fa3c9'), hx('#232f3b'), k))); g.addColorStop(.6, rg(mx(hx('#a9d0e0'), hx('#46565f'), k))); g.addColorStop(1, rg(mx(hx('#f4e4b8'), hx('#79878a'), k))); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                     if (k < 1) { const sg = ctx.createRadialGradient(1000, 110, 6, 1000, 110, 100); sg.addColorStop(0, `rgba(255,244,200,${.95 * (1 - k)})`); sg.addColorStop(1, 'rgba(255,244,200,0)'); ctx.fillStyle = sg; ctx.fillRect(800, 0, 400, 300) }
                     ctx.globalAlpha = .25 + .75 * q; for (let i = 0; i < 7; i++)cloud(mod(i * 230 + t * 16, 1700) - 250, lp(-60, 50 + hs(i) * 110, q), 30 + hs(i + 4) * 28 + q * 18, k); ctx.globalAlpha = 1;
                     const c = cam(t); ctx.save(); ctx.translate(640, 360); ctx.scale(c.s, c.s); ctx.translate(-c.x, -c.y); world(t, k); grids(t); ctx.restore();
                     ctx.fillStyle = `rgba(10,18,28,${.28 * k})`; ctx.fillRect(0, 0, W, H);
                     if (t > 2.6 && t < 3.2) { ctx.fillStyle = `rgba(225,236,255,${.35 * Math.pow(Math.max(0, Math.sin((t - 2.6) / .6 * Math.PI * 2)), 2)})`; ctx.fillRect(0, 0, W, H) }
                     ctx.strokeStyle = 'rgba(200,220,235,.45)'; ctx.lineWidth = 1.3; ctx.beginPath(); for (let i = 0; i < 380; i++) { if (hs(i) > ri) continue; const y = mod(hs(i + 3) * 900 + t * (850 + hs(i + 4) * 400), 820) - 50, x = mod(hs(i + 1) * 1500, 1500) - 100 + y * .18, len = 14 + hs(i + 5) * 14; ctx.moveTo(x - len * .18, y - len); ctx.lineTo(x, y) } ctx.stroke();
                     labels(t, c);
                     // title
                     if (t > 1.1 && t < 4.4) { const y = lp(-80, 230, bo(cl((t - 1.1) / .9))), s = showHindi ? 'लैंडस्लाइड रेडी रेकनर' : 'LANDSLIDE READY RECKONER'; ctx.save(); ctx.globalAlpha = cl((4.4 - t) / .4); ctx.font = '800 56px system-ui,sans-serif'; ctx.textAlign = 'center'; const w = ctx.measureText(s).width + 80; ctx.fillStyle = 'rgba(8,14,24,.72)'; rr(640 - w / 2, y - 52, w, 84, 18); ctx.fill(); ctx.fillStyle = '#ff2a38'; ctx.fillRect(640 - w / 2 + 20, y + 22, w - 40, 5); ctx.fillStyle = '#f4ead2'; ctx.fillText(s, 640, y + 8); ctx.restore() }
                     // scene 4
                     if (t > 12.4) {
                            const a = sm(cl((t - 12.5) / .7));
                            if (t < 13.3) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = `blur(${Math.round(a * 14 * dpr)}px)`; ctx.drawImage(cv, 0, 0); ctx.restore() }
                            const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#cdeedb'); bg.addColorStop(1, '#f4ead2'); ctx.globalAlpha = a; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
                            if (t > 12.9) {
                                   const s = bo(cl((t - 12.9) / .6)) * (1 + .03 * Math.sin(t * 5)); ctx.save(); ctx.translate(640, 250); ctx.scale(s, s);
                                   const P = [[0, -120], [95, -80], [95, 10], [60, 80], [0, 125], [-60, 80], [-95, 10], [-95, -80]]; fan(P, [0, -10], '#2f9e5a', 1, 0);
                                   ctx.strokeStyle = '#fff'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-42, -5); ctx.lineTo(-10, 32); ctx.lineTo(48, -38); ctx.stroke(); ctx.restore();
                                   ctx.globalAlpha = cl((t - 13.2) / .4); ctx.font = '700 46px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#14181e'; ctx.fillText(showHindi ? 'सावधान रहें। सुरक्षित रहें।' : 'Stay Alert. Stay Safe.', 640, 490); ctx.globalAlpha = 1
                            }
                     }
                     // captions
                     const V = showHindi ? VH : VE; for (let i = 0; i < 4; i++) {
                            const [a, b] = CT[i], al = Math.min(cl((t - a) / .3), cl((b - t) / .3)); if (al <= 0) continue; const s = V[i]; let L = [s]; if (s.length > 45) { let m = s.length >> 1, j = s.lastIndexOf(' ', m); if (j < 0) j = s.indexOf(' '); L = [s.slice(0, j), s.slice(j + 1)] }
                            ctx.font = '600 26px system-ui,sans-serif'; ctx.textAlign = 'center'; const w = Math.max(...L.map(l => ctx.measureText(l).width)) + 56, h = L.length * 34 + 18, y = 704 - h; ctx.globalAlpha = al; ctx.fillStyle = 'rgba(8,14,24,.7)'; rr(640 - w / 2, y, w, h, 22); ctx.fill(); ctx.fillStyle = '#f4ead2'; L.forEach((l, n) => ctx.fillText(l, 640, y + 36 + n * 34)); ctx.globalAlpha = 1
                     }
                     const fd = Math.max(1 - t / .35, 1 - (D - t) / .35, 0); if (fd > 0) { ctx.fillStyle = `rgba(0,0,0,${cl(fd)})`; ctx.fillRect(0, 0, W, H) }
              }

              // ---- Audio: synthesized SFX + browser speech voiceover ----
              let ac, rumG, rainG, voices = [];
              if (window.speechSynthesis) {
                     const loadVoices = () => voices = speechSynthesis.getVoices();
                     speechSynthesis.onvoiceschanged = loadVoices;
                     loadVoices();
              }

              function initAudio() {
                     try {
                            ac = new (window.AudioContext || window.webkitAudioContext)(); const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++)d[i] = Math.random() * 2 - 1;
                            const ns = (type, f) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = ac.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(); return g };
                            rumG = ns('lowpass', 110); rainG = ns('highpass', 3500)
                     } catch (e) { ac = null }
              }

              function tone(f, d, v, type, delay = 0) { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + delay; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d + .05) }

              function speak(i) {
                     if (!window.speechSynthesis) return;

                     speechSynthesis.cancel();

                     setTimeout(() => {
                            const u = new SpeechSynthesisUtterance((showHindi ? VH : VE)[i]);
                            u.lang = showHindi ? 'hi-IN' : 'en-US';
                            u.rate = 1.0;
                            u.pitch = 1.0;

                            const targetLang = showHindi ? 'hi' : 'en';

                            let bestVoice = voices.find(v => v.lang.toLowerCase().includes(targetLang) && v.localService && (v.name.includes('Google') || v.name.includes('Neural')));
                            if (!bestVoice) bestVoice = voices.find(v => v.lang.toLowerCase().includes(targetLang) && v.localService);
                            if (!bestVoice) bestVoice = voices.find(v => v.lang.toLowerCase().includes(targetLang));

                            if (bestVoice) u.voice = bestVoice;
                            speechSynthesis.speak(u);
                     }, 40);
              }

              const EV = [[.3, 'v', 0], [4.2, 'v', 1], [9.2, 'v', 2], [13.2, 'v', 3], [4.6, 'b'], [6.9, 'b'], [9.4, 'b'], [10.6, 'b'], [11.8, 'b'], [13.4, 'c']];
              function fire(e) { if (e[1] === 'v') speak(e[2]); else if (e[1] === 'b') { tone(1500, .09, .08, 'square'); tone(1500, .09, .08, 'square', .14) } else { tone(880, 1.2, .18, 'sine'); tone(1320, 1.4, .12, 'sine', .12) } }
              function audioTick(t) { if (!ac || !rumG) return; const rv = t < 4 ? 1.4 * sm(cl(t / 3.5)) : t < 5 ? 1.4 * (5 - t) : 0, rn = t > 1.4 && t < 13 ? .05 * cl((t - 1.4) / 1.6) : 0; rumG.gain.setTargetAtTime(rv, ac.currentTime, .1); rainG.gain.setTargetAtTime(rn, ac.currentTime, .1) }

              let t = 0, pt = 0, playing = false, last = performance.now();
              const pp = document.getElementById('pp'), sk = document.getElementById('sk'), tm = document.getElementById('tm'), btnL = document.getElementById('lang'), overlay = document.getElementById('start-overlay');
              const stopSpeech = () => { if (window.speechSynthesis) speechSynthesis.cancel() };

              document.getElementById('start-btn').onclick = () => {
                     overlay.style.display = 'none';
                     initAudio();

                     if (window.speechSynthesis) {
                            let dummy = new SpeechSynthesisUtterance('');
                            dummy.volume = 0;
                            speechSynthesis.speak(dummy);
                     }

                     playing = true;
                     last = performance.now();
                     pp.disabled = sk.disabled = false;
                     pp.textContent = 'Pause';
              };

              function loop(n) {
                     const dt = Math.min((n - last) / 1000, .1); last = n;
                     if (playing) { t += dt; if (t >= D) { t = 0; pt = -.01; stopSpeech() } sk.value = t; for (const e of EV) if (pt < e[0] && e[0] <= t) fire(e) }
                     pt = t; audioTick(t); frame(t); tm.textContent = t.toFixed(1) + 's'; requestAnimationFrame(loop)
              }

              pp.onclick = () => {
                     playing = !playing;
                     pp.textContent = playing ? 'Pause' : 'Play';
                     last = performance.now();
                     if (playing) {
                            if (ac) ac.resume();
                     } else {
                            stopSpeech();
                            if (ac) ac.suspend();
                     }
              };

              sk.oninput = () => {
                     playing = false;
                     pp.textContent = 'Play';
                     t = +sk.value;
                     pt = t;
                     stopSpeech();
                     if (ac) ac.suspend();
              };

              btnL.onclick = () => {
                     showHindi = !showHindi;
                     btnL.textContent = 'Hindi Subtitles: ' + (showHindi ? 'On' : 'Off');
                     stopSpeech();
              };

              requestAnimationFrame(loop);
       </script>
</body>
