<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
       <title>Landslide Safe Zones</title>
       <style>
              :root {
                     --bg: #f4f1ea;
                     --fg: #2a2f38;
                     box-sizing: border-box;
                     padding-top: env(safe-area-inset-top, 0px);
                     padding-bottom: env(safe-area-inset-bottom, 0px)
              }

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block;
                     box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2)
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer;
                     transition: all 0.2s
              }

              button:hover:not(:disabled) {
                     background: rgba(128, 128, 128, 0.1)
              }

              button:disabled {
                     opacity: .5;
                     cursor: not-allowed
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #3fe07a;
                     color: #081e14;
                     border: none;
                     padding: 16px 36px;
                     font-size: 22px;
                     font-weight: 700;
                     border-radius: 50px;
                     box-shadow: 0 4px 15px rgba(63, 224, 122, 0.4);
                     transition: transform .2s, box-shadow .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05);
                     box-shadow: 0 6px 20px rgba(63, 224, 122, 0.6)
              }
       </style>
</head>

<body>
       <canvas id="c" width="1280" height="720"></canvas>
       <div id="start-overlay"><button id="start-btn">▶ Play Animation</button></div>
       <div class="bar">
              <button id="pp" disabled>Play</button>
              <!-- Extended duration to 16 seconds -->
              <input id="sk" type="range" min="0" max="16" step="0.01" value="0" disabled>
              <span id="tm" style="min-width:40px;text-align:right;font-variant-numeric:tabular-nums">0.0s</span>
              <button id="lang">Hindi Subtitles: Off</button>
       </div>
       <script>
              // Updated Duration to 16 for proper voice cutoff padding
              const W = 1280, H = 720, D = 16, TAU = Math.PI * 2, cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
              cv.width = W * dpr; cv.height = H * dpr;
              const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, lp = (a, b, k) => a + (b - a) * k, sm = k => k * k * (3 - 2 * k), mod = (a, n) => ((a % n) + n) % n;
              function hs(n) { n |= 0; n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296 }
              const hx = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), mx = (a, b, k) => a.map((v, i) => lp(v, b[i], k)), rg = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
              const sh = (c, f) => rg(hx(c).map(v => Math.min(255, v * f)));
              const tri = (a, b, c, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.fill() };
              const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h) };
              const fan = (P, c, col, f) => { for (let i = 0; i < P.length; i++)tri(c, P[i], P[(i + 1) % P.length], sh(col, f + (hs(i * 7 + P[0][0]) - .5) * .4)) };
              const bo = u => { const n = 7.5625, d = 2.75; if (u < 1 / d) return n * u * u; if (u < 2 / d) return n * (u -= 1.5 / d) * u + .75; if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + .9375; return n * (u -= 2.625 / d) * u + .984375 };
              const base = x => 520 + 10 * Math.sin(x * .007), pl = x => sm(cl((x - 880) / 120)) * (1 - sm(cl((x - 1420) / 60)));
              const gy = x => lp(base(x), 540, pl(x)) + 100 * Math.exp(-(((x - 1540) / 50) ** 4));

              // Updated CTA voiceover strings
              const VE = ['Seek areas safe from landslides: Look for hard, non-jointed bedrock.', 'Choose flat-lying areas away from slopes, or the nose of ridges.', 'Stay alert. Stay safe.'];
              const VH = ['भूस्खलन से सुरक्षित क्षेत्र खोजें: कठोर, बिना दरार वाली चट्टान देखें।', 'ढलानों से दूर समतल क्षेत्र, या पहाड़ी कटक का अग्रभाग चुनें।', 'सतर्क रहें। सुरक्षित रहें।'];
              const CT = [[0.5, 5.5], [6.0, 11.5]];
              const TX_EN = ['Hard, non-jointed bedrock that has not moved in the past', 'Flat-lying areas away from slopes and steep river banks', 'The nose of ridges, set back from the tops of slopes'];
              const TX_HI = ['कठोर, बिना दरार वाली चट्टान जो पहले कभी खिसकी न हो', 'ढलानों और खड़े नदी किनारों से दूर समतल क्षेत्र', 'कटक का अग्रभाग, ढलानों के शीर्ष से पीछे हटकर'];
              const LB = [[2.0, 5.8, 0, 0, 470, 420], [7.5, 11.8, 0, 1, 1200, 500], [9.5, 11.8, 1, 2, 1720, 430]];
              const ZN = [[330, 310, 290, 215, 2.0, 470, 300], [960, 455, 480, 90, 7.5, 1200, 400], [1600, 330, 240, 210, 9.5, 1720, 300]];
              let showHindi = false;

              function peak(cx, top, w, b, c) {
                     const T = [cx, top], L = [cx - w / 2, b], R = [cx + w / 2, b], M = [cx + w * .05, top + (b - top) * .5], B = [cx - w * .12, b], N = [cx - w * .14, top + (b - top) * .42];
                     tri(T, L, N, sh(c, 1.15)); tri(T, N, M, sh(c, .95)); tri(T, M, R, sh(c, .75)); tri(L, N, B, sh(c, .9)); tri(N, M, B, sh(c, .82)); tri(M, R, B, sh(c, .65))
              }
              function tree(x, y, s) { ctx.fillStyle = '#6b4a32'; ctx.fillRect(x - 3 * s, y - 22 * s, 6 * s, 22 * s); for (let j = 0; j < 3; j++) { const b = y - 12 * s - j * 18 * s, w = (36 - j * 8) * s; tri([x - w / 2, b], [x, b - 30 * s], [x + w / 2, b], sh('#3fa354', .85 + j * .2)) } }
              function cloud(x, y, r) { for (let j = 0; j < 4; j++) { const cx = x + j * r * .9, cy = y + (j % 2 ? -r * .3 : 0), rad = r * (1 - .1 * j); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * .7) } ctx.fill() } }
              function shield(x, y, s, t, a, noShadow = false) {
                     const u = bo(cl((t - a) / .6)); if (u <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * u * (1 + .04 * Math.sin(Math.max(0, t - a) * 5)), s * u * (1 + .04 * Math.sin(Math.max(0, t - a) * 5)));
                     if (!noShadow) { ctx.shadowColor = '#3fe07a'; ctx.shadowBlur = 30; }
                     fan([[0, -60], [48, -40], [48, 5], [30, 40], [0, 62], [-30, 40], [-48, 5], [-48, -40]], [0, -5], '#2fbf6a', 1); ctx.shadowBlur = 0;
                     ctx.strokeStyle = '#fff'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-21, -2); ctx.lineTo(-5, 16); ctx.lineTo(24, -19); ctx.stroke(); ctx.restore()
              }

              function cam(t) { const p = sm(cl((t - 6) / 2)), q = sm(cl((t - 8.5) / 1.5)); return { x: lp(lp(620 + t * 6, 1250, p), 1650, q), y: lp(400, 380, q), s: lp(1, 1.08, q) } }

              function world(t) {
                     peak(700, 230, 800, 700, '#9cc7e0'); peak(1500, 200, 900, 700, '#9cc7e0');
                     peak(250, 260, 600, 700, '#5fb060'); peak(1180, 260, 700, 700, '#58a85a'); peak(1850, 190, 900, 700, '#4f9f58');
                     ctx.fillStyle = '#8a6a45'; ctx.beginPath(); ctx.moveTo(-200, 1300); for (let x = -200; x <= 2400; x += 25)ctx.lineTo(x, gy(x)); ctx.lineTo(2400, 1300); ctx.fill();
                     for (let x = -200; x < 2400; x += 100) { const g0 = gy(x), g1 = gy(x + 100), m = [x + 50 + (hs(x) - .5) * 30, Math.max(g0, g1) + 80 + hs(x + 3) * 30]; tri([x, g0], [x + 100, g1], m, sh('#58c25a', .85 + .35 * hs(x))); tri([x, g0], m, [x - 20, g0 + 120], sh('#4aa84e', .75 + .3 * hs(x + 1))); tri([x + 100, g1], m, [x + 120, g1 + 120], sh('#52b556', .65 + .3 * hs(x + 2))) }
                     ctx.fillStyle = 'rgba(70,150,210,.95)'; ctx.fillRect(1502, 620 + Math.sin(t * 4) * 1.5, 76, 50); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.setLineDash([10, 14]); ctx.lineDashOffset = -t * 40; ctx.beginPath(); ctx.moveTo(1506, 632); ctx.lineTo(1574, 632); ctx.stroke(); ctx.setLineDash([]);
                     fan([[330, 525], [365, 385], [450, 322], [560, 358], [610, 525]], [470, 430], '#a2abb5', 1); tri([450, 322], [560, 358], [500, 430], 'rgba(255,255,255,.18)');
                     fan([[1560, 545], [1640, 400], [1740, 340], [1810, 365], [1840, 545]], [1700, 450], '#6aba62', 1);
                     ctx.fillStyle = '#f0e2c0'; ctx.fillRect(1170, gy(1200) - 46, 70, 46); tri([1160, gy(1200) - 46], [1205, gy(1200) - 82], [1250, gy(1200) - 46], '#c85a44'); ctx.fillStyle = '#8a6a45'; ctx.fillRect(1198, gy(1200) - 28, 16, 28); ctx.fillStyle = '#8fd0f0'; ctx.fillRect(1176, gy(1200) - 36, 14, 12);
                     for (const x of [80, 150, 700, 780, 1020, 1330, 1400, 1650, 1870, 2200]) tree(x, gy(x), 1.3);
                     for (const [x, y, w, h, a, sx, sy] of ZN) { const al = cl((t - a) / .5); if (al <= 0) continue; const p = .5 + .5 * Math.sin(t * 5); ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = `rgba(63,224,122,${.14 + .1 * p})`; rr(x, y, w, h, 18); ctx.fill(); ctx.strokeStyle = '#3fe07a'; ctx.lineWidth = 4; ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t * 30; ctx.stroke(); ctx.setLineDash([]); ctx.restore(); shield(sx, sy, 1.1, t, a) }
              }

              function labels(t, c) {
                     ctx.textAlign = 'left'; const T = showHindi ? TX_HI : TX_EN;
                     for (const [a, b, slot, ti, ax, ay] of LB) {
                            const al = Math.min(cl((t - a) / .3), cl((b - t) / .3)); if (al <= 0) continue; ctx.font = '600 24px system-ui,sans-serif'; const s = T[ti], w = ctx.measureText(s).width + 84, x = 36 - 30 * (1 - al), y = 100 + slot * 64, sx = 640 + (ax - c.x) * c.s, sy = 360 + (ay - c.y) * c.s;
                            ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = 'rgba(63,224,122,.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + w, y + 23); ctx.lineTo(sx, sy); ctx.stroke(); ctx.fillStyle = '#3fe07a'; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TAU); ctx.fill();
                            ctx.fillStyle = 'rgba(8,30,20,.78)'; rr(x, y, w, 46, 12); ctx.fill(); ctx.strokeStyle = '#3fe07a'; ctx.lineWidth = 2; ctx.stroke();
                            ctx.fillStyle = '#2fbf6a'; ctx.beginPath(); ctx.arc(x + 30, y + 23, 15, 0, TAU); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x + 23, y + 23); ctx.lineTo(x + 28, y + 29); ctx.lineTo(x + 38, y + 17); ctx.stroke();
                            ctx.fillStyle = '#f4ead2'; ctx.fillText(s, x + 60, y + 31); ctx.restore()
                     }
              }

              function frame(t) {
                     ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                     const g = ctx.createLinearGradient(0, 0, 0, H * .7); g.addColorStop(0, '#4f9ad6'); g.addColorStop(.6, '#9fd3ee'); g.addColorStop(1, '#fbeec0'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                     const sg = ctx.createRadialGradient(1000, 110, 6, 1000, 110, 130 + 10 * Math.sin(t * 2)); sg.addColorStop(0, 'rgba(255,248,210,1)'); sg.addColorStop(1, 'rgba(255,244,200,0)'); ctx.fillStyle = sg; ctx.fillRect(760, 0, 480, 320);
                     for (let i = 0; i < 6; i++)cloud(mod(i * 260 + t * 14, 1700) - 250, 60 + hs(i) * 120, 28 + hs(i + 4) * 22);
                     const c = cam(t); ctx.save(); ctx.translate(640, 360); ctx.scale(c.s, c.s); ctx.translate(-c.x, -c.y); world(t); ctx.restore();
                     ctx.fillStyle = 'rgba(255,230,150,.07)'; ctx.fillRect(0, 0, W, H);
                     labels(t, c);

                     if (t > 0.3 && t < 5.5) { const y = lp(-80, 230, bo(cl((t - 0.3) / 0.9))), s = showHindi ? 'भूस्खलन से आमतौर पर सुरक्षित क्षेत्र' : 'Areas generally safe from landslides'; ctx.save(); ctx.globalAlpha = cl((5.5 - t) / 0.5); ctx.font = '800 54px system-ui,sans-serif'; ctx.textAlign = 'center'; const w = ctx.measureText(s).width + 80; ctx.fillStyle = 'rgba(8,30,20,.72)'; rr(640 - w / 2, y - 52, w, 84, 18); ctx.fill(); ctx.fillStyle = '#3fe07a'; ctx.fillRect(640 - w / 2 + 20, y + 22, w - 40, 5); ctx.fillStyle = '#f4ead2'; ctx.fillText(s, 640, y + 8); ctx.restore() }

                     const V = showHindi ? VH : VE;
                     for (let i = 0; i < 2; i++) {
                            const [a, b] = CT[i], al = Math.min(cl((t - a) / .3), cl((b - t) / .3)); if (al <= 0) continue;
                            const s = V[i]; let m = s.length >> 1, j = s.lastIndexOf(' ', m); if (j < 0) j = s.indexOf(' '); const L = [s.slice(0, j), s.slice(j + 1)];
                            ctx.font = '600 26px system-ui,sans-serif'; ctx.textAlign = 'center'; const w = Math.max(...L.map(l => ctx.measureText(l).width)) + 56, h = L.length * 34 + 18, y = 704 - h; ctx.globalAlpha = al; ctx.fillStyle = 'rgba(8,30,20,.7)'; rr(640 - w / 2, y, w, h, 22); ctx.fill(); ctx.fillStyle = '#f4ead2'; L.forEach((l, n) => ctx.fillText(l, 640, y + 36 + n * 34)); ctx.globalAlpha = 1;
                     }

                     // Re-designed CTA Scene to exactly match the provided screenshot
                     const cta = cl((t - 11.8) / 0.5);
                     if (cta > 0) {
                            // 1. Matched Gradient Background
                            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
                            bgGrad.addColorStop(0, '#e5f2e3');
                            bgGrad.addColorStop(1, '#f1ebd8');
                            ctx.fillStyle = bgGrad;
                            ctx.globalAlpha = cta;
                            ctx.fillRect(0, 0, W, H);

                            ctx.save();
                            ctx.globalAlpha = cta;

                            // 2. Shield styling matching the image (larger, no glow)
                            shield(640, 260, 3.2, t, 11.8, true);

                            // 3. Main Title Text styling
                            ctx.font = '700 52px system-ui,sans-serif';
                            ctx.textAlign = 'center';
                            ctx.fillStyle = '#111'; // Dark black/grey
                            ctx.fillText(showHindi ? 'सतर्क रहें। सुरक्षित रहें।' : 'Stay Alert. Stay Safe.', 640, 520);

                            // 4. Centered Gray Caption Pill at the bottom
                            const capText = showHindi ? 'सतर्क रहें। सुरक्षित रहें।' : 'Stay alert. Stay safe.';
                            ctx.font = '600 24px system-ui,sans-serif';
                            const cw = ctx.measureText(capText).width + 60;
                            ctx.fillStyle = 'rgba(0,0,0,0.5)'; // Transparent gray pill
                            rr(640 - cw / 2, 600, cw, 50, 25);
                            ctx.fill();
                            ctx.fillStyle = '#ffffff';
                            ctx.fillText(capText, 640, 633);

                            ctx.restore();
                     }

                     const fd = Math.max(1 - t / .35, 1 - (D - t) / .5, 0); if (fd > 0) { ctx.fillStyle = `rgba(0,0,0,${cl(fd)})`; ctx.fillRect(0, 0, W, H) }
              }

              // Better TTS Logic: Targeting Natural & Female Voices
              let ac;
              function initAudio() { try { ac = new (window.AudioContext || window.webkitAudioContext)() } catch (e) { ac = null } }
              function tone(f, d, v, type, delay = 0) { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + delay; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, n); g.gain.linearRampToValueAtTime(v, n + .03); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d + .05) }

              function speak(i) {
                     if (!window.speechSynthesis) return;
                     const text = (showHindi ? VH : VE)[i];
                     const u = new SpeechSynthesisUtterance(text);

                     u.lang = showHindi ? 'hi-IN' : 'en-US';
                     u.rate = 0.95; // Slightly slower enunciation avoids the rushed robotic sound
                     u.pitch = 1.1; // Slightly pitched up maps better to female synthesizers

                     const voices = speechSynthesis.getVoices();
                     const prefix = showHindi ? 'hi' : 'en';
                     const langVoices = voices.filter(v => v.lang.toLowerCase().startsWith(prefix));

                     // Search keywords prioritizing natural female voices (OS dependent)
                     const keywords = ['female', 'woman', 'samantha', 'zira', 'google', 'swara', 'natural'];
                     let bestVoice = langVoices.find(v => keywords.some(k => v.name.toLowerCase().includes(k)));

                     if (!bestVoice && langVoices.length > 0) bestVoice = langVoices[0];
                     if (bestVoice) u.voice = bestVoice;

                     speechSynthesis.speak(u);
              }

              const EV = [
                     [0.5, 's'],
                     [0.8, 'v', 0],
                     [2.0, 'p'],
                     [6.0, 'v', 1],
                     [7.5, 'p'],
                     [9.5, 'p'],
                     [12.0, 'o'],
                     [12.2, 'v', 2] // Starts at 12.2s. Extrapolated 16s duration guarantees it finishes cleanly.
              ];

              function fire(e) { const k = e[1]; if (k === 'v') speak(e[2]); else if (k === 's') [523, 659, 784, 1047].forEach((f, i) => tone(f, 2, .07, 'triangle', i * .04)); else if (k === 'p') { tone(1175, .5, .08, 'sine'); tone(1568, .6, .06, 'sine', .1) } else if (k === 'o') { tone(784, 1.2, .1, 'sine'); tone(988, 1.2, .08, 'sine', .1) } }

              let t = 0, pt = 0, playing = false, last = performance.now();
              const pp = document.getElementById('pp'), sk = document.getElementById('sk'), tm = document.getElementById('tm'), btnL = document.getElementById('lang'), overlay = document.getElementById('start-overlay');
              const stopSpeech = () => { if (window.speechSynthesis) speechSynthesis.cancel() };
              document.getElementById('start-btn').onclick = () => { overlay.style.display = 'none'; initAudio(); playing = true; last = performance.now(); pp.disabled = sk.disabled = false; pp.textContent = 'Pause' };
              function loop(n) {
                     const dt = Math.min((n - last) / 1000, .1); last = n;
                     if (playing) { t += dt; if (t >= D) { t = 0; pt = -.01; stopSpeech() } sk.value = t; for (const e of EV) if (pt < e[0] && e[0] <= t) fire(e) }
                     pt = t; frame(t); tm.textContent = t.toFixed(1) + 's'; requestAnimationFrame(loop)
              }
              pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; last = performance.now(); if (playing) { if (ac) ac.resume() } else { stopSpeech(); if (ac) ac.suspend() } };
              sk.oninput = () => { playing = false; pp.textContent = 'Play'; t = +sk.value; pt = t; stopSpeech(); if (ac) ac.suspend() };
              btnL.onclick = () => { showHindi = !showHindi; btnL.textContent = 'Hindi Subtitles: ' + (showHindi ? 'On' : 'Off'); stopSpeech(); };

              // Force initialize voices ahead of playback
              if (window.speechSynthesis) {
                     speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
              }
              requestAnimationFrame(loop);
       </script>
</body>
