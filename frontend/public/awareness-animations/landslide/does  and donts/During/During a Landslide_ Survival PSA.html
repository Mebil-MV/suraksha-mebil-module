<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>During a Landslide: Survival PSA</title>
<style>
:root{--bg:#f4f1ea;--fg:#2a2f38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181e;--fg:#e8e4d8}}
:root[data-theme="dark"]{--bg:#14181e;--fg:#e8e4d8}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px;position:relative}
canvas{width:100%;max-width:1280px;height:auto;aspect-ratio:16/9;border-radius:10px;background:#000;display:block}
.bar{display:flex;gap:12px;align-items:center;width:100%;max-width:1280px;margin-top:10px;flex-wrap:wrap}
.bar input{flex:1;min-width:120px}
button{font:inherit;padding:6px 16px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#start-overlay{position:absolute;top:12px;left:12px;right:12px;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:rgba(0,0,0,.65);border-radius:10px;display:flex;justify-content:center;align-items:center;z-index:10}
#start-overlay button{background:#f4ead2;color:#14181e;border:none;padding:16px 32px;font-size:22px;font-weight:600;border-radius:50px;transition:transform .2s}
#start-overlay button:hover{transform:scale(1.05)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="start-overlay"><button id="start-btn">▶ Play Animation &amp; Audio</button></div>
<div class="bar">
<button id="pp" disabled>Play</button>
<input id="sk" type="range" min="0" max="20" step="0.01" value="0" disabled>
<span id="tm">0.0s</span>
<button id="lang">Hindi Subtitles: Off</button>
</div>
<script>
const W=1280,H=720,D=20,TAU=Math.PI*2,K=.85,cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,lp=(a,b,k)=>a+(b-a)*k,sm=k=>k*k*(3-2*k),mod=(a,n)=>((a%n)+n)%n;
function hs(n){n|=0;n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return(n>>>0)/4294967296}
const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),mx=(a,b,k)=>a.map((v,i)=>lp(v,b[i],k)),rg=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const sh=(c,f,k)=>rg(mx(hx(c),[22,32,44],k*.45).map(v=>Math.min(255,v*f)));
const tri=(a,b,c,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.fill()};
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)};
const fan=(P,c,col,f,k)=>{for(let i=0;i<P.length;i++)tri(c,P[i],P[(i+1)%P.length],sh(col,f+(hs(i*7+P[0][0])-.5)*.4,k))};
const oct=(x,y,r,n=8)=>Array.from({length:n},(_,i)=>[x+Math.cos(i/n*TAU)*r,y+Math.sin(i/n*TAU)*r]);

const VE=['Stay awake and monitor a battery-powered radio for intense rainfall warnings. If you remain at home, move to a second story.','Listen closely for cracking trees or boulders knocking. If stream water suddenly turns muddy, move quickly. Save yourself, not your belongings.','When driving, watch the road for mud and collapsed pavement. Stay alert, stay safe.'];
const VH=['पूरी रात जागते रहें और तेज़ बारिश की चेतावनी के लिए बैटरी वाला रेडियो सुनते रहें। यदि आप घर पर रहते हैं, तो ऊपरी मंज़िल पर चले जाएँ।','चटकते पेड़ों या टकराते पत्थरों की आवाज़ ध्यान से सुनें। यदि नदी का पानी अचानक मटमैला हो जाए, तो तुरंत भागें। अपनी जान बचाएँ, सामान नहीं।','गाड़ी चलाते समय सड़क पर कीचड़ और धँसी हुई सड़क पर नज़र रखें। सावधान रहें। सुरक्षित रहें।'];
const RT=[1.08,1.2,1.05],CT=[[.3,7.8],[8.2,14.8],[15.2,19.6]];
const TX_EN=['Stay alert and awake','Move to a second story','Listen for cracking trees','Watch for muddy water','Save yourself, not belongings','Watch for collapsed pavement'];
const TX_HI=['सतर्क रहें और जागते रहें','ऊपरी मंज़िल पर जाएँ','चटकते पेड़ों की आवाज़ सुनें','मटमैले पानी पर नज़र रखें','जान बचाएँ, सामान नहीं','धँसी हुई सड़क से सावधान'];
// [start,end,textIdx,pillX,pillY,anchorX,anchorY]
const LB=[[.8,7.8,0,830,100,452,530],[5.3,7.9,1,830,170,640,440],[8.5,12.8,2,24,24,232,470],[9.8,14.6,3,664,24,880,590],[11.5,14.6,4,664,90,900,520],[15.6,17.4,5,740,100,990,580]];
let showHindi=false;

function peak(cx,top,w,base,c,k){const T=[cx,top],L=[cx-w/2,base],R=[cx+w/2,base],M=[cx+w*.05,top+(base-top)*.5],B=[cx-w*.12,base],N=[cx-w*.14,top+(base-top)*.42];tri(T,L,N,sh(c,1.15,k));tri(T,N,M,sh(c,.95,k));tri(T,M,R,sh(c,.7,k));tri(L,N,B,sh(c,.9,k));tri(N,M,B,sh(c,.8,k));tri(M,R,B,sh(c,.6,k))}
function tree(x,y,s,k){ctx.fillStyle=sh('#5b4130',1,k);ctx.fillRect(x-3*s,y-22*s,6*s,22*s);for(let j=0;j<3;j++){const b=y-12*s-j*18*s,w=(36-j*8)*s;tri([x-w/2,b],[x,b-30*s],[x+w/2,b],sh('#3f8a4a',.8+j*.18,k))}}
function cloud(x,y,r,k){for(let j=0;j<4;j++){const cx=x+j*r*.9,cy=y+(j%2?-r*.3:0),rad=r*(1-.1*j);ctx.fillStyle=rg(mx([245,248,250],[44,52,62],k),.92);ctx.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU;ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad*.7)}ctx.fill()}}
function boulder(x,y,r,s){fan(Array.from({length:8},(_,i)=>{const a=i/8*TAU,d=r*(.8+.3*hs(s+i));return[x+Math.cos(a)*d,y+Math.sin(a)*d*.8]}),[x,y],'#8f8b84',1,K)}
function grass(x0,x1,y,seed){for(let x=x0;x<x1;x+=80)tri([x,y],[x+80,y],[x+40+(hs(x+seed)-.5)*20,y+45+hs(x+seed+2)*35],sh('#4a7a3a',.6+.4*hs(x+seed+1),K))}

function car(x,y,s,col,dir,wr,tilt,brk){
 ctx.save();ctx.translate(x,y);ctx.rotate(tilt||0);ctx.scale(dir*s,s);
 tri([118,-45],[330,-12],[330,-78],'rgba(255,240,170,.16)');

 tri([-48,-65],[-32,-94],[-2,-94],'#bfe3f2');tri([-48,-65],[-2,-94],[-2,-65],'#a5cfe0');tri([6,-65],[6,-94],[44,-94],'#bfe3f2');tri([6,-65],[44,-94],[66,-65],'#a5cfe0');
 ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(116,-46,7,0,TAU);ctx.fill();
 ctx.fillStyle=brk?'#ff2a38':'#7a1f1f';ctx.beginPath();ctx.arc(-114,-46,brk?9:6,0,TAU);ctx.fill();
 for(const wx of[-65,70]){ctx.save();ctx.translate(wx,-24);ctx.rotate(wr);fan(oct(0,0,24),[0,0],'#23272e',1,.3);ctx.strokeStyle='#9aa4ad';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<3;i++){const a=i/3*Math.PI;ctx.moveTo(Math.cos(a)*12,Math.sin(a)*12);ctx.lineTo(-Math.cos(a)*12,-Math.sin(a)*12)}ctx.stroke();ctx.restore()}
 ctx.restore()}
function redX(cx,cy,r,t){const p=1+.14*Math.sin(t*10);ctx.save();ctx.translate(cx,cy);ctx.scale(p,p);ctx.shadowColor='#ff2a38';ctx.shadowBlur=20;ctx.lineCap='round';ctx.strokeStyle='#ff2a38';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-r,-r);ctx.lineTo(r,r);ctx.moveTo(r,-r);ctx.lineTo(-r,r);ctx.stroke();ctx.restore()}
function person(x,y,s,ph,run,fc){
 ctx.lineCap='round';ctx.lineJoin='round';const w=run?1:0;ctx.strokeStyle=sh('#2b3a55',1.2,.2);ctx.lineWidth=10*s;
 for(const d of[0,Math.PI]){const a=Math.sin(ph+d)*w;ctx.beginPath();ctx.moveTo(x,y-42*s);ctx.lineTo(x+fc*a*26*s,y-Math.max(0,Math.cos(ph+d))*w*12*s);ctx.stroke()}
 ctx.strokeStyle=sh('#d86a4a',.9,.2);ctx.lineWidth=8*s;
 for(const d of[0,Math.PI]){const a=Math.sin(ph+d+Math.PI)*w;ctx.beginPath();ctx.moveTo(x,y-84*s);ctx.lineTo(x+fc*(a*22*s+(run?10*s:0)),y-58*s);ctx.stroke()}
 fan([[x-15*s,y-40*s],[x+15*s,y-40*s],[x+12*s,y-92*s],[x-12*s,y-92*s]],[x,y-66*s],'#d86a4a',1,.2);
 const hy=y-110*s;fan(oct(x,hy,16*s),[x,hy],'#e8b98a',1,.2);tri([x-17*s,hy-4*s],[x,hy-24*s],[x+17*s,hy-4*s],'#2a2118')}
function suitcase(x,y,s){fan([[x,y-34*s],[x+46*s,y-34*s],[x+46*s,y],[x,y]],[x+23*s,y-17*s],'#8b5a2b',1,.2);ctx.strokeStyle='#3a2a18';ctx.lineWidth=4*s;ctx.strokeRect(x+14*s,y-44*s,18*s,10*s);ctx.fillStyle='#d8b24a';ctx.fillRect(x+4*s,y-20*s,38*s,4*s)}
function rings(x,y,t,al){if(al<=0)return;ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=3;for(let j=0;j<3;j++){const u=((t*1.4+j/3)%1);ctx.globalAlpha=al*(1-u)*.8;ctx.beginPath();ctx.arc(x,y,10+u*80,0,TAU);ctx.stroke()}ctx.restore()}

function sky(t){const g=ctx.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,rg(mx(hx('#6fa3c9'),hx('#232f3b'),K)));g.addColorStop(.6,rg(mx(hx('#a9d0e0'),hx('#46565f'),K)));g.addColorStop(1,rg(mx(hx('#f4e4b8'),hx('#79878a'),K)));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<7;i++)cloud(mod(i*230+t*16,1700)-250,40+hs(i)*110,48+hs(i+4)*28,K)}

function scene1(t){
 peak(1000,260,700,600,'#6a8f5c',K);peak(1180,300,520,600,'#6f9560',K);peak(120,300,500,600,'#5f8a40',K);
 ctx.fillStyle=sh('#4a3a28',1,K);ctx.fillRect(0,590,W,140);grass(0,W,590,0);
 ctx.fillStyle=sh('#555c64',1,K);ctx.fillRect(850,596,430,56);ctx.strokeStyle='rgba(240,230,190,.7)';ctx.lineWidth=3;ctx.setLineDash([24,18]);ctx.lineDashOffset=-t*120;ctx.beginPath();ctx.moveTo(850,624);ctx.lineTo(1280,624);ctx.stroke();ctx.setLineDash([]);
 // roof + shell
 tri([100,205],[470,80],[300,205],sh('#7a3b32',1.1,K));tri([300,205],[470,80],[640,205],sh('#7a3b32',.9,K));tri([640,205],[470,80],[840,205],sh('#7a3b32',.65,K));
 ctx.fillStyle=sh('#6e665c',1,K);ctx.fillRect(120,200,700,397);
 ctx.fillStyle=sh('#e9c88c',1,.12);ctx.fillRect(140,215,660,170);ctx.fillStyle=sh('#e0b97a',.95,.12);ctx.fillRect(140,405,660,180);
 ctx.fillStyle=sh('#4a443c',1,K);ctx.fillRect(120,385,480,22);ctx.fillRect(720,385,100,22);
 // upstairs: window + sofa
 ctx.fillStyle=sh('#35506a',1,.3);ctx.fillRect(470,250,110,90);ctx.strokeStyle='rgba(220,235,245,.6)';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<6;i++){const x=480+i*18+mod(t*60,18);ctx.moveTo(x,255);ctx.lineTo(x-10,300)}ctx.stroke();ctx.strokeStyle='#5b4130';ctx.lineWidth=6;ctx.strokeRect(470,250,110,90);
 fan([[180,290],[380,290],[380,340],[180,340]],[280,315],'#3f6a8a',.9,.15);fan([[170,335],[390,335],[390,385],[170,385]],[280,360],'#4b7a9a',1,.15);
 if(t>5.4){const g=ctx.createRadialGradient(560,300,10,560,300,200);g.addColorStop(0,`rgba(60,255,130,${.25*cl((t-5.4)/.6)})`);g.addColorStop(1,'rgba(60,255,130,0)');ctx.fillStyle=g;ctx.fillRect(140,215,660,170)}
 // stairs
 for(let i=0;i<8;i++){const yt=585-(i+1)*25;ctx.fillStyle=sh('#9a7a52',.9+(i%2)*.2,.15);ctx.fillRect(500+i*27.5,yt,27.5,585-yt)}
 // bed + sitting character
 ctx.fillStyle=sh('#7a4e2d',1,.15);ctx.fillRect(150,470,16,115);ctx.fillRect(160,545,250,40);rr(165,520,240,30,8);ctx.fillStyle=sh('#c9d8e8',1,.12);ctx.fill();rr(172,498,50,24,8);ctx.fillStyle='#fff';ctx.fill();
 const bob=Math.sin(t*3)*1.5;fan([[232,522],[268,522],[262,462+bob],[238,462+bob]],[250,490],'#d86a4a',1,.15);
 fan(oct(250,440+bob,19),[250,440+bob],'#e8b98a',1,.15);tri([232,436+bob],[250,414+bob],[268,436+bob],'#2a2118');ctx.fillStyle='#14181e';ctx.beginPath();ctx.arc(244,441+bob,2.5,0,TAU);ctx.arc(257,441+bob,2.5,0,TAU);ctx.fill();
 fan([[262,522],[405,522],[405,548],[262,548]],[333,535],'#3c6fa8',1,.15);
 // radio
 ctx.fillStyle=sh('#5b4130',1,.15);ctx.fillRect(425,548,60,37);rr(430,516,50,32,5);ctx.fillStyle='#222831';ctx.fill();ctx.strokeStyle='#222831';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(472,516);ctx.lineTo(494,476);ctx.stroke();ctx.fillStyle='#ffe27a';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(442+i*8,532,2.4,0,TAU);ctx.fill()}
 ctx.save();ctx.strokeStyle='#ffe27a';ctx.lineWidth=3;for(let j=0;j<3;j++){const u=((t*1.2+j/3)%1);ctx.globalAlpha=(1-u)*.7;ctx.beginPath();ctx.arc(455,530,10+u*60,0,TAU);ctx.stroke()}ctx.restore();
 // car outside
 car(1090+Math.sin(t*3)*8,598,1.1,'#c0392b',-1,-t*5,Math.sin(t*9)*.006,0);
 if(t>3){ctx.globalAlpha=cl((t-3)/.3);redX(1080,455,38,t);ctx.globalAlpha=1}
 // green arrow
 if(t>5.4){const a=cl((t-5.4)/.3),b=Math.sin(t*6)*10,ux=.76,uy=-.65,tx=700+ux*b,ty=330+uy*b;ctx.save();ctx.globalAlpha=a;ctx.shadowColor='#2cff7a';ctx.shadowBlur=26;ctx.strokeStyle=ctx.fillStyle='#2cff7a';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(500+ux*b,500+uy*b);ctx.lineTo(tx-ux*30,ty-uy*30);ctx.stroke();const bx=tx-ux*44,by=ty-uy*44;ctx.beginPath();ctx.moveTo(bx-uy*30,by+ux*30);ctx.lineTo(tx+ux*10,ty+uy*10);ctx.lineTo(bx+uy*30,by-ux*30);ctx.fill();ctx.restore()}
}

function scene2(t){
 // LEFT panel
 ctx.save();ctx.beginPath();ctx.rect(0,0,636,H);ctx.clip();
 peak(160,230,520,560,'#6f9560',K);peak(480,300,480,560,'#5f8a40',K);
 ctx.fillStyle=sh('#6b4f32',1,K);ctx.fillRect(0,560,636,160);grass(0,636,560,5);
 const env=cl((t-8.6)/.4)*cl((12.6-t)/.6);
 [[90,0],[230,1],[380,2],[540,3]].forEach(([x,i])=>{let a=.015*Math.sin(t*35+i)*env;if(i===1)a+=.32*sm(cl((t-10.2)/1.2));ctx.save();ctx.translate(x,560);ctx.rotate(a);tree(0,0,2.6,K);ctx.restore()});
 if(env>0&&Math.sin(t*14)>0){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(222,545);ctx.lineTo(234,530);ctx.lineTo(224,515);ctx.lineTo(236,500);ctx.stroke()}

 tree(1010,425,1.3,K);tree(1120,375,1.3,K);tree(1210,330,1.3,K);
 ctx.fillStyle=sh('#6b4f32',1,K);ctx.fillRect(644,540,636,180);grass(644,1280,640,2);
 const m=cl((t-9.6)/2.2),sc=mx([95,150,180],[122,86,52],m);ctx.fillStyle=rg(sc,.97);ctx.beginPath();ctx.moveTo(644,548);for(let x=644;x<=1280;x+=20)ctx.lineTo(x,548+4*Math.sin(x*.03+t*3));ctx.lineTo(1280,640);ctx.lineTo(644,640);ctx.fill();
 ctx.strokeStyle=m>.5?'rgba(180,140,100,.6)':'rgba(235,245,250,.7)';ctx.lineWidth=3;ctx.setLineDash([14,22]);ctx.lineDashOffset=-t*110;for(const y of[570,600,625]){ctx.beginPath();ctx.moveTo(644,y);ctx.lineTo(1280,y);ctx.stroke()}ctx.setLineDash([]);
 // person + suitcase

 else{const f=cl((t-11.4)/.25);suitcase(906,540-34*(1-f)*(1-f),1);if(t>11.5){ctx.globalAlpha=cl((t-11.5)/.2);redX(930,470,26,t);ctx.globalAlpha=1}}
 person(px,py,1.3,t*18,t>11.8&&rn<1?1:0,1);

 ctx.fillStyle='rgba(244,234,210,.85)';ctx.fillRect(636,0,8,H);
}

function scene3(t){
 peak(500,250,800,570,'#6a8f5c',K);peak(1100,200,700,570,'#7a8a78',K);
 ctx.fillStyle=sh('#6b4f32',1,K);ctx.fillRect(0,540,W,180);grass(0,W,630,7);

 ctx.fillStyle=sh('#555c64',1,K);ctx.fillRect(0,568,W,62);ctx.strokeStyle='rgba(240,230,190,.7)';ctx.lineWidth=3;ctx.setLineDash([24,18]);ctx.beginPath();ctx.moveTo(0,600);ctx.lineTo(W,600);ctx.stroke();ctx.setLineDash([]);

 tri([860,568],[900,568],[882,590],'#6a7078');tri([1090,568],[1130,568],[1110,592],'#6a7078');tri([930,575],[960,572],[948,596],'#4a5058');

 // car
 const u=cl((t-15)/2.2),e=1-Math.pow(1-u,2.4),cx=lp(-220,640,e),brk=t>16.1;

 if(t>16.1)for(let i=0;i<5;i++){const q=cl((t-16.1-i*.1)/1.2);if(q>0&&q<1){ctx.fillStyle=`rgba(210,215,220,${.5*(1-q)})`;ctx.beginPath();ctx.arc(cx-80-q*50+i*8,565-q*50,12+q*28,0,TAU);ctx.fill()}}
}

function lab(t,[a,b,ti,x,y,ax,ay]){
 const al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)return;ctx.font='600 24px system-ui,sans-serif';ctx.textAlign='left';
 const s=(showHindi?TX_HI:TX_EN)[ti],w=ctx.measureText(s).width+84,xx=x-24*(1-al);
 ctx.save();ctx.globalAlpha=al;ctx.strokeStyle='rgba(255,70,80,.85)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(xx+w/2,y+46);ctx.lineTo(ax,ay);ctx.stroke();ctx.fillStyle='#ff2a38';ctx.beginPath();ctx.arc(ax,ay,6,0,TAU);ctx.fill();
 ctx.fillStyle='rgba(8,14,24,.78)';rr(xx,y,w,46,12);ctx.fill();ctx.strokeStyle='#ff2a38';ctx.lineWidth=2;ctx.stroke();
 tri([xx+14,y+36],[xx+31,y+8],[xx+48,y+36],'#ff2a38');ctx.fillStyle='#fff';ctx.font='800 20px system-ui,sans-serif';ctx.fillText('!',xx+27,y+33);
 ctx.font='600 24px system-ui,sans-serif';ctx.fillStyle='#f4ead2';ctx.fillText(s,xx+60,y+31);ctx.restore()}

const bo=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375};

function frame(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);sky(t);
 if(t<8)scene1(t);else if(t<15)scene2(t);else scene3(t);
 ctx.fillStyle=`rgba(10,18,28,${.2*K})`;ctx.fillRect(0,0,W,H);
 for(const f of[2.4,6.3,12.6])if(t>f&&t<f+.5){ctx.fillStyle=`rgba(225,236,255,${.4*Math.pow(Math.max(0,Math.sin((t-f)/.5*TAU)),2)})`;ctx.fillRect(0,0,W,H)}
 // rain
 const ri=(t<8?.85:t<15?.6:.5)*(1-cl((t-17)/.7));
 if(ri>0){ctx.strokeStyle='rgba(200,220,235,.45)';ctx.lineWidth=1.3;ctx.beginPath();for(let i=0;i<380;i++){if(hs(i)>ri)continue;const y=mod(hs(i+3)*900+t*(850+hs(i+4)*400),820)-50,x=mod(hs(i+1)*1500,1500)-100+y*.18,len=14+hs(i+5)*14;ctx.moveTo(x-len*.18,y-len);ctx.lineTo(x,y)}ctx.stroke()}
 for(const b of[8,15]){const a=cl(1-Math.abs(t-b)/.3);if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H)}}
 for(const l of LB)lab(t,l);
 // outro
 if(t>17.6){
  const a=sm(cl((t-17.7)/.7));
  if(t<18.5){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.filter=`blur(${Math.round(a*14*dpr)}px)`;ctx.drawImage(cv,0,0);ctx.restore()}
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#bfe6ff');bg.addColorStop(1,'#eaf7ff');ctx.globalAlpha=a;ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  if(t>18){const s=bo(cl((t-18)/.6))*(1+.03*Math.sin(t*5));ctx.save();ctx.translate(640,250);ctx.scale(s,s);
   fan([[0,-120],[95,-80],[95,10],[60,80],[0,125],[-60,80],[-95,10],[-95,-80]],[0,-10],'#2f9e5a',1,0);
   ctx.strokeStyle='#fff';ctx.lineWidth=22;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(-42,-5);ctx.lineTo(-10,32);ctx.lineTo(48,-38);ctx.stroke();ctx.restore();
   ctx.globalAlpha=cl((t-18.3)/.4);ctx.font='700 46px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#14181e';ctx.fillText(showHindi?'सावधान रहें। सुरक्षित रहें।':'Stay Alert. Stay Safe.',640,490);ctx.globalAlpha=1}
 }
 // captions
 const V=showHindi?VH:VE;
 for(let i=0;i<3;i++){const[a,b]=CT[i],al=Math.min(cl((t-a)/.3),cl((b-t)/.3));if(al<=0)continue;const s=V[i];let L=[s];if(s.length>45){let m=s.length>>1,j=s.lastIndexOf(' ',m);if(j<0)j=s.indexOf(' ');L=[s.slice(0,j),s.slice(j+1)]}
  ctx.font='600 24px system-ui,sans-serif';ctx.textAlign='center';const w=Math.max(...L.map(l=>ctx.measureText(l).width))+56,h=L.length*34+18,y=704-h;ctx.globalAlpha=al;ctx.fillStyle='rgba(8,14,24,.7)';rr(640-w/2,y,w,h,22);ctx.fill();ctx.fillStyle='#f4ead2';L.forEach((l,n)=>ctx.fillText(l,640,y+36+n*34));ctx.globalAlpha=1}
 const fd=Math.max(1-t/.35,1-(D-t)/.35,0);if(fd>0){ctx.fillStyle=`rgba(0,0,0,${cl(fd)})`;ctx.fillRect(0,0,W,H)}
}

// ---- Audio: synthesized SFX + browser speech voiceover ----
let ac,nb,rumG,rainG,watG,voices=[];
if(window.speechSynthesis){const lv=()=>voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=lv;lv()}
function initAudio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=(type,f)=>{const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start();return g};
 rumG=ns('lowpass',110);rainG=ns('highpass',3500);watG=ns('bandpass',1200)}catch(e){ac=null}}
function tone(f,d,v,type,delay=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d+.05)}
function burst(f,d,v,type,delay=0){if(!ac)return;const s=ac.createBufferSource();s.buffer=nb;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain(),n=ac.currentTime+delay;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(n);s.stop(n+d+.05)}
function screech(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(1500,n);o.frequency.exponentialRampToValueAtTime(520,n+.8);g.gain.setValueAtTime(.07,n);g.gain.exponentialRampToValueAtTime(.0001,n+.85);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.9);burst(2500,.8,.15,'bandpass')}
function speak(i){if(!window.speechSynthesis)return;speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance((showHindi?VH:VE)[i]);u.lang=showHindi?'hi-IN':'en-US';u.rate=RT[i];u.pitch=1;const tl=showHindi?'hi':'en';let v=voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService&&(v.name.includes('Google')||v.name.includes('Neural')))||voices.find(v=>v.lang.toLowerCase().includes(tl)&&v.localService)||voices.find(v=>v.lang.toLowerCase().includes(tl));if(v)u.voice=v;speechSynthesis.speak(u)},40)}
const EV=[[.3,'v',0],[8.2,'v',1],[15.2,'v',2],[.9,'k'],[5.5,'c'],[8.8,'s'],[9.6,'s'],[10.4,'s'],[9.0,'r'],[9.8,'r'],[10.6,'r'],[16.0,'t'],[17.9,'c']];
for(let x=11.8;x<14.4;x+=.22)EV.push([x,'f']);
function fire(e){const k=e[1];if(k==='v')speak(e[2]);else if(k==='k'){burst(3000,.08,.3,'highpass');burst(2000,.05,.2,'bandpass',.12)}else if(k==='c'){tone(880,1.2,.18,'sine');tone(1320,1.4,.12,'sine',.12)}else if(k==='s'){burst(1800,.07,.4,'bandpass');burst(900,.05,.3,'bandpass',.09)}else if(k==='r'){burst(120,.5,.8,'lowpass');tone(60,.5,.3,'sine')}else if(k==='t')screech();else if(k==='f')burst(300,.08,.3,'lowpass')}
function audioTick(t){if(!ac||!rumG)return;let rv=t>8.8&&t<11.4?.9:0;for(const f of[2.5,6.4,12.7])if(t>f&&t<f+1.6)rv+=1.2*(1-(t-f)/1.6);
 const rn=t<17.5?.05*cl(t/1)*(1-cl((t-16.8)/.7)):0,wt=t>9&&t<15?.04:0;
 rumG.gain.setTargetAtTime(rv,ac.currentTime,.1);rainG.gain.setTargetAtTime(rn,ac.currentTime,.1);watG.gain.setTargetAtTime(wt,ac.currentTime,.2)}

let t=0,pt=0,playing=false,last=performance.now();
const pp=document.getElementById('pp'),sk=document.getElementById('sk'),tm=document.getElementById('tm'),btnL=document.getElementById('lang'),overlay=document.getElementById('start-overlay');
const stopSpeech=()=>{if(window.speechSynthesis)speechSynthesis.cancel()};
document.getElementById('start-btn').onclick=()=>{overlay.style.display='none';initAudio();if(window.speechSynthesis){const d=new SpeechSynthesisUtterance('');d.volume=0;speechSynthesis.speak(d)}playing=true;last=performance.now();pp.disabled=sk.disabled=false;pp.textContent='Pause'};
function loop(n){const dt=Math.min((n-last)/1000,.1);last=n;
 if(playing){t+=dt;if(t>=D){t=0;pt=-.01;stopSpeech()}sk.value=t;for(const e of EV)if(pt<e[0]&&e[0]<=t)fire(e)}
 pt=t;audioTick(t);frame(t);tm.textContent=t.toFixed(1)+'s';requestAnimationFrame(loop)}
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'Pause':'Play';last=performance.now();if(playing){if(ac)ac.resume()}else{stopSpeech();if(ac)ac.suspend()}};
sk.oninput=()=>{playing=false;pp.textContent='Play';t=+sk.value;pt=t;stopSpeech();if(ac)ac.suspend()};
btnL.onclick=()=>{showHindi=!showHindi;btnL.textContent='Hindi Subtitles: '+(showHindi?'On':'Off');stopSpeech()};
requestAnimationFrame(loop);
</script>
