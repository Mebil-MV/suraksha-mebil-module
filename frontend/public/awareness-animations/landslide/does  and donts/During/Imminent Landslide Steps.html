<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Imminent Landslide Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f1ea;
    --fg: #2a2f38;
    --btn-bg: #f4ead2;
    --btn-fg: #14181e;
  }

  @media(prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181e;
      --fg: #e8e4d8;
      color-scheme: dark
    }
  }

  :root[data-theme="dark"] {
    --bg: #14181e;
    --fg: #e8e4d8;
    color-scheme: dark
  }

  html,
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, sans-serif
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    position: relative
  }

  .stage {
    position: relative;
    width: 100%;
    max-width: 1280px
  }

  canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
    border-radius: 10px;
    background: #000;
    display: block
  }

  .bar {
    display: flex;
    gap: 12px;
    align-items: center;
    width: 100%;
    max-width: 1280px;
    margin-top: 10px;
    flex-wrap: wrap
  }

  .bar input {
    flex: 1;
    min-width: 120px
  }

  button {
    font: inherit;
    padding: 6px 16px;
    border-radius: 8px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    cursor: pointer
  }

  button:focus-visible,
  input:focus-visible {
    outline: 3px solid #ff2a38;
    outline-offset: 2px
  }

  button:disabled {
    opacity: .5;
    cursor: default
  }

  #start-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .65);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10
  }

  #start-overlay button {
    background: var(--btn-bg);
    color: var(--btn-fg);
    border: none;
    padding: 16px 32px;
    font-size: 22px;
    font-weight: 600;
    border-radius: 50px;
    transition: transform .2s
  }

  #start-overlay button:hover {
    transform: scale(1.05)
  }

  @media(max-width:520px) {
    #start-overlay button {
      padding: 12px 20px;
      font-size: 16px
    }
  }
</style>

<div class="stage">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="start-overlay"><button id="start-btn">▶ Play Animation &amp; Audio</button></div>
</div>
<div class="bar">
  <button id="pp" disabled>Play</button>
  <input id="sk" type="range" min="0" max="19.5" step="0.01" value="0" disabled aria-label="Timeline">
  <span id="tm">0.0s</span>
  <button id="lang">Hindi Subtitles: Off</button>
</div>

<script>
  const W = 1280, H = 720, D = 19.5, TAU = Math.PI * 2, cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, lp = (a, b, k) => a + (b - a) * k, sm = k => k * k * (3 - 2 * k), mod = (a, n) => ((a % n) + n) % n;

  const gy = x => 550 + 14 * Math.sin(x * .007);
  const faceY = x => 320 + (x - 480) / 210 * 300;

  // ---------- Script ----------
  const VE = ['A landslide is about to happen. Act immediately!', 'First, contact your local fire, police or public works department.', 'Second, inform your affected neighbors.', 'Third, leave the area quickly.', 'Stay alert. Stay safe.'];
  const VH = ['लैंडस्लाइड होने वाला है। तुरंत कदम उठाएँ!', 'पहले, अपने स्थानीय फायर, पुलिस या लोक निर्माण विभाग से संपर्क करें।', 'दूसरा, प्रभावित पड़ोसियों को सूचित करें।', 'तीसरा, क्षेत्र को जल्दी से छोड़ दें।', 'सावधान रहें। सुरक्षित रहें।'];
  const CT = [[.3, 3.9], [4.2, 9.0], [9.2, 12.9], [13.1, 16.1], [16.6, 19.2]];
  const STE = ['Contact fire, police or public works', 'Inform affected neighbors', 'Leave the area quickly'];
  const STH = ['फायर, पुलिस या लोक निर्माण विभाग से संपर्क करें', 'प्रभावित पड़ोसियों को सूचित करें', 'क्षेत्र को जल्दी से छोड़ दें'];
  const ST = [[4.6, 9.0], [9.4, 13.0], [13.2, 16.1]];
  let showHindi = false;

  // ---------- Scenery ----------
  function peak(cx, top, w, base, c, k) {
    const T = [cx, top], L = [cx - w / 2, base], R = [cx + w / 2, base], M = [cx + w * .05, top + (base - top) * .5], B = [cx - w * .12, base], N = [cx - w * .14, top + (base - top) * .42];

  }
  function tree(x, y, s, k) { ctx.fillStyle = sh('#5b4130', 1, k); ctx.fillRect(x - 3 * s, y - 22 * s, 6 * s, 22 * s); for (let j = 0; j < 3; j++) { const b = y - 12 * s - j * 18 * s, w = (36 - j * 8) * s; tri([x - w / 2, b], [x, b - 30 * s], [x + w / 2, b], sh('#3f8a4a', .8 + j * .18, k)) } }
  function cloud(x, y, r, k) { for (let j = 0; j < 4; j++) { const cx = x + j * r * .9, cy = y + (j % 2 ? -r * .3 : 0), rad = r * (1 - .1 * j); ctx.fillStyle = rg(mx([245, 248, 250], [44, 52, 62], k), .92); ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * .7) } ctx.fill() } }
  function rock(x, y, r, rot, c, k, seed) {
    const P = []; for (let i = 0; i < 6; i++) { const a = rot + i / 6 * TAU, rad = r * (.75 + .35 * hs(seed + i)); P.push([x + Math.cos(a) * rad, y + Math.sin(a) * rad]) }
    for (let i = 0; i < 6; i++)tri([x, y], P[i], P[(i + 1) % 6], sh(c, .65 + .5 * hs(seed * 3 + i), k))
  }

  const HOUSES = [
    { x: 975, w: 150, h: 92, c: '#e8c9a0', r: '#b5533c', ap: 8.7 },
    { x: 1220, w: 130, h: 86, c: '#cfe0c3', r: '#8c4a3a', ap: 10.05 },
    { x: 1480, w: 140, h: 90, c: '#d9d2ea', r: '#a2483f', ap: 11.55 },
    { x: 1740, w: 130, h: 86, c: '#f0d8c0', r: '#7d4a5a', ap: 13.0 }
  ];
  function house(o, t, k) {
    const { x, w, h, c, r, ap } = o, y = gy(x), lit = t >= ap, L = x - w / 2, R = x + w / 2;
    ctx.fillStyle = sh('#6b4f32', .9, k); ctx.fillRect(L - 4, y - 2, w + 8, 18);
    tri([L, y], [R, y], [R, y - h], sh(c, 1, k)); tri([L, y], [R, y - h], [L, y - h], sh(c, .86, k));
    tri([x, y - h - w * .36], [L - 12, y - h], [x, y - h], sh(r, 1.1, k)); tri([x, y - h - w * .36], [x, y - h], [R + 12, y - h], sh(r, .78, k));
    ctx.fillStyle = lit ? '#ffd966' : sh('#7fa6c0', .9, k); ctx.fillRect(L + 16, y - h + 26, 26, 24); ctx.fillRect(R - 42, y - h + 26, 26, 24);
    ctx.strokeStyle = sh('#4a3a2a', 1, k); ctx.lineWidth = 2.5; ctx.strokeRect(L + 16, y - h + 26, 26, 24); ctx.strokeRect(R - 42, y - h + 26, 26, 24);
    ctx.fillStyle = lit ? '#f7c870' : sh('#5b4130', 1, k); ctx.fillRect(x - 12, y - 46, 24, 46);
    if (lit) { const g = ctx.createRadialGradient(x, y - 20, 4, x, y - 20, 90); g.addColorStop(0, 'rgba(255,210,110,.28)'); g.addColorStop(1, 'rgba(255,210,110,0)'); ctx.fillStyle = g; ctx.fillRect(x - 90, y - 110, 180, 130) }
  }

  const CRACKS = [[[470, 352], [490, 360], [505, 356], [528, 372], [545, 368], [566, 384]], [[455, 372], [472, 384], [488, 382], [510, 400]], [[520, 395], [540, 410], [556, 408], [580, 430], [596, 448]]];
  function cracks(t, k) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    CRACKS.forEach((P, ci) => {
      const f = cl((t - 1 - ci * .4) / 2); if (f <= 0) return; const n = (P.length - 1) * f, full = Math.floor(n);
      ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); for (let i = 1; i <= full; i++)ctx.lineTo(P[i][0], P[i][1]);
      if (full < P.length - 1) { const a = P[full], b = P[full + 1], u = n - full; ctx.lineTo(lp(a[0], b[0], u), lp(a[1], b[1], u)) }
      ctx.strokeStyle = sh('#1e140c', 1, k); ctx.lineWidth = 4 + 2 * cl((t - 3) / 5); ctx.stroke()
    });

  }
  function pebbles(t, k) {
    const I = cl((t - 1.2) / 2.2) * .35 + cl((t - 10) / 1.2) * .65, N = 34;
    for (let i = 0; i < N; i++) {
      if (hs(i + 50) > I) continue; const sp = .45 + .5 * hs(i + 1), p = mod(t * sp + hs(i + 2) * 4, 1.7); if (p > 1) continue;
      const sx = 500 + hs(i) * 120, ex = sx + 30 + hs(i + 3) * 90, x = lp(sx, ex, p), y = lp(faceY(sx), gy(ex) - 4, p * p) - Math.abs(Math.sin(p * TAU * 2.5)) * 12 * p, s = 3 + hs(i + 4) * 6;
      tri([x - s, y + s * .6], [x, y - s], [x + s, y + s * .6], sh(i % 2 ? '#7a5a38' : '#8f8b84', .9, k))
    }
  }
  const FRONT = t => 560 + 70 * Math.pow(Math.max(0, t - 10.4), 1.4);
  function slideH(x, xf, g, t) { const d = xf - x; return d < 0 ? 0 : Math.pow(cl(d / 180), .7) * (55 + 45 * hs((x / 36) | 0)) * g * (.92 + .08 * Math.sin(t * 6 + x)) }
  function slideFx(t, k) {
    if (t < 10.4) return; const g = cl((t - 10.4) / 1.5), xf = FRONT(t), xs = 470, pts = [];
    for (let x = xs; x <= xf + 40; x += 36)pts.push([x, gy(x) - slideH(x, xf, g, t), gy(x) + 24]);
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], c1 = i % 3 ? '#6b4a2b' : '#5a3d24'; tri([a[0], a[1]], [b[0], b[1]], [a[0], a[2]], sh(c1, .8 + .4 * hs(i), k)); tri([b[0], b[1]], [b[0], b[2]], [a[0], a[2]], sh('#4e3620', .8 + .4 * hs(i + 40), k)) }
    for (let i = 0; i < 7; i++) { const x = xf - 30 - i * 48; if (x < xs) continue; rock(x, gy(x) - slideH(x, xf, g, t) - 4, 13 + hs(i) * 12, t * 2 + i, i % 2 ? '#8f8b84' : '#6f6a62', k, i * 11 + 3) }
    for (let i = 0; i < 5; i++) { const rx = xf + 20 + i * 30, ry = gy(rx) - 8 - Math.abs(Math.sin(t * 5 + i * 2)) * 14; rock(rx, ry, 5 + hs(i + 9) * 4, t * 6 + i, '#8f8b84', k, i * 5 + 70) }
    ctx.fillStyle = 'rgba(200,175,140,.2)'; for (let j = 0; j < 8; j++) { ctx.beginPath(); ctx.ellipse(xf - j * 55 + Math.sin(t * 2 + j) * 10, gy(xf) - 100 - j * 6, 62, 38, 0, 0, TAU); ctx.fill() }
  }

  function world(t, k) {
    peak(700, 200, 760, 620, '#8aa6bd', k); peak(1500, 190, 860, 620, '#8aa6bd', k); peak(2700, 210, 900, 620, '#8aa6bd', k);
    peak(220, 260, 560, 620, '#6f9560', k); peak(1250, 240, 620, 620, '#6a8f5c', k); peak(1950, 250, 1000, 620, '#6b8a5e', k); peak(3150, 250, 800, 620, '#6a8f5c', k);
    peak(480, 320, 420, 620, '#5f8a40', k); peak(980, 140, 360, 620, '#7a8a78', k);
    ctx.fillStyle = sh('#6b4f32', 1, k); ctx.beginPath(); ctx.moveTo(-200, 1300); for (let x = -200; x <= 3600; x += 50)ctx.lineTo(x, gy(x)); ctx.lineTo(3600, 1300); ctx.fill();
    for (let x = -200; x < 3600; x += 100) { const g0 = gy(x), g1 = gy(x + 100), m = [x + 50 + (hs(x) - .5) * 30, Math.max(g0, g1) + 80 + hs(x + 3) * 30]; tri([x, g0], [x + 100, g1], m, sh('#5f8a40', .8 + .4 * hs(x), k)); tri([x, g0], m, [x - 20, g0 + 120], sh('#4a7a3a', .7 + .3 * hs(x + 1), k)); tri([x + 100, g1], m, [x + 120, g1 + 120], sh('#55803c', .6 + .3 * hs(x + 2), k)) }
    ctx.globalAlpha = cl((t - 2.4) / 1.6); fan([[455, 345], [510, 350], [565, 470], [600, 506], [430, 506], [435, 430]], [500, 430], '#8b6a45', 1, k); ctx.globalAlpha = 1;
    cracks(t, k);
    for (let i = 0; i < 9; i++) { const x = 450 + hs(i) * 170, y = gy(x) - 4, s = 6 + hs(i + 3) * 8; tri([x - s, y], [x - s * .3, y - s * 1.2], [x + s, y], sh(i % 2 ? '#7a5a38' : '#8f8b84', .9, k)) }
    pebbles(t, k);
    // road
    ctx.fillStyle = sh('#555c64', 1, k); ctx.beginPath(); ctx.moveTo(740, gy(740) + 3); for (let x = 740; x <= 3500; x += 50)ctx.lineTo(x, gy(x) + 3); for (let x = 3500; x >= 740; x -= 50)ctx.lineTo(x, gy(x) + 23); ctx.fill();
    ctx.strokeStyle = 'rgba(240,230,190,.7)'; ctx.lineWidth = 2; ctx.setLineDash([18, 14]); ctx.beginPath(); for (let x = 740; x <= 3500; x += 50) { const y = gy(x) + 13; x === 740 ? ctx.moveTo(x, y) : ctx.lineTo(x, y) } ctx.stroke(); ctx.setLineDash([]);
    // trees (one near the slope leans as the ground loosens)
    for (const x of [60, 140, 330, 720, 1080, 1340, 1600, 1860, 2050, 2200, 2650, 2850, 3050]) tree(x, gy(x), 1.3, k);
    ctx.save(); ctx.translate(640, gy(640)); ctx.rotate(.4 * sm(cl((t - 3) / 6))); tree(0, 0, 1.3, k); ctx.restore();
    for (const o of HOUSES) house(o, t, k);
    safeZone(t, k);
    slideFx(t, k)
  }
  function safeZone(t, k) {
    const x = 2400, y = gy(x);
    for (const [dx, s] of [[-60, 1], [60, .85]]) { tri([x + dx - 42 * s, y + 6], [x + dx, y - 54 * s], [x + dx + 42 * s, y + 6], sh('#e9edf0', .95, k)); tri([x + dx, y - 54 * s], [x + dx, y + 6], [x + dx + 42 * s, y + 6], sh('#c9d3da', .9, k)) }
    ctx.fillStyle = sh('#4a3a2a', 1, k); ctx.fillRect(x - 3, y - 120, 6, 126); const wv = Math.sin(t * 4) * 5;
    tri([x + 3, y - 120], [x + 60, y - 106 + wv], [x + 3, y - 90], sh('#2f9e5a', 1.05, k));
    ctx.fillStyle = sh('#2f9e5a', 1, k); rr(x - 110, y - 90, 82, 28, 6); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '700 15px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText(showHindi ? 'सुरक्षित स्थान' : 'SAFE ZONE', x - 69, y - 71);
    ctx.fillStyle = sh('#4a3a2a', 1, k); ctx.fillRect(x - 71, y - 62, 4, 66)
  }

  // ---------- People ----------
  function person(x, y, s, shirt, ph, mode, dir, k, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(dir * s, s); ctx.lineCap = 'round';
    const pant = sh('#2b3a55', 1, k), sk = sh('#e0b08a', 1, k), run = mode === 'run', a = run ? Math.sin(ph) * .9 : 0;
    ctx.strokeStyle = pant; ctx.lineWidth = 6;
    for (const sg of [-1, 1]) { const an = a * sg, fx = Math.sin(an) * 26, fy = -28 + Math.cos(an) * 26 - (run && sg * Math.sin(ph) < 0 ? 5 : 0); ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(fx, fy); ctx.stroke() }
    tri([-8, -52], [8, -52], [6, -28], sh(shirt, 1, k)); tri([-8, -52], [6, -28], [-6, -28], sh(shirt, .82, k));
    ctx.strokeStyle = sh(shirt, .9, k); ctx.lineWidth = 5; let hand;
    if (mode === 'phone') hand = [5, -64]; else if (mode === 'wave') { const an = 2.6 + Math.sin(t * 10) * .4; hand = [Math.sin(an) * 22, -50 + Math.cos(an) * 22] } else if (mode === 'knock') hand = [20, -46 + Math.sin(ph) * 5]; else { const an = -a * 1.0; hand = [Math.sin(an) * 22 + (run ? 6 : 0), -50 + Math.cos(an) * 22 * (run ? .8 : 1)] }
    ctx.beginPath(); ctx.moveTo(0, -49); ctx.lineTo(hand[0], hand[1]); ctx.stroke();
    ctx.fillStyle = sk; ctx.beginPath(); ctx.arc(hand[0], hand[1], 3.2, 0, TAU); ctx.fill();
    if (mode === 'phone') { ctx.fillStyle = '#222'; ctx.fillRect(5, -72, 5, 11) }
    ctx.fillStyle = sk; ctx.beginPath(); ctx.arc(0, -62, 8, 0, TAU); ctx.fill();
    tri([-8.5, -63], [0, -74], [8.5, -63], sh('#3a2a20', 1, k));
    ctx.restore()
  }
  function warnIcon(x, y, a) { ctx.save(); ctx.globalAlpha = a; tri([x - 14, y + 12], [x, y - 14], [x + 14, y + 12], '#ff2a38'); ctx.fillStyle = '#fff'; ctx.font = '800 17px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', x, y + 9); ctx.restore() }

  const HK = [[0, 880], [9, 880], [9.9, 1150], [10.7, 1150], [11.4, 1410], [12.2, 1410], [12.9, 1670], [13.3, 1670]];
  const runX = (x0, d) => x0 + 250 * (d < .4 ? d * d / .8 : d - .2);
  function heroX(t) {
    if (t >= 13.3) return runX(1670, t - 13.3);
    for (let i = 0; i < HK.length - 1; i++) { const a = HK[i], b = HK[i + 1]; if (t >= a[0] && t < b[0]) return lp(a[1], b[1], sm((t - a[0]) / (b[0] - a[0]))) } return 880
  }
  const AC = [
    { x: 995, c: '#8e5bd1', s: 1.3, ap: 8.7, lv: 13.0 }, { x: 1020, c: '#f2c230', s: .9, ap: 8.7, lv: 13.08 },
    { x: 1220, c: '#2d9cdb', s: 1.3, ap: 10.05, lv: 13.15 },
    { x: 1480, c: '#2f9e5a', s: 1.3, ap: 11.55, lv: 13.25 }, { x: 1505, c: '#e67e22', s: .9, ap: 11.6, lv: 13.33 },
    { x: 1740, c: '#16a085', s: 1.3, ap: 13.0, lv: 13.35 }
  ];
  const SHOUT = [[9.9, 10.7], [11.4, 12.2], [12.9, 13.4]];
  function actors(t, k) {
    const gyo = x => gy(x) + 12;
    AC.forEach((a, i) => {
