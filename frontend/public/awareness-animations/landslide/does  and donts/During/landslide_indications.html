<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="utf-8">
       <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
       <title>Landslide Warning Signs</title>
       <style>
              :root {
                     --bg: #f4f1ea;
                     --fg: #2a2f38;
                     box-sizing: border-box;
                     padding-top: env(safe-area-inset-top, 0px);
                     padding-bottom: env(safe-area-inset-bottom, 0px)
              }

              @media(prefers-color-scheme:dark) {
                     :root:not([data-theme="light"]) {
                            --bg: #14181e;
                            --fg: #e8e4d8
                     }
              }

              :root[data-theme="dark"] {
                     --bg: #14181e;
                     --fg: #e8e4d8
              }

              html,
              body {
                     margin: 0;
                     background: var(--bg);
                     color: var(--fg);
                     font-family: system-ui, sans-serif
              }

              body {
                     display: flex;
                     flex-direction: column;
                     align-items: center;
                     padding: 12px;
                     position: relative
              }

              canvas {
                     width: 100%;
                     max-width: 1280px;
                     height: auto;
                     aspect-ratio: 16/9;
                     border-radius: 10px;
                     background: #000;
                     display: block
              }

              .bar {
                     display: flex;
                     gap: 12px;
                     align-items: center;
                     width: 100%;
                     max-width: 1280px;
                     margin-top: 10px;
                     flex-wrap: wrap
              }

              .bar input {
                     flex: 1;
                     min-width: 120px
              }

              button {
                     font: inherit;
                     padding: 6px 16px;
                     border-radius: 8px;
                     border: 1px solid currentColor;
                     background: transparent;
                     color: inherit;
                     cursor: pointer
              }

              button:disabled {
                     opacity: .5;
                     cursor: default
              }

              #start-overlay {
                     position: absolute;
                     top: 12px;
                     left: 12px;
                     right: 12px;
                     max-width: 1280px;
                     aspect-ratio: 16/9;
                     margin: 0 auto;
                     background: rgba(0, 0, 0, .65);
                     border-radius: 10px;
                     display: flex;
                     justify-content: center;
                     align-items: center;
                     z-index: 10
              }

              #start-overlay button {
                     background: #f4ead2;
                     color: #14181e;
                     border: none;
                     padding: 16px 32px;
                     font-size: 22px;
                     font-weight: 600;
                     border-radius: 50px;
                     transition: transform .2s
              }

              #start-overlay button:hover {
                     transform: scale(1.05)
              }
       </style>
</head>

<body>
       <canvas id="c" width="1280" height="720"></canvas>
       <div id="start-overlay"><button id="start-btn">▶ Play Animation & Audio</button></div>
       <div class="bar">
              <button id="pp" disabled>Play</button>
              <input id="sk" type="range" min="0" max="22" step="0.01" value="0" disabled>
              <span id="tm">0.0s</span>
              <button id="lang">Hindi Subtitles: Off</button>
       </div>
       <script>
              const W = 1280, H = 720, D = 22, TAU = Math.PI * 2, cv = document.getElementById('c'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
              cv.width = W * dpr; cv.height = H * dpr;
              const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, lp = (a, b, k) => a + (b - a) * k, sm = k => k * k * (3 - 2 * k), mod = (a, n) => ((a % n) + n) % n;
              function hs(n) { n |= 0; n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296 }
              const hx = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)), mx = (a, b, k) => a.map((v, i) => lp(v, b[i], k)), rg = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
              const sh = (c, f, k) => rg(mx(hx(c), [22, 32, 44], k * .45).map(v => Math.min(255, v * f)));
              const tri = (a, b, c, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.fill() };
              const quad = (a, b, c, d, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill() };
              const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h) };
              const fan = (P, c, col, f, k) => { for (let i = 0; i < P.length; i++) tri(c, P[i], P[(i + 1) % P.length], sh(col, f + (hs(i * 7 + P[0][0]) - .5) * .4, k)) };

              // ---- Script ----
              const VE = [
                     'Know the landslide warning signs. Indoors, watch for sticking doors or windows, new cracks in plaster, tile, brick or foundations, and walls or stairs pulling away from the building.',
                     'Outside, look for slow, widening cracks on the ground or streets. Watch for broken underground utility lines, bulging ground at the base of a slope, and tilting fences, poles or trees.',
                     'Beware of new flowing ground water, or a sudden drop in creek levels even while it rains. Listen for a faint rumbling that grows as the ground shifts.',
                     'Stay alert. Stay safe.'];
              const VH = [
                     'लैंडस्लाइड के चेतावनी संकेत जानें। घर के अंदर दरवाज़े-खिड़कियाँ अटकना, प्लास्टर, टाइल, ईंट या नींव में नई दरारें, और दीवारों या सीढ़ियों का इमारत से अलग होना देखें।',
                     'बाहर ज़मीन या सड़क पर धीरे-धीरे चौड़ी होती दरारें, टूटी भूमिगत लाइनें, ढलान के नीचे उभरी ज़मीन, और झुकती बाड़, खंभे या पेड़ देखें।',
                     'नई जगहों पर पानी के बहाव या बारिश के बावजूद नाले का पानी अचानक घटने से सावधान रहें। ज़मीन खिसकने पर बढ़ती हल्की गड़गड़ाहट सुनें।',
                     'सावधान रहें। सुरक्षित रहें।'];
              const CT = [[.3, 5.9], [6.2, 11.9], [12.2, 16.9], [17.2, 21.5]];

              const TX_EN = ['Sticking doors', 'Cracks in plaster/brick', 'Pulling away of stairs', 'Widening ground cracks', 'Broken utility lines', 'Bulging ground', 'Tilting poles/trees', 'New flowing water', 'Decreased creek levels'];
              const TX_HI = ['अटकते दरवाज़े', 'प्लास्टर/ईंट में दरारें', 'सीढ़ियों का अलग होना', 'ज़मीन की चौड़ी होती दरारें', 'टूटी यूटिलिटी लाइनें', 'उभरी हुई ज़मीन', 'झुकते खंभे/पेड़', 'पानी का नया बहाव', 'नाले का घटता स्तर'];
              // [start, end, slot, textIdx, anchorX, anchorY, scene]  (anchors in world coords)
              const LB = [
                     [1.0, 5.8, 0, 0, 420, 470, 1],
                     [2.4, 5.8, 1, 1, 640, 330, 1],
                     [3.8, 5.8, 2, 2, 905, 560, 1],
                     [6.6, 11.8, 0, 3, 450, 585, 2],
                     [8.0, 11.8, 1, 4, 760, 640, 2],
                     [9.2, 11.8, 2, 5, 1160, 470, 2],
                     [10.4, 11.8, 3, 6, 1500, 450, 2],
                     [12.8, 16.8, 0, 7, 700, 580, 3],
                     [14.4, 16.8, 1, 8, 1320, 560, 3]];

              let showHindi = false;

              // ---- World helpers ----
              function warn(x, y, s, t, a) { // flashing orange/yellow triangle
                     const al = cl((t - a) / .25); if (al <= 0) return;
                     const pl = .5 + .5 * Math.sin(t * 14), u = bo(cl((t - a) / .45)) * s;
                     ctx.save(); ctx.globalAlpha = al; ctx.translate(x, y); ctx.scale(u, u);
                     tri([-24, 20], [0, -28], [24, 20], `rgba(255,${150 + 80 * pl | 0},20,1)`);
                     tri([-16, 15], [0, -17], [16, 15], '#ffd23a');
                     ctx.fillStyle = '#3a2410'; ctx.fillRect(-2.5, -9, 5, 14); ctx.fillRect(-2.5, 8, 5, 5);
                     ctx.restore();
                     ctx.save(); ctx.globalAlpha = al * (.25 + .35 * pl); ctx.strokeStyle = '#ffae1a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 40 * s + 8 * pl, 0, TAU); ctx.stroke(); ctx.restore();
              }
              const bo = u => { const n = 7.5625, d = 2.75; if (u < 1 / d) return n * u * u; if (u < 2 / d) return n * (u -= 1.5 / d) * u + .75; if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + .9375; return n * (u -= 2.625 / d) * u + .984375 };

              function peak(cx, top, w, base, c, k) {
                     const T = [cx, top], L = [cx - w / 2, base], R = [cx + w / 2, base], M = [cx + w * .05, top + (base - top) * .5], B = [cx - w * .12, base], N = [cx - w * .14, top + (base - top) * .42];
                     tri(T, L, N, sh(c, 1.15, k)); tri(T, N, M, sh(c, .95, k)); tri(T, M, R, sh(c, .7, k)); tri(L, N, B, sh(c, .9, k)); tri(N, M, B, sh(c, .8, k)); tri(M, R, B, sh(c, .6, k))
              }
              function tree(x, y, s, k, tilt = 0) {
                     ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.translate(-x, -y);
                     ctx.fillStyle = sh('#5b4130', 1, k); ctx.fillRect(x - 3 * s, y - 22 * s, 6 * s, 22 * s);
                     for (let j = 0; j < 3; j++) { const b = y - 12 * s - j * 18 * s, w = (36 - j * 8) * s; tri([x - w / 2, b], [x, b - 30 * s], [x + w / 2, b], sh('#3f8a4a', .8 + j * .18, k)) }
                     ctx.restore();
              }
              function cloud(x, y, r, k) { for (let j = 0; j < 4; j++) { const cx = x + j * r * .9, cy = y + (j % 2 ? -r * .3 : 0), rad = r * (1 - .1 * j); ctx.fillStyle = rg(mx([245, 248, 250], [44, 52, 62], k), .92); ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * TAU; ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad * .7) } ctx.fill() } }

              // ---- Scene 1: house cross-section ----
              function house(t, k) {
                     // ground slab
                     ctx.fillStyle = sh('#6b4f32', 1, k); ctx.fillRect(-100, 600, 1500, 400);
                     for (let x = -100; x < 1400; x += 100) tri([x, 600], [x + 100, 600], [x + 50 + (hs(x) - .5) * 30, 690 + hs(x + 3) * 30], sh('#5f8a40', .8 + .4 * hs(x), k));
                     // cutaway back wall
                     const hx0 = 280, hx1 = 880, hy0 = 300, hy1 = 600;
                     quad([hx0, hy0], [hx1, hy0], [hx1, hy1], [hx0, hy1], sh('#e3d3b0', .95, k));
                     // inner floor line, shading panels
                     quad([hx0, hy1 - 14], [hx1, hy1 - 14], [hx1, hy1], [hx0, hy1], sh('#8b6a45', 1, k));
                     tri([hx0, hy0], [hx0 + 140, hy0], [hx0, hy0 + 240], sh('#d1bf98', 1, k));
                     // window
                     quad([420, 380], [520, 380], [520, 470], [420, 470], sh('#9cc6dc', 1, k));
                     ctx.strokeStyle = sh('#6b4a2a', 1, k); ctx.lineWidth = 6; ctx.strokeRect(420, 380, 100, 90); ctx.beginPath(); ctx.moveTo(470, 380); ctx.lineTo(470, 470); ctx.moveTo(420, 425); ctx.lineTo(520, 425); ctx.stroke();
                     // roof
                     tri([hx0 - 40, hy0], [(hx0 + hx1) / 2, hy0 - 130], [hx1 + 40, hy0], sh('#b5533c', 1, k));
                     tri([hx0 - 40, hy0], [(hx0 + hx1) / 2, hy0 - 130], [(hx0 + hx1) / 2 - 80, hy0], sh('#c9684c', 1, k));
                     tri([(hx0 + hx1) / 2 + 60, hy0 - 40], [hx1 + 40, hy0], [(hx0 + hx1) / 2, hy0 - 130], sh('#8f3f2d', 1, k));
                     // front wall left slice with door (jamming shake)
                     const jam = cl((t - 1.0) / .3), sx = jam * Math.sin(t * 40) * 3 * (1 - cl((t - 2.2) / .6));
                     ctx.save(); ctx.translate(sx, 0);
                     quad([330, 420], [420 - 0, 420], [420, 600], [330, 600], sh('#6b4a2a', 1, k));
                     quad([336, 426], [414, 426], [414, 600], [336, 600], sh('#9a6b3c', .95, k));
                     tri([336, 426], [414, 426], [336, 600], sh('#b0804a', .9, k));
                     ctx.fillStyle = '#f2c14e'; ctx.beginPath(); ctx.arc(402, 520, 6, 0, TAU); ctx.fill();
                     // jam gap
                     ctx.strokeStyle = 'rgba(20,10,0,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(414, 430); ctx.lineTo(417, 600); ctx.stroke();
                     ctx.restore();
                     // crack in wall (grows)
                     const cg = cl((t - 2.4) / 1.2); ctx.strokeStyle = '#2a1c10'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();
                     const cp = [[640, 310], [625, 350], [655, 385], [630, 425], [662, 465], [640, 510]];
                     ctx.moveTo(cp[0][0], cp[0][1]); for (let i = 1; i < cp.length; i++) { if (i / (cp.length - 1) > cg) break; ctx.lineTo(cp[i][0], cp[i][1]) } ctx.stroke();
                     if (cg > .5) { ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(655, 385); ctx.lineTo(700, 395); ctx.lineTo(720, 420); ctx.stroke() }
                     // brick patch
                     for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) { ctx.fillStyle = sh('#b36a4a', .85 + .3 * hs(r * 9 + c), k); ctx.fillRect(720 + c * 28 + (r % 2) * 10, 340 + r * 16, 26, 14) }
                     // exterior stair pulling away
                     const pull = cl((t - 3.8) / 1.4) * 26;
                     for (let i = 0; i < 5; i++) quad([880 + pull + i * 24, 600 - i * 22], [904 + pull + i * 24, 600 - i * 22], [904 + pull + i * 24, 600], [880 + pull + i * 24, 600], sh('#9a948c', .7 + i * .09, k));
                     ctx.fillStyle = sh('#8a8f98', 1, k); ctx.fillRect(880 + pull + 120, 482, 36, 118);
                     // gap shadow
                     if (pull > 0) { ctx.fillStyle = 'rgba(10,6,0,.85)'; ctx.fillRect(880, 520, pull, 80) }
                     // warning icons
                     warn(372, 390, 1.1, t, 1.0); warn(645, 290, 1.1, t, 2.4); warn(946, 540, 1.1, t, 3.8);
              }

              // ---- Scene 2: street/hill ----
              const gy2 = x => 560 + 10 * Math.sin(x * .006);
              function outdoors(t, k) {
                     const sw = (t - 6.2);
                     // hills
                     peak(760, 250, 720, 600, '#8aa6bd', k); peak(1450, 210, 860, 600, '#8aa6bd', k);
                     peak(1250, 290, 700, 620, '#6a8f5c', k); peak(260, 330, 560, 620, '#6f9560', k);
                     ctx.fillStyle = sh('#6b4f32', 1, k); ctx.beginPath(); ctx.moveTo(-200, 1300); for (let x = -200; x <= 2000; x += 50) ctx.lineTo(x, gy2(x)); ctx.lineTo(2000, 1300); ctx.fill();
                     for (let x = -200; x < 2000; x += 100) { const g0 = gy2(x), g1 = gy2(x + 100), m = [x + 50 + (hs(x) - .5) * 30, Math.max(g0, g1) + 80 + hs(x + 3) * 30]; tri([x, g0], [x + 100, g1], m, sh('#5f8a40', .8 + .4 * hs(x), k)); tri([x, g0], m, [x - 20, g0 + 120], sh('#4a7a3a', .7 + .3 * hs(x + 1), k)) }
                     // paved street
                     ctx.fillStyle = sh('#555c64', 1, k); ctx.fillRect(-200, 575, 1000, 70);
                     ctx.strokeStyle = 'rgba(240,230,190,.7)'; ctx.lineWidth = 3; ctx.setLineDash([22, 16]); ctx.beginPath(); ctx.moveTo(-200, 610); ctx.lineTo(800, 610); ctx.stroke(); ctx.setLineDash([]);
                     // widening crack
                     const cw = 3 + 14 * cl((t - 6.6) / 3); ctx.fillStyle = '#0d0905';
                     ctx.beginPath(); ctx.moveTo(400, 575); ctx.lineTo(400 + cw, 590); ctx.lineTo(380 + cw * .6, 612); ctx.lineTo(420 + cw, 635); ctx.lineTo(410, 645); ctx.lineTo(395 - cw * .2, 630); ctx.lineTo(375, 610); ctx.lineTo(392 - cw * .3, 590); ctx.closePath(); ctx.fill();
                     // underground pipe + snap
                     ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(500, 680, 600, 40);
                     const sn = cl((t - 8.2) / .3), off = sn * 10;
                     ctx.fillStyle = sh('#7c8791', 1, k); ctx.fillRect(500, 692, 245 - off * .5, 16); ctx.fillRect(765 + off, 692 + off * .6, 335, 16);
                     ctx.fillStyle = sh('#4c5560', 1, k); ctx.fillRect(500, 692, 245 - off * .5, 5);
                     if (sn >= 1) { // water spurt
                            ctx.fillStyle = 'rgba(150,205,235,.85)';
                            for (let i = 0; i < 14; i++) { const p = mod(t * 2.2 + i / 14, 1), a = -1.9 + (hs(i) - .5) * .9; ctx.beginPath(); ctx.arc(755 + Math.cos(a) * 40 * p * (1 + hs(i + 2)), 695 + Math.sin(a) * 90 * p + 80 * p * p, 4, 0, TAU); ctx.fill() }
                     }
                     // slope with bulge at base
                     const bu = cl((t - 9.2) / 2.2);
                     fan([[1000, 560], [1100, 420], [1250, 330], [1400, 420], [1460, 560]], [1230, 470], '#7a8a5a', 1, k);
                     fan([[1060, 560], [1130, 510 - 38 * bu], [1230, 490 - 60 * bu], [1340, 510 - 40 * bu], [1420, 560]], [1230, 545], '#8b6a45', 1, k);
                     for (let i = 0; i < 6; i++) { const x = 1090 + i * 52, y = 540 - 24 * bu * Math.sin((i + .5) / 6 * Math.PI); tri([x, y + 10], [x + 26, y - 6], [x + 52, y + 10], sh('#6f5236', .8 + .3 * hs(i), k)) }
                     // fence
                     const ft = cl((t - 10.4) / 1.6) * .35;
                     ctx.save(); ctx.translate(1500, 560); ctx.rotate(ft * .5); ctx.translate(-1500, -560);
                     for (let i = 0; i < 4; i++) { ctx.fillStyle = sh('#a07848', 1, k); ctx.fillRect(1500 + i * 36, 515, 10, 45); tri([1500 + i * 36, 515], [1505 + i * 36, 505], [1510 + i * 36, 515], sh('#a07848', 1.1, k)) }
                     ctx.fillRect(1495, 528, 150, 6); ctx.fillRect(1495, 544, 150, 6); ctx.restore();
                     // utility pole
                     ctx.save(); ctx.translate(1700, 580); ctx.rotate(ft * 1.1); ctx.translate(-1700, -580);
                     ctx.fillStyle = sh('#6b4f32', 1, k); ctx.fillRect(1694, 410, 12, 170); ctx.fillRect(1668, 428, 64, 8);
                     ctx.strokeStyle = 'rgba(25,25,25,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1668, 432); ctx.lineTo(1520, 440); ctx.moveTo(1732, 432); ctx.lineTo(1860, 440); ctx.stroke(); ctx.restore();
                     // tilting trees
                     tree(1850, 570, 1.5, k, ft * 1.2); tree(1960, 575, 1.3, k, ft * 1.5);
                     for (const x of [90, 200, 620, 900]) tree(x, gy2(x), 1.3, k);
                     // warnings
                     warn(405, 560, 1, t, 6.6); warn(760, 660, 1, t, 8.0); warn(1230, 410, 1, t, 9.2); warn(1600, 480, 1, t, 10.4);
              }

              // ---- Scene 3: creek + water ----
              const gy3 = x => 540 + 10 * Math.sin(x * .007);
              function waterScene(t, k) {
                     peak(500, 230, 800, 600, '#8aa6bd', k); peak(1350, 200, 900, 600, '#8aa6bd', k);
                     peak(1000, 320, 600, 620, '#6a8f5c', k);
                     ctx.fillStyle = sh('#6b4f32', 1, k); ctx.beginPath(); ctx.moveTo(-200, 1300); for (let x = -200; x <= 2000; x += 50) ctx.lineTo(x, gy3(x)); ctx.lineTo(2000, 1300); ctx.fill();
                     for (let x = -200; x < 2000; x += 100) { const g0 = gy3(x), g1 = gy3(x + 100), m = [x + 50 + (hs(x) - .5) * 30, Math.max(g0, g1) + 80 + hs(x + 3) * 30]; tri([x, g0], [x + 100, g1], m, sh('#5f8a40', .8 + .4 * hs(x), k)); tri([x, g0], m, [x - 20, g0 + 120], sh('#4a7a3a', .7 + .3 * hs(x + 1), k)) }
                     // creek channel (right)
                     const drop = sm(cl((t - 13.8) / 1.8)), lvl = lp(0, 34, drop);
                     ctx.fillStyle = sh('#4a3a28', 1, k); ctx.beginPath(); ctx.moveTo(1120, gy3(1120)); ctx.lineTo(1170, 640); ctx.lineTo(1470, 640); ctx.lineTo(1520, gy3(1520)); ctx.closePath(); ctx.fill();
                     const top = 575 + lvl;
                     ctx.fillStyle = 'rgba(80,150,190,.95)'; ctx.beginPath(); ctx.moveTo(1140, top); ctx.lineTo(1500, top); ctx.lineTo(1470, 640); ctx.lineTo(1170, 640); ctx.closePath(); ctx.fill();
                     ctx.strokeStyle = 'rgba(235,245,250,.7)'; ctx.lineWidth = 3; ctx.setLineDash([14, 22]); ctx.lineDashOffset = -t * 70; ctx.beginPath(); ctx.moveTo(1150, top + 12); ctx.lineTo(1490, top + 12); ctx.stroke(); ctx.setLineDash([]);
                     // water-level mark
                     ctx.fillStyle = '#ff9f1a'; ctx.fillRect(1500, 575, 24, 4); ctx.fillStyle = 'rgba(255,159,26,.5)'; ctx.fillRect(1500, 575, 24, 70);
                     // dry patch -> bursting water
                     const bw = cl((t - 12.9) / 1.2);
                     ctx.fillStyle = sh('#8b6a45', 1, k); ctx.beginPath(); ctx.ellipse(700, gy3(700) + 18, 130, 24, 0, 0, TAU); ctx.fill();
                     if (bw > 0) {
                            ctx.fillStyle = 'rgba(90,160,200,.92)'; ctx.beginPath(); ctx.ellipse(700, gy3(700) + 18, 130 * bw, 24 * bw, 0, 0, TAU); ctx.fill();
                            ctx.fillStyle = 'rgba(190,225,245,.9)';
                            for (let i = 0; i < 16; i++) { const p = mod(t * 1.8 + i / 16, 1), a = -Math.PI / 2 + (hs(i) - .5) * 1.4; ctx.beginPath(); ctx.arc(700 + Math.cos(a) * 70 * p, gy3(700) + 10 + Math.sin(a) * 90 * p * (1 - p * .5) + 120 * p * p, 4 * (1 - p * .5), 0, TAU); ctx.fill() }
                            // trickle toward creek
                            ctx.strokeStyle = 'rgba(95,150,180,.95)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(820, gy3(820) + 22); for (let x = 820; x <= 820 + 300 * bw; x += 20) ctx.lineTo(x, gy3(x) + 22); ctx.stroke(); ctx.lineCap = 'butt';
                     }

              }

              function cam(t) {
                     const s1 = { x: 640, y: 440, s: 1 };
                     const s2 = { x: 900 + 340 * cl((t - 6) / 6), y: 480, s: 1 };
                     const s3 = { x: 900, y: 460, s: 1 };
                     return t < 6 ? { x: 640 + 10 * Math.sin(t * .4), y: 440, s: 1 } : t < 12.2 ? { x: lp(640, 1300, sm(cl((t - 5.9) / 6))), y: 480, s: 1 } : { x: lp(900, 1140, sm(cl((t - 12.2) / 4.5))), y: 470, s: 1 };
              }

              function frame(t) {
                     ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                     const k = t < 12.2 ? .2 : lp(.2, .75, sm(cl((t - 12.2) / 1.5))), ri = t > 12 ? cl((t - 12) / 1.2) * .85 * (1 - cl((t - 17.1) / .7)) : 0;
                     const g = ctx.createLinearGradient(0, 0, 0, H * .75); g.addColorStop(0, rg(mx(hx('#6fa3c9'), hx('#232f3b'), k))); g.addColorStop(.6, rg(mx(hx('#a9d0e0'), hx('#46565f'), k))); g.addColorStop(1, rg(mx(hx('#f4e4b8'), hx('#79878a'), k))); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                     ctx.globalAlpha = .25 + .75 * cl(t / 2); for (let i = 0; i < 6; i++) cloud(mod(i * 260 + t * 14, 1700) - 250, 50 + hs(i) * 100, 36 + hs(i + 4) * 24, k); ctx.globalAlpha = 1;

                     ctx.save(); ctx.translate(640 + shx, 360 + shy); ctx.scale(c.s, c.s); ctx.translate(-c.x, -c.y);

                     } else waterScene(t, k);

                     for (const tt of [6, 12.1]) if (Math.abs(t - tt) < .3) { ctx.fillStyle = `rgba(0,0,0,${.7 * (1 - Math.abs(t - tt) / .3)})`; ctx.fillRect(0, 0, W, H) }
                     ctx.fillStyle = `rgba(10,18,28,${.22 * k})`; ctx.fillRect(0, 0, W, H);

                     // rain
                     ctx.strokeStyle = 'rgba(200,220,235,.5)'; ctx.lineWidth = 1.3; ctx.beginPath();
                     for (let i = 0; i < 380; i++) { if (hs(i) > ri) continue; const y = mod(hs(i + 3) * 900 + t * (850 + hs(i + 4) * 400), 820) - 50, x = mod(hs(i + 1) * 1500, 1500) - 100 + y * .18, len = 14 + hs(i + 5) * 14; ctx.moveTo(x - len * .18, y - len); ctx.lineTo(x, y) } ctx.stroke();

                     labelsDraw(t, c);

                     // title
                     if (t < 3.6 || false) { }
                     if (t > .1 && t < 1.8) { const y = lp(-80, 70, bo(cl((t - .1) / .9))), s = showHindi ? 'लैंडस्लाइड चेतावनी संकेत' : 'LANDSLIDE WARNING SIGNS'; ctx.save(); ctx.globalAlpha = cl((1.8 - t) / .3); ctx.font = '800 48px system-ui,sans-serif'; ctx.textAlign = 'center'; const w = ctx.measureText(s).width + 80; ctx.fillStyle = 'rgba(8,14,24,.72)'; rr(640 - w / 2, y - 46, w, 74, 18); ctx.fill(); ctx.fillStyle = '#ff9f1a'; ctx.fillRect(640 - w / 2 + 20, y + 20, w - 40, 5); ctx.fillStyle = '#f4ead2'; ctx.fillText(s, 640, y + 6); ctx.restore() }

                     // scene 4
                     if (t > 17) {
                            const a = sm(cl((t - 17) / .7));
                            if (t < 17.8) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = `blur(${Math.round(a * 14 * dpr)}px)`; ctx.drawImage(cv, 0, 0); ctx.restore() }
                            const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#cdeedb'); bg.addColorStop(1, '#f4ead2'); ctx.globalAlpha = a; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
                            if (t > 17.4) {
                                   const s = bo(cl((t - 17.4) / .6)) * (1 + .03 * Math.sin(t * 5)); ctx.save(); ctx.translate(640, 250); ctx.scale(s, s);
                                   const P = [[0, -120], [95, -80], [95, 10], [60, 80], [0, 125], [-60, 80], [-95, 10], [-95, -80]]; fan(P, [0, -10], '#2f9e5a', 1, 0);
                                   ctx.strokeStyle = '#fff'; ctx.lineWidth = 22; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-42, -5); ctx.lineTo(-10, 32); ctx.lineTo(48, -38); ctx.stroke(); ctx.restore();
                                   ctx.globalAlpha = cl((t - 17.7) / .4); ctx.font = '700 46px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#14181e'; ctx.fillText(showHindi ? 'सावधान रहें। सुरक्षित रहें।' : 'Stay Alert. Stay Safe.', 640, 490); ctx.globalAlpha = 1
                            }
                     }

                     // captions (gray pill)
                     const V = showHindi ? VH : VE;
                     for (let i = 0; i < 4; i++) {
                            const [a, b] = CT[i], al = Math.min(cl((t - a) / .3), cl((b - t) / .3)); if (al <= 0) continue;
                            const s = V[i]; ctx.font = '600 24px system-ui,sans-serif'; ctx.textAlign = 'center';
                            const maxW = 1080, words = s.split(' '), L = []; let cur = '';
                            for (const wd of words) { const tst = cur ? cur + ' ' + wd : wd; if (ctx.measureText(tst).width > maxW && cur) { L.push(cur); cur = wd } else cur = tst } L.push(cur);
                            const w = Math.max(...L.map(l => ctx.measureText(l).width)) + 56, h = L.length * 32 + 20, y = 708 - h;
                            ctx.globalAlpha = al; ctx.fillStyle = i === 3 ? 'rgba(90,98,108,.88)' : 'rgba(8,14,24,.7)'; rr(640 - w / 2, y, w, h, 22); ctx.fill();
                            ctx.fillStyle = '#f4ead2'; L.forEach((l, n) => ctx.fillText(l, 640, y + 34 + n * 32)); ctx.globalAlpha = 1
                     }
                     const fd = Math.max(1 - t / .35, 1 - (D - t) / .35, 0); if (fd > 0) { ctx.fillStyle = `rgba(0,0,0,${cl(fd)})`; ctx.fillRect(0, 0, W, H) }
              }

              function labelsDraw(t, c) {
                     if (t > 17) return;
                     ctx.font = '600 24px system-ui,sans-serif'; ctx.textAlign = 'left'; const T = showHindi ? TX_HI : TX_EN;
                     for (const [a, b, slot, ti, ax, ay] of LB) {
                            const al = Math.min(cl((t - a) / .3), cl((b - t) / .3)); if (al <= 0) continue;
                            const s = T[ti], w = ctx.measureText(s).width + 84, x = 36 - 30 * (1 - al), y = 96 + slot * 60, sx = 640 + (ax - c.x) * c.s, sy = 360 + (ay - c.y) * c.s;
                            ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = 'rgba(255,170,30,.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + w, y + 23); ctx.lineTo(sx, sy); ctx.stroke(); ctx.fillStyle = '#ffae1a'; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, TAU); ctx.fill();
                            ctx.fillStyle = 'rgba(8,14,24,.78)'; rr(x, y, w, 46, 12); ctx.fill(); ctx.strokeStyle = '#ffae1a'; ctx.lineWidth = 2; ctx.stroke();
                            tri([x + 14, y + 36], [x + 31, y + 8], [x + 48, y + 36], '#ffae1a'); ctx.fillStyle = '#3a2410'; ctx.font = '800 20px system-ui,sans-serif'; ctx.fillText('!', x + 27, y + 33);
                            ctx.font = '600 24px system-ui,sans-serif'; ctx.fillStyle = '#f4ead2'; ctx.fillText(s, x + 60, y + 31); ctx.restore()
                     }
              }

              // ---- Audio: synthesized SFX + browser speech voiceover ----
              let ac, rumG, rainG, runG, voices = [];
              if (window.speechSynthesis) { const loadVoices = () => voices = speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = loadVoices; loadVoices() }

              function initAudio() {
                     try {
                            ac = new (window.AudioContext || window.webkitAudioContext)(); const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                            const ns = (type, f) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const g = ac.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(); return g };
                            rumG = ns('lowpass', 90); rainG = ns('highpass', 3500); runG = ns('bandpass', 1400);
                            // ominous bass drone
                            const o = ac.createOscillator(), og = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = 55; const lf = ac.createBiquadFilter(); lf.type = 'lowpass'; lf.frequency.value = 160; og.gain.value = 0; o.connect(lf); lf.connect(og); og.connect(ac.destination); o.start(); ac.droneG = og
                     } catch (e) { ac = null }
              }
              function tone(f, d, v, type, delay = 0) { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + delay; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + d + .05) }
              function burst(d, v, f, delay = 0) { if (!ac) return; const n = ac.currentTime + delay, b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 2); const s = ac.createBufferSource(); s.buffer = b; const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; const g = ac.createGain(); g.gain.value = v; s.connect(fl); fl.connect(g); g.connect(ac.destination); s.start(n) }

              function speak(i) {
                     if (!window.speechSynthesis) return; speechSynthesis.cancel();
                     setTimeout(() => {
                            const u = new SpeechSynthesisUtterance((showHindi ? VH : VE)[i]); u.lang = showHindi ? 'hi-IN' : 'en-US'; u.rate = i === 3 ? 1.0 : 1.12; u.pitch = 1.0;
                            const tl = showHindi ? 'hi' : 'en';
                            let bv = voices.find(v => v.lang.toLowerCase().includes(tl) && v.localService && (v.name.includes('Google') || v.name.includes('Neural')));
                            if (!bv) bv = voices.find(v => v.lang.toLowerCase().includes(tl) && v.localService); if (!bv) bv = voices.find(v => v.lang.toLowerCase().includes(tl));
                            if (bv) u.voice = bv; speechSynthesis.speak(u)
                     }, 40)
              }

              // Events: voice, label pings, creaks/cracks/snap, chime
              const EV = [[.3, 'v', 0], [6.2, 'v', 1], [12.2, 'v', 2], [17.3, 'v', 3],
              [1.0, 'b'], [2.4, 'b'], [3.8, 'b'], [6.6, 'b'], [8.0, 'b'], [9.2, 'b'], [10.4, 'b'], [12.8, 'b'], [14.4, 'b'],
              [1.0, 'creak'], [2.4, 'creak'], [3.9, 'creak'], [6.8, 'crack'], [8.2, 'snap'], [10.5, 'creak'], [12.9, 'splash'], [17.4, 'c']];
              function fire(e) {
                     const k = e[1];
                     if (k === 'v') speak(e[2]);
                     else if (k === 'b') { tone(1500, .09, .08, 'square'); tone(1500, .09, .08, 'square', .14) }
                     else if (k === 'creak') { tone(140, .5, .07, 'sawtooth'); tone(180, .4, .05, 'sawtooth', .15); burst(.5, .12, 600) }
                     else if (k === 'crack') { burst(.5, .35, 900); burst(.35, .25, 300, .15) }

                     else if (k === 'splash') { burst(.8, .25, 2200) }

              }
              function audioTick(t) {
                     if (!ac || !rumG) return;
                     const drone = t < 6 ? .12 * sm(cl(t / 1.5)) : t < 6.5 ? .12 * (6.5 - t) / .5 : 0;
                     const rumble = t > 12.5 && t < 17.2 ? .2 + 1.2 * cl((t - 12.5) / 4.5) : t > 6 && t < 12 ? .15 * cl((t - 6) / 3) : 0;
                     const rn = t > 12 && t < 17.3 ? .05 * cl((t - 12) / 1.2) : 0;

                     const T = ac.currentTime;
                     ac.droneG.gain.setTargetAtTime(drone, T, .1); rumG.gain.setTargetAtTime(rumble, T, .1); rainG.gain.setTargetAtTime(rn, T, .1); runG.gain.setTargetAtTime(run, T, .1)
              }

              let t = 0, pt = 0, playing = false, last = performance.now();
              const pp = document.getElementById('pp'), sk = document.getElementById('sk'), tm = document.getElementById('tm'), btnL = document.getElementById('lang'), overlay = document.getElementById('start-overlay');
              const stopSpeech = () => { if (window.speechSynthesis) speechSynthesis.cancel() };

              document.getElementById('start-btn').onclick = () => {
                     overlay.style.display = 'none'; initAudio();
                     if (window.speechSynthesis) { let dm = new SpeechSynthesisUtterance(''); dm.volume = 0; speechSynthesis.speak(dm) }
                     playing = true; last = performance.now(); pp.disabled = sk.disabled = false; pp.textContent = 'Pause'
              };
              function loop(n) {
                     const dt = Math.min((n - last) / 1000, .1); last = n;
                     if (playing) { t += dt; if (t >= D) { t = 0; pt = -.01; stopSpeech() } sk.value = t; for (const e of EV) if (pt < e[0] && e[0] <= t) fire(e) }
                     pt = t; audioTick(t); frame(t); tm.textContent = t.toFixed(1) + 's'; requestAnimationFrame(loop)
              }
              pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play'; last = performance.now(); if (playing) { if (ac) ac.resume() } else { stopSpeech(); if (ac) ac.suspend() } };
              sk.oninput = () => { playing = false; pp.textContent = 'Play'; t = +sk.value; pt = t; stopSpeech(); if (ac) ac.suspend() };
              btnL.onclick = () => { showHindi = !showHindi; btnL.textContent = 'Hindi Subtitles: ' + (showHindi ? 'On' : 'Off'); stopSpeech() };
              requestAnimationFrame(loop);
       </script>
