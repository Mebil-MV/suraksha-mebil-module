<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Clogged Drain Flood</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f2;--fg:#222}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee}}:root[data-theme="dark"]{--bg:#111;--fg:#eee}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}canvas{width:100%;max-width:1100px;aspect-ratio:16/9;background:#000;border-radius:8px}.bar{display:none !important;gap:10px;align-items:center;width:100%;max-width:1100px}button{font:inherit;padding:5px 12px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}input{flex:1}</style></head><body>
<canvas id="c"></canvas><div class="bar"><button id="pp">Pause</button><input id="sk" type="range" min="0" max="10" step=".01" value="0"><span id="tm">0.0s</span></div>
<script src="drain-flood.js"></script></body></html>
