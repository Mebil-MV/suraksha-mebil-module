<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suraksha · Go-Bag Challenge</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090e17;color:#e6edf8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#143144,transparent 65%)}main{max-width:1100px;margin:auto;padding:25px}header,.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{color:#38bdf8;letter-spacing:3px;font-weight:800}h1{font-size:clamp(28px,5vw,48px);margin:18px 0 8px}p{color:#aabbcf;line-height:1.6}button,select{font:inherit;border:1px solid #344358;border-radius:12px;background:#192536;color:inherit;padding:12px;cursor:pointer;min-height:46px}button:hover{border-color:#38bdf8}button:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:#38bdf8;color:#07131d;font-weight:800}.panel{background:#101c2bd9;border:1px solid #2b4056;border-radius:22px;padding:22px;margin:18px 0}.layout{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{text-align:left;display:flex;flex-direction:column;gap:8px;background:#172638}.item .emoji{font-size:32px}.item small{color:#aabbcf}.item[aria-pressed=true]{border-color:#10b981;background:#103a35}.bag{border:2px dashed #38bdf8;min-height:180px;border-radius:15px;padding:18px;text-align:center;font-size:60px;background:#0b2634}.bag small{display:block;font-size:14px;color:#aabbcf}.meter{height:9px;background:#263446;border-radius:8px;margin:10px 0;overflow:hidden}.meter span{height:100%;display:block;background:#38bdf8;width:0;transition:width .2s}.stats{display:flex;gap:22px;flex-wrap:wrap}.stats strong{display:block;font-size:25px;color:#38bdf8}.stats small{color:#aabbcf}#feedback{min-height:60px;color:#f5cf77}li{margin:12px 0;line-height:1.5}.note{font-size:13px}#result{border-color:#10b981}#result h2{color:#6ee7b7}footer{font-size:13px;color:#8fa4be;padding:20px 0}a{color:#38bdf8}[hidden]{display:none!important}@media(max-width:700px){main{padding:15px}.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.panel{padding:16px}.item{min-height:125px}}
</style></head><body><main>
<header><span class="brand">SURAKSHA / 🎒</span><div class="row"><select id="lang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option></select><button id="speak"></button></div></header>
<h1 data-t="title"></h1><p data-t="intro"></p>
<section class="panel"><div class="row"><div class="stats"><div><strong id="time">60</strong><small data-t="seconds"></small></div><div><strong id="xp">0</strong><small data-t="xp"></small></div><div><strong id="rank"></strong><small data-t="rank"></small></div></div><div class="row"><select id="mode"><option value="timed"></option><option value="practice"></option></select><button id="start" class="primary"></button></div></div></section>
<div class="layout"><section class="panel"><h2 data-t="supplies"></h2><div id="items" class="grid"></div></section><section class="panel"><h2 data-t="bag"></h2><div id="bag" class="bag">🎒<small data-t="drop"></small></div><p id="capacity"></p><div class="meter"><span id="weightbar"></span></div><p id="slots"></p><div class="meter"><span id="slotbar"></span></div><p id="feedback" role="status" aria-live="polite"></p><button id="finish" class="primary" data-t="finish" disabled></button><p class="note" data-t="note"></p></section></div>
<section id="result" class="panel" hidden aria-live="polite"><h2 id="resulttitle"></h2><p id="summary"></p><h3 data-t="review"></h3><ul id="review"></ul></section>
<footer><span data-t="source"></span> <a href="https://www.ready.gov/kit" target="_blank" rel="noopener">Ready.gov</a></footer>
</main><script>
'use strict';
const texts={en:{title:'Pack your go-bag.',intro:'60 seconds. One backpack. Choose emergency essentials before you leave. Tap to pack or remove; desktop users can also drag items into the bag.',seconds:'Seconds left',xp:'Local readiness XP',rank:'Readiness rank',supplies:'Choose your supplies',bag:'Your emergency bag',drop:'Drop items here or tap their cards',finish:'Finish packing',note:'Capacity and weights are game rules, not a complete real-world kit. Plan supplies for your household, medicines, accessibility needs, babies and pets. Never delay evacuation to collect belongings.',source:'Emergency supply reference:',timed:'60-second challenge',practice:'Untimed practice',start:'Start challenge',again:'Play again',speak:'🔊 Read instructions',ready:'Press Start to pack your bag.',full:'Bag capacity reached. Remove another item first.',added:'Packed: ',removed:'Removed: ',weight:'Weight',slots:'Items',review:'Your packing review',packed:'Packed',missed:'Missing essential',extra:'Low priority',complete:'🎒 Kit Master unlocked!',done:'Packing complete',points:'Round score',earned:'New XP earned',best:'Best score',saved:'Progress saved on this browser.',unsaved:'Browser storage unavailable; progress lasts for this visit only.',novice:'Novice Citizen',scout:'Prepared Scout',volunteer:'Rescue Volunteer',champion:'Suraksha Champion',tip:'Tip: select all eight emergency essentials.',badge:'Badge',penalty:'Luxury items cost 15 points each.'},hi:{title:'अपना आपातकालीन बैग तैयार करें।',intro:'60 सेकंड। एक बैग। निकलने से पहले ज़रूरी सामान चुनें। सामान रखने या हटाने के लिए टैप करें; कंप्यूटर पर सामान खींचकर बैग में भी रख सकते हैं।',seconds:'बचे हुए सेकंड',xp:'स्थानीय तैयारी अंक',rank:'तैयारी स्तर',supplies:'अपना सामान चुनें',bag:'आपका आपातकालीन बैग',drop:'सामान यहाँ छोड़ें या कार्ड पर टैप करें',finish:'पैकिंग पूरी करें',note:'क्षमता और वज़न केवल खेल के नियम हैं, असली किट की पूरी सूची नहीं। परिवार, दवाइयों, विशेष ज़रूरतों, बच्चों और पालतू जानवरों की योजना बनाएँ। सामान लेने के लिए निकासी में देर न करें।',source:'आपातकालीन सामान का संदर्भ:',timed:'60 सेकंड की चुनौती',practice:'बिना समय सीमा अभ्यास',start:'चुनौती शुरू करें',again:'फिर खेलें',speak:'🔊 निर्देश सुनें',ready:'बैग भरने के लिए शुरू करें दबाएँ।',full:'बैग भर गया। पहले कोई सामान हटाएँ।',added:'रखा: ',removed:'हटाया: ',weight:'वज़न',slots:'सामान',review:'आपकी पैकिंग की समीक्षा',packed:'रखा गया',missed:'ज़रूरी सामान छूटा',extra:'कम प्राथमिकता',complete:'🎒 किट मास्टर बैज मिला!',done:'पैकिंग पूरी हुई',points:'इस राउंड के अंक',earned:'नए तैयारी अंक',best:'सर्वश्रेष्ठ अंक',saved:'प्रगति इस ब्राउज़र में सेव हुई।',unsaved:'ब्राउज़र में सेव नहीं हो सका; प्रगति केवल इस सत्र तक रहेगी।',novice:'नया नागरिक',scout:'तैयार स्काउट',volunteer:'बचाव स्वयंसेवक',champion:'सुरक्षा चैंपियन',tip:'सुझाव: सभी आठ ज़रूरी सामान चुनें।',badge:'बैज',penalty:'हर विलासिता की वस्तु के 15 अंक कटेंगे।'}};
// [id, emoji, weight kg, essential, English name, Hindi name, English explanation, Hindi explanation]
const supplies=[
['water','💧',2,true,'Drinking water','पीने का पानी','Safe drinking water is essential. This bottle is only part of a household water plan.','सुरक्षित पीने का पानी ज़रूरी है। यह बोतल परिवार की पूरी जल योजना का केवल हिस्सा है।'],
['torch','🔦',.3,true,'Torch + batteries','टॉर्च और बैटरियाँ','A torch provides light during power cuts; include spare batteries.','बिजली जाने पर टॉर्च रोशनी देती है; अतिरिक्त बैटरियाँ रखें।'],
['aid','🩹',.5,true,'First-aid kit','प्राथमिक उपचार किट','Carry basic first-aid supplies and learn how to use them.','प्राथमिक उपचार का सामान रखें और उसका उपयोग सीखें।'],
['medicine','💊',.2,true,'Personal medicines','व्यक्तिगत दवाइयाँ','Plan needed prescription medicines and a medication list.','ज़रूरी निर्धारित दवाइयाँ और उनकी सूची तैयार रखें।'],
['food','🥫',1,true,'Ready-to-eat food','तैयार खाने का सामान','Choose non-perishable food that can be eaten without cooking.','ऐसा टिकाऊ खाना चुनें जिसे बिना पकाए खा सकें।'],
['radio','📻',.5,true,'Battery radio','बैटरी वाला रेडियो','A battery or hand-crank radio can receive official updates during outages.','बैटरी या हैंड-क्रैंक रेडियो से बिजली न होने पर आधिकारिक सूचना मिल सकती है।'],
['whistle','📣',.1,true,'Whistle','सीटी','A whistle helps signal for assistance.','सीटी से मदद के लिए संकेत दे सकते हैं।'],
['documents','📁',.2,true,'Document copies','दस्तावेज़ों की प्रतियाँ','Keep important document copies and emergency contacts protected from water.','ज़रूरी दस्तावेज़ों की प्रतियाँ और संपर्क सूची पानी से सुरक्षित रखें।'],
['console','🎮',2,false,'Gaming console','गेमिंग कंसोल','A console uses bag space needed for emergency essentials.','कंसोल बैग में ज़रूरी सामान की जगह लेता है।'],
['gold','💎',1.5,false,'Heavy jewellery','भारी आभूषण','Do not delay evacuation to collect valuables; prioritize essential supplies.','कीमती सामान लेने के लिए निकासी में देर न करें; ज़रूरी सामान को प्राथमिकता दें।'],
['speaker','🔊',1,false,'Party speaker','पार्टी स्पीकर','A party speaker is lower priority than water, medicines and a radio.','पार्टी स्पीकर की तुलना में पानी, दवाइयाँ और रेडियो अधिक ज़रूरी हैं।'],
['hairdryer','💨',.8,false,'Hair dryer','हेयर ड्रायर','An electric hair dryer is not a priority evacuation supply.','बिजली वाला हेयर ड्रायर निकासी के लिए प्राथमिक सामान नहीं है।']
];
const $=id=>document.getElementById(id);let lang='en',active=false,selected=new Set(),deadline=0,timer=null,remaining=60,last=null,storageOK=true;
let progress={xp:0,best:0,badge:false};try{const p=JSON.parse(localStorage.getItem('suraksha-go-bag-v1'));if(p)progress={xp:Math.max(0,Number(p.xp)||0),best:Math.min(100,Math.max(0,Number(p.best)||0)),badge:p.badge===true}}catch{storageOK=false}
const t=k=>texts[lang][k];const name=i=>i[lang==='en'?4:5];const why=i=>i[lang==='en'?6:7];const weight=()=>Math.round(supplies.filter(i=>selected.has(i[0])).reduce((s,i)=>s+i[2],0)*10)/10;
function score(){return Math.max(0,Math.round(100*supplies.filter(i=>i[3]&&selected.has(i[0])).length/8)-15*supplies.filter(i=>!i[3]&&selected.has(i[0])).length)}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('speak').textContent=t('speak');$('mode').options[0].textContent=t('timed');$('mode').options[1].textContent=t('practice');$('start').textContent=t(last?'again':'start');$('start').disabled=active;$('mode').disabled=active;$('finish').disabled=!active;$('xp').textContent=progress.xp;$('rank').textContent=t(progress.xp<=100?'novice':progress.xp<=300?'scout':progress.xp<=600?'volunteer':'champion');$('time').textContent=$('mode').value==='practice'?'∞':remaining;
$('capacity').textContent=`${t('weight')}: ${weight().toFixed(1)} / 6 kg`;$('slots').textContent=`${t('slots')}: ${selected.size} / 8`;$('weightbar').style.width=weight()/6*100+'%';$('slotbar').style.width=selected.size/8*100+'%';
$('items').replaceChildren(...supplies.map(i=>{const b=document.createElement('button');b.className='item';b.disabled=!active;b.draggable=active&&!selected.has(i[0]);b.setAttribute('aria-pressed',String(selected.has(i[0])));const e=document.createElement('span');e.className='emoji';e.textContent=i[1];const label=document.createElement('strong');label.textContent=(selected.has(i[0])?'✓ ':'')+name(i);const sub=document.createElement('small');sub.textContent=i[2]+' kg';b.append(e,label,sub);b.onclick=()=>toggle(i[0]);b.ondragstart=ev=>ev.dataTransfer.setData('text/plain',i[0]);return b}));if(last)renderResult();}
function toggle(id){if(!active)return;if($('mode').value==='timed'&&Date.now()>=deadline){finish();return}const i=supplies.find(x=>x[0]===id);if(!i)return;if(selected.has(id)){selected.delete(id);$('feedback').textContent=t('removed')+name(i)}else{if(selected.size>=8||weight()+i[2]>6.0001){$('feedback').textContent=t('full');return}selected.add(id);$('feedback').textContent=t('added')+name(i)+'. '+why(i)}render()}
function start(){clearInterval(timer);window.speechSynthesis?.cancel();selected=new Set();last=null;remaining=60;active=true;deadline=Date.now()+60000;$('result').hidden=true;$('feedback').textContent=t('tip')+' '+t('penalty');render();if($('mode').value==='timed')timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('time').textContent=remaining;if(!remaining)finish()},150)}
function finish(){if(!active)return;active=false;clearInterval(timer);const s=score(),earned=Math.max(0,s-progress.best);progress.xp+=earned;progress.best=Math.max(progress.best,s);if(s===100)progress.badge=true;try{localStorage.setItem('suraksha-go-bag-v1',JSON.stringify(progress))}catch{storageOK=false}last={score:s,earned};render();$('result').hidden=false;$('feedback').textContent=t('done');$('result').scrollIntoView({behavior:'smooth',block:'start'});}
function renderResult(){$('resulttitle').textContent=last.score===100?t('complete'):t('done');$('summary').textContent=`${t('points')}: ${last.score}/100 · ${t('earned')}: +${last.earned} · ${t('best')}: ${progress.best}/100. ${t(storageOK?'saved':'unsaved')}`;$('review').replaceChildren(...supplies.filter(i=>i[3]||selected.has(i[0])).map(i=>{const li=document.createElement('li');li.textContent=`${i[3]?(selected.has(i[0])?'✅ '+t('packed'):'⚠️ '+t('missed')):'❌ '+t('extra')}: ${name(i)} — ${why(i)}`;return li}));}
$('start').onclick=start;$('finish').onclick=finish;$('mode').onchange=render;$('lang').onchange=()=>{lang=$('lang').value;window.speechSynthesis?.cancel();render();$('feedback').textContent=t(active?'tip':'ready')};$('bag').ondragover=e=>e.preventDefault();$('bag').ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(!selected.has(id))toggle(id)};$('speak').onclick=()=>{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t('intro')+' '+t('note'));u.lang=lang==='hi'?'hi-IN':'en-US';window.speechSynthesis.speak(u)};if(!('speechSynthesis'in window))$('speak').disabled=true;render();$('feedback').textContent=t('ready');
</script></body></html>
