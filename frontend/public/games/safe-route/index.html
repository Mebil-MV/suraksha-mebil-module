रास्ता फिर जाँचें।',cable:'नई बंदी: बिजली का तार गिरा है। पूरी चिन्हित सड़क से दूर रहें।',stopped:'परिवार बंद सड़क से पहले सुरक्षित चौराहे पर रुक गया। नारंगी निशान से नया रास्ता बनाएँ।',moving:'परिवार आपके रास्ते पर चल रहा है। हर सड़क पर जाने से पहले नई बंदी जाँची जाती है।',short:'पहले आश्रय तक पूरा रास्ता बनाएँ।',pausemsg:'खेल रुका है। सड़कें और परिवार स्थिर हैं।',win:'परिवार सुरक्षित पहुँचा। सड़क असुरक्षित हो तो निकासी की योजना बदलें।',phase1:'1 · बारिश',phase2:'2 · बढ़ता पानी',phase3:'3 · तेज बारिश',result:'मिशन के अंक',earned:'नए तैयारी अंक',badge:'बाढ़ मार्गदर्शक बैज',yes:'मिल गया',no:'सभी 3 मिशन पूरे करें',storage:'प्रगति इस ब्राउज़र में सेव हुई।',nostorage:'सेव उपलब्ध नहीं; प्रगति केवल इस सत्र तक रहेगी।',reportTag:'सूचना: छिपा खुला मैनहोल',closeTag:'बाढ़ के कारण सड़क बंद',wireTag:'बिजली के खतरे की सूचना',stageTag:'मिशन',tapStart:'पहले मिशन शुरू करें।',retry:'खतरनाक सड़क पार नहीं हुई। रास्ता बनाते रहें।',noVoice:'इस ब्राउज़र में आवाज़ उपलब्ध नहीं है।',lesson1:'बाढ़ के पानी में खुले मैनहोल, मलबा और बिजली के खतरे छिप सकते हैं। पानी में न उतरें।',lesson2:'बाढ़ वाले अंडरपास से दूर रहें। बढ़ते पानी से पहले पार निकलने का प्रयास न करें और दिखती गहराई से सुरक्षा न तय करें।',lesson3:'अधिकारियों की नई सूचना मानें। रास्ता बंद हो तो सुरक्षित जगह रुकें और रास्ता बदलें या आधिकारिक मदद माँगें।',up:'ऊपर का रास्ता जोड़ें',down:'नीचे का रास्ता जोड़ें',left:'बाएँ का रास्ता जोड़ें',right:'दाएँ का रास्ता जोड़ें',undo:'आखिरी सड़क हटाएँ',planned:'नियोजित सड़कें'}};
const $=id=>document.getElementById(id),cv=$('map'),ctx=cv.getContext('2d');let lang='en';const t=k=>I18N[lang][k];
const nodes=Array.from({length:30},(_,id)=>({id,x:115+(id%6)*150,y:100+Math.floor(id/6)*135}));
const edgeKey=(a,b)=>[a,b].sort((x,y)=>x-y).join('-');const edges=[];for(const n of nodes){if(n.id%6<5)edges.push({a:n.id,b:n.id+1,key:edgeKey(n.id,n.id+1)});if(n.id<24)edges.push({a:n.id,b:n.id+6,key:edgeKey(n.id,n.id+6)})}
const missionConfigs=[
{start:24,goal:5,water:[[25,26],[26,27],[27,28],[28,29],[22,28],[16,22]],wire:[[14,15],[15,21]],unknown:[[18,19],[19,20],[13,19]],hole:[19,20],flood:[[20,21],[21,22]],fall:[[9,10],[10,16]]},
{start:29,goal:0,water:[[25,26],[26,27],[27,28],[22,28],[16,22]],wire:[[13,14],[14,20]],unknown:[[21,22],[20,21],[15,21]],hole:[20,21],flood:[[15,16],[16,17]],fall:[[8,9],[9,15]]},
{start:25,goal:5,water:[[26,27],[27,28],[28,29],[22,28]],wire:[[12,13],[13,19]],unknown:[[19,20],[20,21],[14,20]],hole:[20,21],flood:[[14,15],[15,16]],fall:[[9,10],[10,16]]}
];
let mission=0,mode='idle',elapsed=0,phase=1,scanned=false,route=[],current=24,queue=[],leg=null,drag=false,paused=false,message='ready',log=[],mistakes=0,result=null,storageOK=true,lastFrame=0;
let progress={best:[0,0,0]};try{const p=JSON.parse(localStorage.getItem('suraksha-safe-route-v1'));if(Array.isArray(p?.best)&&p.best.length===3)progress.best=p.best.map(v=>Math.max(0,Math.min(100,Number(v)||0)))}catch{storageOK=false}
const config=()=>missionConfigs[mission];const includes=(arr,k)=>arr.some(p=>edgeKey(...p)===k);
function hazard(e,futurePhase=phase){const c=config();if(includes(c.water,e.key))return 'water';if(includes(c.wire,e.key))return 'wire';if(includes(c.flood,e.key))return futurePhase>=2?'water':'underpass';if(futurePhase>=3&&includes(c.fall,e.key))return 'wire';if(includes(c.unknown,e.key)){if(!scanned)return 'unknown';if(edgeKey(...c.hole)===e.key)return 'drain'}return 'dry'}
function edge(a,b){return edges.find(e=>e.key===edgeKey(a,b))}
function say(key){message=key;$('message').textContent=t(key)}
function entry(key){log.unshift(key);log=log.slice(0,5);renderLog()}
function renderLog(){$('log').replaceChildren(...log.map(k=>{const li=document.createElement('li');li.textContent=t(k);return li}))}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));cv.setAttribute('aria-label',t('mapHelp'));for(const key of ['up','down','left','right','undo'])$(key).setAttribute('aria-label',t(key));$('start').textContent=t(mode==='idle'?'start':'restart');$('stage').textContent=`${mission+1} / 3`;$('weather').textContent=t('phase'+phase);$('distance').textContent=Math.max(0,route.length-1);$('xp').textContent=progress.best.reduce((a,b)=>a+b,0);$('message').textContent=t(message);$('pause').textContent=t(paused?'resume':'pause');const plan=mode==='plan'&&!paused;for(const id of ['up','down','left','right','undo','clear','go'])$(id).disabled=!plan;$('report').disabled=!['plan','travel'].includes(mode)||paused||scanned;$('pause').disabled=!['plan','travel'].includes(mode);$('result').hidden=mode!=='won';renderLog();if(result){$('score').textContent=`${t('result')}: ${result.score}/100 · ${t('earned')}: +${result.earned} XP. ${t('badge')}: ${progress.best.every(v=>v>0)?t('yes'):t('no')}. ${t(storageOK?'storage':'nostorage')}`;$('next').textContent=mission===2?t('restart'):t('next')}}
function start(){mode='plan';elapsed=0;phase=1;scanned=false;current=config().start;route=[current];queue=[];leg=null;paused=false;mistakes=0;result=null;log=[];say('plan');render()}
function planNode(id){if(mode!=='plan'||paused)return;if(!nodes[id])return;const tail=route.at(-1);if(id===tail)return;if(route.length>1&&id===route.at(-2)){route.pop();render();return}const e=edge(tail,id);if(!e){say('adjacent');return}const h=hazard(e);if(h!=='dry'){mistakes++;say(h==='unknown'?'unverified':h==='underpass'?'underpassBlocked':'blocked');render();return}if(route.includes(id)){say('adjacent');return}route.push(id);say('plan');render()}
function direction(delta){const tail=route.at(-1);if(tail===undefined)return;const next=tail+delta;if((delta===1&&tail%6===5)||(delta===-1&&tail%6===0))return;planNode(next)}
function report(){if(!['plan','travel'].includes(mode)||paused)return;if(scanned){say('already');return}scanned=true;entry('reportTag');say('reports');render()}
function guide(){if(mode!=='plan'||paused)return;if(route.at(-1)!==config().goal){say('short');return}for(let i=1;i<route.length;i++)if(hazard(edge(route[i-1],route[i]))!=='dry'){say('blocked');return}queue=route.slice(1);mode='travel';say('moving');render()}
function stop(){mode='plan';queue=[];leg=null;route=[current];say('stopped');render()}
function win(){mode='won';const score=Math.max(50,100-Math.min(30,mistakes*5)-(scanned?0:10));const earned=Math.max(0,score-progress.best[mission]);progress.best[mission]=Math.max(progress.best[mission],score);try{localStorage.setItem('suraksha-safe-route-v1',JSON.stringify(progress))}catch{storageOK=false}result={score,earned};say('win');render()}
function update(dt){if(!['plan','travel'].includes(mode)||paused)return;elapsed+=dt;const next=elapsed>=26?3:elapsed>=12?2:1;if(next!==phase){phase=next;entry(phase===2?'closeTag':'wireTag');say(phase===2?'closed':'cable');render()}
if(mode!=='travel')return;
if(!leg){if(!queue.length){if(current===config().goal)win();else stop();return}const dest=queue[0];if(hazard(edge(current,dest))!=='dry'){stop();return}leg={from:current,to:dest,u:0}}
// A closure appearing mid-segment halts travel and returns the marker to the
// preceding safe junction: a teaching abstraction, never a recommended real manoeuvre.
if(hazard(edge(leg.from,leg.to))!=='dry'){stop();return}leg.u=Math.min(1,leg.u+dt/1.8);if(leg.u>=1){current=leg.to;queue.shift();leg=null;if(current===config().goal)win()}}
function xy(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*1000/r.width,y:(ev.clientY-r.top)*760/r.height}}
function nearest(p){let best=null,dist=Infinity;for(const n of nodes){const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<dist){best=n;dist=d}}return dist<58?best:null}
cv.onpointerdown=e=>{if(mode!=='plan'||paused)return;e.preventDefault();cv.focus();const n=nearest(xy(e));if(n)planNode(n.id);drag=true;cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag||mode!=='plan'||paused)return;const n=nearest(xy(e));if(n&&edge(route.at(-1),n.id))planNode(n.id)};cv.onpointerup=cv.onpointercancel=()=>{drag=false};cv.onkeydown=e=>{const keys={ArrowUp:-6,ArrowDown:6,ArrowLeft:-1,ArrowRight:1};if(e.key in keys){e.preventDefault();direction(keys[e.key])}else if(e.key==='Backspace'){e.preventDefault();undo()}};
function undo(){if(mode==='plan'&&!paused&&route.length>1){route.pop();render()}}
$('up').onclick=()=>direction(-6);$('down').onclick=()=>direction(6);$('left').onclick=()=>direction(-1);$('right').onclick=()=>direction(1);$('undo').onclick=undo;$('clear').onclick=()=>{route=[current];say('plan');render()};$('start').onclick=start;$('go').onclick=guide;$('report').onclick=report;$('pause').onclick=()=>{paused=!paused;say(paused?'pausemsg':mode==='travel'?'moving':'plan');render()};$('language').onchange=()=>{lang=$('language').value;window.speechSynthesis?.cancel();render()};$('next').onclick=()=>{mission=(mission+1)%3;start()};$('voice').onclick=()=>{if(!('speechSynthesis'in window)){say('noVoice');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t('intro')+' '+t('mapHelp')+' '+t('lesson1'));u.lang=lang==='hi'?'hi-IN':'en-US';speechSynthesis.speak(u)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['plan','travel'].includes(mode)&&!paused){paused=true;say('pausemsg');render()}});
// Faceted Canvas art follows the visual vocabulary of the supplied PSA references.
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function rect(x,y,w,h,c,r=0){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function line(points,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function text(s,x,y,size=16,c='#f3f2db',weight=700){ctx.fillStyle=c;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}
function tree(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);poly([[-18,14],[17,14],[26,21],[-3,25]],'#304e5140');rect(-3,0,6,15,'#716452');poly([[-20,6],[0,-30],[21,6]],'#3a6957');poly([[0,-30],[0,6],[21,6]],'#2c514b');poly([[-16,-8],[0,-38],[16,-8]],'#669577');ctx.restore()}
function house(x,y,seed){const colors=['#d9c4a0','#a9c4b1','#c5ccc3','#c8ae93'];rect(x-31,y-24,76,58,'#314c4b40',5);rect(x-39,y-35,69,53,colors[seed%4],3);poly([[30,-35],[43,-23],[43,30],[30,18]].map(([a,b])=>[x+a,y+b]),'#7b9285');poly([[-47,-34],[-7,-59],[37,-34],[-7,-9]].map(([a,b])=>[x+a,y+b]),seed%2?'#6b8582':'#93795e');poly([[-7,-59],[37,-34],[-7,-9]].map(([a,b])=>[x+a,y+b]),seed%2?'#4c6e6f':'#725d50');rect(x-21,y-4,13,22,'#556960');rect(x+4,y-3,16,12,'#c2e0d1');}
function label(s,x,y,color='#253f3b',bg='#efecd1'){ctx.font='700 16px system-ui';const w=ctx.measureText(s).width+20;rect(x-w/2,y-16,w,27,bg,8);text(s,x,y+3,16,color)}
const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
function draw(ts){const anim=paused||reduced?0:ts;ctx.clearRect(0,0,1000,760);
poly([[0,0],[1000,0],[1000,760],[0,760]],'#8ba38b');poly([[0,0],[570,0],[230,350],[0,500]],'#9bb596');poly([[570,0],[1000,0],[1000,550],[230,350]],'#7f9c8b');poly([[0,500],[230,350],[1000,550],[1000,760],[0,760]],'#6d9188');
// Flooded river bank stays outside the usable road network.
poly([[0,708],[200,700],[470,718],[700,695],[1000,702],[1000,760],[0,760]],'#3c6d7e');for(let i=0;i<19;i++){const x=(i*79+anim*.009)%1100-50,y=722+(i%3)*14;line([[x,y],[x+21,y-2],[x+35,y]],'#8fb4b873',2)}
rect(65,48,870,119,'#b0bd92',18);for(let i=0;i<3;i++)line([[80,57+i*8],[921,57+i*8]],'#c5cdac77',2);
for(const e of edges){const a=nodes[e.a],b=nodes[e.b];line([[a.x+3,a.y+5],[b.x+3,b.y+5]],'#3d5a5350',47);line([[a.x,a.y],[b.x,b.y]],'#627b77',41);line([[a.x,a.y],[b.x,b.y]],'#a4aaa0',32);ctx.setLineDash([7,12]);line([[a.x,a.y],[b.x,b.y]],'#d9d8b07a',2);ctx.setLineDash([])}
for(let y=0;y<4;y++)for(let x=0;x<5;x++){const hx=190+x*150,hy=170+y*135;house(hx,hy,x+y*5);tree(hx+52,hy+33,.72);if((x+y)%2===0)tree(hx-49,hy+28,.5)}
for(const e of edges){const a=nodes[e.a],b=nodes[e.b],h=hazard(e),x=(a.x+b.x)/2,y=(a.y+b.y)/2;if(h==='dry')continue;
if(h==='underpass'){line([[a.x,a.y],[b.x,b.y]],'#526d78',31);line([[a.x,a.y],[b.x,b.y]],'#5194aa',Math.min(28,5+elapsed*1.9));label('!',x,y-2,'#ffe9ba','#685c46');label(t('underpass'),x,y-31,'#4d4935','#d7c89c')}
if(h==='water'||h==='drain'){line([[a.x,a.y],[b.x,b.y]],'#386b84',35);line([[a.x,a.y-4],[b.x,b.y-4]],'#5b9db297',21);const vertical=a.x===b.x;for(let j=0;j<5;j++){const u=(j/5+anim*.00008)%1;const wx=a.x+(b.x-a.x)*u,wy=a.y+(b.y-a.y)*u;line([[wx-9,wy+2],[wx,wy-1],[wx+10,wy+2]],'#c0d5c591',2)}if(h==='drain'){circle(x,y,13,'#172c35');circle(x,y,7,'#071923');label('◉',x,y-27,'#fff0cf','#8a5846')}else{label('×',x,y-2,'#ffe3c4','#655759')}}
if(h==='wire'){line([[a.x,a.y],[b.x,b.y]],'#5c494780',33);line([[x-26,y-21],[x+13,y+10],[x-6,y+17],[x+27,y+30]],'#282f34',5);line([[x-32,y+23],[x+27,y-23]],'#dfbd72',4);label('⚡',x,y-30,'#ffe3aa','#665747')}
if(h==='unknown'){line([[a.x,a.y],[b.x,b.y]],'#788c8a',27);ctx.setLineDash([5,8]);line([[a.x,a.y],[b.x,b.y]],'#e3ddae',3);ctx.setLineDash([]);label('?',x,y-4,'#334744','#e1d8af')}}
// Planned route: blocked sections turn amber, never green.
for(let i=1;i<route.length;i++){const a=nodes[route[i-1]],b=nodes[route[i]];line([[a.x,a.y],[b.x,b.y]],hazard(edge(a.id,b.id))==='dry'?'#d1f5b9':'#e7ad69',7)}
for(const n of nodes){circle(n.x,n.y,7,'#566b62');circle(n.x,n.y,3,'#dfdfba')}
const home=nodes[config().start],shelter=nodes[config().goal];circle(home.x,home.y,23,'#bc8656');text('H',home.x,home.y+7,21);label(t('home'),home.x,home.y+41);circle(shelter.x,shelter.y,27,'#356f52');line([[shelter.x-12,shelter.y],[shelter.x-2,shelter.y+9],[shelter.x+15,shelter.y-12]],'#e1f6ca',6);label(t('safe'),shelter.x,shelter.y-40,'#244e3a','#d7e9bc');
label(t('hill'),500,28,'#dbe9d1','#465f50');text(t('river'),500,748,14,'#dae7dc');
const n=nodes[current];let px=n.x,py=n.y;if(leg){const b=nodes[leg.to];px+=(b.x-px)*leg.u;py+=(b.y-py)*leg.u}if(mode!=='idle'){circle(px,py,20,'#f7d29c55');circle(px,py,14,'#d69c59');for(let k=0;k<3;k++){const x=px+(k-1)*12,y=py+(k===1?-7:7);circle(x,y-6,k===1?5:4,'#ebc69c');rect(x-4,y,8,k===1?12:9,k===1?'#b45f48':'#e7d9b0',3)}if(mode==='plan')circle(route.at(-1)!==undefined?nodes[route.at(-1)].x:px,route.at(-1)!==undefined?nodes[route.at(-1)].y:py,5,'#fcf9da')}
if(!reduced&&!paused&&mode!=='idle'&&mode!=='won'){ctx.save();ctx.globalAlpha=.2;for(let i=0;i<45+phase*10;i++){const x=(i*173+anim*.08)%1050,y=(i*89+anim*.3)%800;line([[x,y],[x-5,y+12]],'#e7eecb',1)}ctx.restore()}}
function frame(stamp){const dt=lastFrame?Math.min((stamp-lastFrame)/1000,.1):0;lastFrame=stamp;update(dt);draw(stamp);requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
</script></body></html>
