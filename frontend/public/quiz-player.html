<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suraksha Quiz: reference player</title>
<style>
:root{--ink:#14232C;--paper:#F1F5F4;--card:#FFFFFF;--line:#C9D7D5;--primary:#1B5E67;--primary-ink:#FFFFFF;--safe:#1F7A45;--safe-bg:#E3F3EA;--wrong:#A93A28;--wrong-bg:#FBE9E5;--muted:#4C6168}
@media (prefers-color-scheme:dark){:root{--ink:#E8F0EF;--paper:#0F1A1F;--card:#17262D;--line:#2D434C;--primary:#58B3BE;--primary-ink:#0B1519;--safe:#6BD39A;--safe-bg:#12301F;--wrong:#F08A78;--wrong-bg:#37191A;--muted:#9DB3B9}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 "Noto Sans","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 4px}
h2{font-size:1.25rem;line-height:1.3;margin:0 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:.92rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1:focus,h2:focus{outline:none}
.list{display:grid;gap:10px;margin-top:16px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px}
.row:hover{border-color:var(--primary)}
.row b{display:block}
.back{background:none;border:0;padding:6px 0;color:var(--primary);font-weight:600}
.chip{display:inline-block;font-size:.8rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--primary)}
.q{font-size:1.2rem;font-weight:700;line-height:1.35;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt:disabled{cursor:default}
.opt .mark{flex:0 0 1.4em;font-weight:700}
.opt.right{border-color:var(--safe);background:var(--safe-bg)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.fb{margin-top:16px;padding:12px 14px;border-left:4px solid var(--primary);background:var(--card);border-radius:0 8px 8px 0}
.fb strong.ok{color:var(--safe)} .fb strong.no{color:var(--wrong)}
.btn{display:inline-block;background:var(--primary);color:var(--primary-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:700;margin-top:16px}
.btn.alt{background:none;color:var(--primary);border:1.5px solid var(--primary);margin-left:8px}
.score{font-size:2.4rem;font-weight:800;line-height:1.1;margin:8px 0}
.miss{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.devnote{margin-top:36px;padding-top:12px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>

<script>
const BANK = JSON.parse(document.getElementById('bank').textContent);
const app = document.getElementById('app');
const PASS = BANK.defaults.passingScorePercent;
const KEY = 'suraksha.quiz.best.v1';
const PHASE = {before:'Before', during:'During', after:'After', general:'General'};
let best = {}; try { best = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
function saveBest(id, pct){ if (pct > (best[id] ?? -1)) { best[id] = pct; try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (e) {} } }
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const anims = h => BANK.animations.filter(a => a.hazard === h.id);

let S = {};
function focusTitle(){ const t = app.querySelector('[data-title]'); if (t) { t.setAttribute('tabindex','-1'); t.focus(); } }

function home(){
  S = {};
  app.innerHTML = `<h1 data-title>Suraksha quiz</h1><p class="muted">Test what you learned from the safety animations. Pick a hazard.</p>
  <div class="list">${BANK.hazards.map(h => { const as = anims(h); const nq = as.reduce((n,a)=>n+a.questions.length,0);
    return `<button class="row" data-h="${h.id}"><b>${esc(h.name)}</b><span class="muted">${esc(h.description)}<br>${as.length} animation${as.length>1?'s':''}, ${nq} questions</span></button>`; }).join('')}</div>
  <p class="muted devnote">Reference player for the Suraksha quiz bank. Use it to preview behaviour; rebuild the UI in your own app.</p>`;
  app.querySelectorAll('[data-h]').forEach(b => b.onclick = () => hazard(b.dataset.h));
  focusTitle();
}
function hazard(id){
  const h = BANK.hazards.find(x => x.id === id);
  app.innerHTML = `<button class="back">‹ All hazards</button><h1 data-title>${esc(h.name)}</h1>
  <div class="list">${anims(h).map(a => `<button class="row" data-a="${a.animationId}"><b>${esc(a.title)}</b>
    <span class="chip">${PHASE[a.phase]}</span><span class="muted">${a.questions.length} questions${best[a.animationId]!=null?` · best ${best[a.animationId]}%`:''}</span></button>`).join('')}</div>`;
  app.querySelector('.back').onclick = home;
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => start(b.dataset.a));
  focusTitle();
}
function start(id){ const a = BANK.animations.find(x => x.animationId === id); S = {a, i:0, picked:null, results:[]}; question(); }
function question(){
  const {a,i} = S, q = a.questions[i], total = a.questions.length;
  app.innerHTML = `<button class="back">‹ ${esc(a.title)}</button>
  <div class="muted">Question ${i+1} of ${total}</div><div class="bar" aria-hidden="true"><i style="width:${(i/total)*100}%"></i></div>
  <h2 class="q" data-title>${esc(q.question)}</h2>
  <div class="opts">${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><span class="mark" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb" aria-live="polite"></div>`;
  app.querySelector('.back').onclick = () => hazard(a.hazard);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  focusTitle();
}
function answer(k){
  const {a,i} = S, q = a.questions[i], ok = k === q.correctIndex;
  S.results.push({q, k, ok});
  app.querySelectorAll('.opt').forEach((b,n) => { b.disabled = true;
    if (n === q.correctIndex){ b.classList.add('right'); b.querySelector('.mark').textContent = '✓'; }
    else if (n === k){ b.classList.add('wrong'); b.querySelector('.mark').textContent = '✗'; } });
  const last = i === a.questions.length - 1;
  document.getElementById('fb').innerHTML = `<div class="fb"><strong class="${ok?'ok':'no'}">${ok?'Correct.':'Not quite.'}</strong> ${esc(q.explanation)}</div>
  <button class="btn" id="next">${last?'See result':'Next question'}</button>`;
  const n = document.getElementById('next'); n.focus(); n.onclick = () => { if (last) result(); else { S.i++; question(); } };
}
function result(){
  const {a,results} = S, right = results.filter(r => r.ok).length, total = results.length, pct = Math.round(right/total*100), pass = pct >= PASS;
  saveBest(a.animationId, pct);
  const missed = results.filter(r => !r.ok);
  app.innerHTML = `<h1 data-title>${pass?'Well done':'Keep practising'}</h1>
  <div class="score">${right} of ${total}</div><p>${pass?'You passed.':`You need ${PASS}% to pass. Watch the animation again and retry.`}</p>
  ${missed.length?`<h2>Review</h2>${missed.map(r=>`<div class="miss"><b>${esc(r.q.question)}</b><br><span class="muted">Answer:</span> ${esc(r.q.options[r.q.correctIndex])}<br><span class="muted">${esc(r.q.explanation)}</span></div>`).join('')}`:'<p>You answered every question correctly.</p>'}
  <button class="btn" id="retry">Try again</button><button class="btn alt" id="done">Back to animations</button>`;
  document.getElementById('retry').onclick = () => start(a.animationId);
  document.getElementById('done').onclick = () => hazard(a.hazard);
  focusTitle();
}

const params = new URLSearchParams(window.location.search);
const pAnim = params.get('animationId') || params.get('anim');
const pHazard = params.get('hazardId') || params.get('hazard');
if (pAnim) {
  play(pAnim);
} else if (pHazard) {
  hazard(pHazard);
} else {
  home();
}
</script>
</body>
</html>
